---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Exercise logical database separation
      block:
        - name: Write the Redmine database test key
          ansible.builtin.command: redis-cli -n 0 SET molecule:shared-owner redmine EX 60
          changed_when: true

        - name: Write the Zammad database test key
          ansible.builtin.command: redis-cli -n 1 SET molecule:shared-owner zammad EX 60
          changed_when: true

        - name: Read the Redmine database test key
          ansible.builtin.command: redis-cli --raw -n 0 GET molecule:shared-owner
          changed_when: false
          register: shared_redmine_value

        - name: Read the Zammad database test key
          ansible.builtin.command: redis-cli --raw -n 1 GET molecule:shared-owner
          changed_when: false
          register: shared_zammad_value

        - name: Verify identical keys remain isolated by database
          ansible.builtin.assert:
            that:
              - shared_redmine_value.stdout == 'redmine'
              - shared_zammad_value.stdout == 'zammad'
      always:
        - name: Remove isolated test keys
          ansible.builtin.command: redis-cli -n {{ item }} DEL molecule:shared-owner
          changed_when: true
          loop:
            - 0
            - 1
