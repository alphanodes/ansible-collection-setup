---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read the generated gitlab.rb
      ansible.builtin.slurp:
        src: /etc/gitlab/gitlab.rb
      register: gitlab_rb

    - name: Decode gitlab.rb
      ansible.builtin.set_fact:
        gitlab_rb_content: "{{ gitlab_rb.content | b64decode }}"

    - name: Assert pages is enabled with its external url
      ansible.builtin.assert:
        that:
          - "\"gitlab_pages['enable'] = true\" in gitlab_rb_content"
          - "\"pages_external_url 'https://pages.example.com'\" in gitlab_rb_content"
        fail_msg: pages is not configured in gitlab.rb

    - name: Assert the wildcard certificate is wired into the bundled nginx
      ansible.builtin.assert:
        that:
          - "\"pages_nginx['ssl_certificate'] = '/etc/gitlab/ssl/pages-wildcard.crt'\" in gitlab_rb_content"
          - "\"pages_nginx['ssl_certificate_key'] = '/etc/gitlab/ssl/pages-wildcard.key'\" in gitlab_rb_content"
          - "\"pages_nginx['redirect_http_to_https'] = true\" in gitlab_rb_content"
        fail_msg: the pages certificate is not configured for the bundled nginx

    # The daemon binding these itself needs a secondary IP, because the bundled
    # nginx already listens on port 80 and 443. Leaving them in silently breaks
    # pages, which is what the old template did.
    - name: Assert the pages daemon does not bind the external ports itself
      ansible.builtin.assert:
        that:
          - "\"gitlab_pages['external_http']\" not in gitlab_rb_content"
          - "\"gitlab_pages['external_https']\" not in gitlab_rb_content"
        fail_msg: pages daemon binds the external ports, which collides with the bundled nginx

    - name: Read the generated pages nginx configuration
      ansible.builtin.slurp:
        src: /var/opt/gitlab/nginx/conf/service_conf/gitlab-pages.conf
      register: pages_nginx_conf

    - name: Assert nginx serves the wildcard pages domain with the certificate
      ansible.builtin.assert:
        that:
          - "'/etc/gitlab/ssl/pages-wildcard.crt' in pages_nginx_conf.content | b64decode"
        fail_msg: nginx does not use the wildcard certificate for pages

    # Omnibus binds the pages vhost to IPv4 only by default. Over IPv6 the
    # GitLab vhost would answer with its own certificate.
    - name: Assert the pages vhost also listens on IPv6
      ansible.builtin.assert:
        that:
          - "\"pages_nginx['listen_addresses'] = [\\\"*\\\", \\\"[::]\\\"]\" in gitlab_rb_content"
          - "'listen [::]:443 ssl' in pages_nginx_conf.content | b64decode"
        fail_msg: the pages vhost of the bundled nginx does not listen on IPv6

    - name: Read the generated GitLab nginx configuration
      ansible.builtin.slurp:
        src: /var/opt/gitlab/nginx/conf/service_conf/gitlab-rails.conf
      register: rails_nginx_conf

    - name: Assert nginx blocks the crawler networks and user agents
      ansible.builtin.assert:
        that:
          - "'deny 192.0.2.0/24;' in rails_nginx_conf_content"
          - "'deny 2001:db8::/32;' in rails_nginx_conf_content"
          - "'if ($http_user_agent ~* \"(GPTBot|ClaudeBot)\") { return 403; }' in rails_nginx_conf_content"
          - "'location ^~ /root/mirror/-/ {' in rails_nginx_conf_content"
        fail_msg: the crawler blocks are missing in the GitLab nginx configuration
      vars:
        rails_nginx_conf_content: '{{ rails_nginx_conf.content | b64decode }}'

    # nginx answers these without Rails, so they work while Puma still boots
    - name: Request a sign-in protected path without the sign-in cookie
      ansible.builtin.uri:
        url: https://127.0.0.1/root/mirror/-/tree/main
        headers:
          Host: gitlab-test.example.com
        validate_certs: false
        return_content: true
        status_code: 403
      register: anonymous_request

    - name: Assert the anonymous visitor gets the sign-in hint
      ansible.builtin.assert:
        that:
          - "'<a href=/users/sign_in>sign in</a>' in anonymous_request.content"
        fail_msg: the sign-in protected path does not show the sign-in hint

    # Any status but the nginx 403 means the request was passed on to GitLab
    - name: Request the same path with the sign-in cookie
      ansible.builtin.uri:
        url: https://127.0.0.1/root/mirror/-/tree/main
        headers:
          Host: gitlab-test.example.com
          Cookie: known_sign_in=any
        validate_certs: false
        return_content: true
        follow_redirects: none
        status_code: [200, 302, 404, 502, 503]
      register: signed_in_request

    - name: Assert the signed-in request is passed on to GitLab
      ansible.builtin.assert:
        that:
          - "'Sign in required' not in signed_in_request.content"
        fail_msg: the sign-in protected path blocks requests with the sign-in cookie

    - name: Request the anonymous git endpoint of the same project
      ansible.builtin.uri:
        url: https://127.0.0.1/root/mirror.git/info/refs?service=git-upload-pack
        headers:
          Host: gitlab-test.example.com
        validate_certs: false
        return_content: true
        follow_redirects: none
        status_code: [200, 302, 401, 404, 502, 503]
      register: git_request

    - name: Assert anonymous git is not blocked by the sign-in rule
      ansible.builtin.assert:
        that:
          - "'Sign in required' not in git_request.content"
        fail_msg: anonymous git requests are blocked by the sign-in rule

    - name: Read the puma memory limit of the memory watchdog
      ansible.builtin.slurp:
        src: /opt/gitlab/etc/gitlab-rails/env/PUMA_WORKER_MAX_MEMORY
      register: puma_max_memory

    - name: Assert the puma memory limit reached the memory watchdog
      ansible.builtin.assert:
        that:
          - puma_max_memory.content | b64decode | trim == '2048'
        fail_msg: 'unexpected puma memory limit: {{ puma_max_memory.content | b64decode }}'

    - name: Assert the log group is set in gitlab.rb
      ansible.builtin.assert:
        that:
          - "\"logging['log_group'] = 'adm'\" in gitlab_rb_content"
        fail_msg: the log group is not configured in gitlab.rb

    # reconfigure resets the mode of these directories, so readers must get
    # access through the group and not through ACL entries
    - name: Stat the runit log directories
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - /var/log/gitlab/gitaly
        - /var/log/gitlab/puma
        - /var/log/gitlab/sidekiq
        - /var/log/gitlab/nginx
      register: log_dirs

    - name: Assert the log directories are readable by the log group
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.gr_name == 'adm'
          - item.stat.mode == '0750'
        fail_msg: "{{ item.item }} is not readable by the log group"
      loop: '{{ log_dirs.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: List log directories that still have ACL entries
      ansible.builtin.command: getfacl --skip-base --absolute-names /var/log/gitlab/puma /var/log/gitlab/gitaly
      register: log_dir_acls
      changed_when: false

    - name: Assert the legacy ACL entries are removed
      ansible.builtin.assert:
        that:
          - log_dir_acls.stdout | length == 0
        fail_msg: "ACL entries left: {{ log_dir_acls.stdout }}"

    - name: Create a member of the log group
      ansible.builtin.user:
        name: logreader
        groups: adm
        shell: /usr/sbin/nologin
        create_home: false

    - name: Read a log file as member of the log group
      ansible.builtin.command: runuser -u logreader -- test -r /var/log/gitlab/puma/current
      changed_when: false

    # The deployed script is copied with a failing test command, a test
    # directory and a retention of one day, the rest stays unchanged
    - name: Read the deployed backup script
      ansible.builtin.slurp:
        src: /usr/local/bin/gitlab-backup-run
      register: backup_script

    - name: Assert the backup timer runs the backup script
      ansible.builtin.command: systemctl cat gitlab-backup.service
      register: backup_unit
      changed_when: false
      failed_when: "'ExecStart=/usr/local/bin/gitlab-backup-run' not in backup_unit.stdout"

    - name: Create the backup script test copy
      ansible.builtin.copy:
        content: >-
          {{ backup_script.content | b64decode
             | regex_replace('(?m)^backup_dir=.*$', 'backup_dir=/tmp/backup-test')
             | regex_replace('(?m)^keep_time=.*$', 'keep_time=86400')
             | regex_replace('(?m)^/opt/gitlab/bin/gitlab-backup create$',
                             "sh -c 'touch /tmp/backup-test/$(date +%s)_2026_01_01_19.0.0-ee_gitlab_backup.tar; exit 1'") }}
        dest: /tmp/gitlab-backup-run-test
        mode: '0755'

    - name: Read the status vhost of the bundled nginx
      ansible.builtin.slurp:
        src: /var/opt/gitlab/nginx/conf/nginx-status.conf
      register: gitlab_nginx_status_conf

    - name: Verify the status page only listens locally
      ansible.builtin.assert:
        that:
          - "'listen 127.0.0.1:8060' in gitlab_nginx_status_conf.content | b64decode"
          - "'listen *:8060' not in gitlab_nginx_status_conf.content | b64decode"
        fail_msg: "{{ gitlab_nginx_status_conf.content | b64decode }}"

    - name: Get the current time
      ansible.builtin.command: date +%s
      register: test_now
      changed_when: false

    - name: Create the backup test directory
      ansible.builtin.file:
        path: /tmp/backup-test
        state: directory
        mode: '0700'

    - name: Create expired backups and an unrelated file
      ansible.builtin.file:
        path: '/tmp/backup-test/{{ item }}'
        state: touch
        mode: '0644'
      loop:
        - "{{ test_now.stdout | int - 5 * 86400 }}_2026_01_01_19.0.0-ee_gitlab_backup.tar"
        - "{{ test_now.stdout | int - 3 * 86400 }}_2026_01_01_19.0.0-ee_gitlab_backup.tar"
        - unrelated.txt

    - name: Run the backup script with the failing test command
      ansible.builtin.command: /tmp/gitlab-backup-run-test
      register: backup_run
      changed_when: false
      failed_when: backup_run.rc != 1

    - name: List the test backup directory
      ansible.builtin.find:
        paths: /tmp/backup-test
        patterns: '*'
      register: backup_files

    # the partial archive of the failed run and the older expired backup are
    # gone, the newest backup stays although it is expired
    - name: Assert only the newest backup and the unrelated file are left
      ansible.builtin.assert:
        that:
          - backup_files.files | map(attribute='path') | map('basename') | sort | list ==
            [(test_now.stdout | int - 3 * 86400) ~ '_2026_01_01_19.0.0-ee_gitlab_backup.tar', 'unrelated.txt']
        fail_msg: "unexpected files after the failed run: {{ backup_files.files | map(attribute='path') | list }}"

    - name: Stat the project defaults timer
      ansible.builtin.stat:
        path: /etc/systemd/system/gitlab-project-defaults.timer
      register: project_defaults_timer

    - name: Assert the project defaults timer is installed
      ansible.builtin.assert:
        that:
          - project_defaults_timer.stat.exists
        fail_msg: the project defaults timer is missing

    # One project per case: default, override, skipped by an empty override,
    # an archived project, which is skipped, and a project with its own value,
    # which must stay unchanged
    - name: Create test projects for the project defaults
      ansible.builtin.command:
        cmd: >-
          /opt/gitlab/bin/gitlab-rails runner "
          user = User.find_by_username!('root');
          %w[app log skip-me archived own].each do |path|
            next if Project.find_by_full_path(\"root/#{path}\");
            project = Projects::CreateService.new(user, name: path, path: path, namespace_id: user.namespace.id).execute;
            raise project.errors.full_messages.join(', ') unless project.persisted?;
          end;
          Project.find_by_full_path('root/archived').update!(archived: true);
          own = Project.find_by_full_path('root/own');
          own.ci_cd_settings.update!(delete_pipelines_in_seconds: 30.days.to_i)
          "
      changed_when: false

    - name: Run the project defaults service
      ansible.builtin.systemd_service:
        name: gitlab-project-defaults.service
        state: started
      changed_when: false

    - name: Read the pipeline cleanup of the test projects
      ansible.builtin.command:
        cmd: >-
          /opt/gitlab/bin/gitlab-rails runner "
          values = %w[app log skip-me archived own].to_h { |path| [path, Project.find_by_full_path(\"root/#{path}\").ci_cd_settings.delete_pipelines_in_seconds] };
          puts values.to_json
          "
      register: project_defaults_result
      changed_when: false

    - name: Assert the pipeline cleanup was filled in only where it was missing
      vars:
        cleanup: '{{ project_defaults_result.stdout_lines | last | from_json }}'
      ansible.builtin.assert:
        that:
          - cleanup['app'] == 15552000
          - cleanup['log'] == 1209600
          - cleanup['skip-me'] is none
          - cleanup['archived'] is none
          - cleanup['own'] == 2592000
        fail_msg: 'unexpected pipeline cleanup values: {{ cleanup }}'
