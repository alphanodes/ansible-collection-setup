---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read the generated gitlab.rb
      ansible.builtin.slurp:
        src: /etc/gitlab/gitlab.rb
      register: gitlab_rb

    - name: Decode gitlab.rb
      ansible.builtin.set_fact:
        gitlab_rb_content: "{{ gitlab_rb.content | b64decode }}"

    - name: Assert pages is enabled with its external url
      ansible.builtin.assert:
        that:
          - "\"gitlab_pages['enable'] = true\" in gitlab_rb_content"
          - "\"pages_external_url 'https://pages.example.com'\" in gitlab_rb_content"
        fail_msg: pages is not configured in gitlab.rb

    - name: Assert the wildcard certificate is wired into the bundled nginx
      ansible.builtin.assert:
        that:
          - "\"pages_nginx['ssl_certificate'] = '/etc/gitlab/ssl/pages-wildcard.crt'\" in gitlab_rb_content"
          - "\"pages_nginx['ssl_certificate_key'] = '/etc/gitlab/ssl/pages-wildcard.key'\" in gitlab_rb_content"
          - "\"pages_nginx['redirect_http_to_https'] = true\" in gitlab_rb_content"
        fail_msg: the pages certificate is not configured for the bundled nginx

    # The daemon binding these itself needs a secondary IP, because the bundled
    # nginx already listens on port 80 and 443. Leaving them in silently breaks
    # pages, which is what the old template did.
    - name: Assert the pages daemon does not bind the external ports itself
      ansible.builtin.assert:
        that:
          - "\"gitlab_pages['external_http']\" not in gitlab_rb_content"
          - "\"gitlab_pages['external_https']\" not in gitlab_rb_content"
        fail_msg: pages daemon binds the external ports, which collides with the bundled nginx

    - name: Read the generated pages nginx configuration
      ansible.builtin.slurp:
        src: /var/opt/gitlab/nginx/conf/service_conf/gitlab-pages.conf
      register: pages_nginx_conf

    - name: Assert nginx serves the wildcard pages domain with the certificate
      ansible.builtin.assert:
        that:
          - "'/etc/gitlab/ssl/pages-wildcard.crt' in pages_nginx_conf.content | b64decode"
        fail_msg: nginx does not use the wildcard certificate for pages

    - name: Assert the log group is set in gitlab.rb
      ansible.builtin.assert:
        that:
          - "\"logging['log_group'] = 'adm'\" in gitlab_rb_content"
        fail_msg: the log group is not configured in gitlab.rb

    # reconfigure resets the mode of these directories, so readers must get
    # access through the group and not through ACL entries
    - name: Stat the runit log directories
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - /var/log/gitlab/gitaly
        - /var/log/gitlab/puma
        - /var/log/gitlab/sidekiq
        - /var/log/gitlab/nginx
      register: log_dirs

    - name: Assert the log directories are readable by the log group
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.gr_name == 'adm'
          - item.stat.mode == '0750'
        fail_msg: "{{ item.item }} is not readable by the log group"
      loop: '{{ log_dirs.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: List log directories that still have ACL entries
      ansible.builtin.command: getfacl --skip-base --absolute-names /var/log/gitlab/puma /var/log/gitlab/gitaly
      register: log_dir_acls
      changed_when: false

    - name: Assert the legacy ACL entries are removed
      ansible.builtin.assert:
        that:
          - log_dir_acls.stdout | length == 0
        fail_msg: "ACL entries left: {{ log_dir_acls.stdout }}"

    - name: Create a member of the log group
      ansible.builtin.user:
        name: logreader
        groups: adm
        shell: /usr/sbin/nologin
        create_home: false

    - name: Read a log file as member of the log group
      ansible.builtin.command: runuser -u logreader -- test -r /var/log/gitlab/puma/current
      changed_when: false

    # The deployed script is copied with a failing test command, a test
    # directory and a retention of one day, the rest stays unchanged
    - name: Read the deployed backup script
      ansible.builtin.slurp:
        src: /usr/local/bin/gitlab-backup-run
      register: backup_script

    - name: Assert the backup timer runs the backup script
      ansible.builtin.command: systemctl cat gitlab-backup.service
      register: backup_unit
      changed_when: false
      failed_when: "'ExecStart=/usr/local/bin/gitlab-backup-run' not in backup_unit.stdout"

    - name: Create the backup script test copy
      ansible.builtin.copy:
        content: >-
          {{ backup_script.content | b64decode
             | regex_replace('(?m)^backup_dir=.*$', 'backup_dir=/tmp/backup-test')
             | regex_replace('(?m)^keep_time=.*$', 'keep_time=86400')
             | regex_replace('(?m)^/opt/gitlab/bin/gitlab-backup create$',
                             "sh -c 'touch /tmp/backup-test/$(date +%s)_2026_01_01_19.0.0-ee_gitlab_backup.tar; exit 1'") }}
        dest: /tmp/gitlab-backup-run-test
        mode: '0755'

    - name: Get the current time
      ansible.builtin.command: date +%s
      register: test_now
      changed_when: false

    - name: Create the backup test directory
      ansible.builtin.file:
        path: /tmp/backup-test
        state: directory
        mode: '0700'

    - name: Create expired backups and an unrelated file
      ansible.builtin.file:
        path: '/tmp/backup-test/{{ item }}'
        state: touch
        mode: '0644'
      loop:
        - "{{ test_now.stdout | int - 5 * 86400 }}_2026_01_01_19.0.0-ee_gitlab_backup.tar"
        - "{{ test_now.stdout | int - 3 * 86400 }}_2026_01_01_19.0.0-ee_gitlab_backup.tar"
        - unrelated.txt

    - name: Run the backup script with the failing test command
      ansible.builtin.command: /tmp/gitlab-backup-run-test
      register: backup_run
      changed_when: false
      failed_when: backup_run.rc != 1

    - name: List the test backup directory
      ansible.builtin.find:
        paths: /tmp/backup-test
        patterns: '*'
      register: backup_files

    # the partial archive of the failed run and the older expired backup are
    # gone, the newest backup stays although it is expired
    - name: Assert only the newest backup and the unrelated file are left
      ansible.builtin.assert:
        that:
          - backup_files.files | map(attribute='path') | map('basename') | sort | list ==
            [(test_now.stdout | int - 3 * 86400) ~ '_2026_01_01_19.0.0-ee_gitlab_backup.tar', 'unrelated.txt']
        fail_msg: "unexpected files after the failed run: {{ backup_files.files | map(attribute='path') | list }}"
