---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

    - name: Install OpenSSL for self-signed certificate
      ansible.builtin.apt:
        name: openssl
        state: present

    - name: Create /etc/gitlab/ssl directory
      ansible.builtin.file:
        path: /etc/gitlab/ssl
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Generate self-signed SSL certificate for testing
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout /etc/gitlab/ssl/gitlab-test.example.com.key
          -out /etc/gitlab/ssl/gitlab-test.example.com.crt
          -subj "/C=US/ST=Test/L=Test/O=Test/CN=gitlab-test.example.com"
        creates: /etc/gitlab/ssl/gitlab-test.example.com.crt

    - name: Generate self-signed wildcard certificate for the pages domain
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout /etc/gitlab/ssl/pages-wildcard.key
          -out /etc/gitlab/ssl/pages-wildcard.crt
          -subj "/C=US/ST=Test/L=Test/O=Test/CN=*.pages.example.com"
          -addext "subjectAltName=DNS:*.pages.example.com,DNS:pages.example.com"
        creates: /etc/gitlab/ssl/pages-wildcard.crt

    - name: Install acl for the legacy log ACL test
      ansible.builtin.apt:
        name: acl
        state: present

    # Hosts that granted log access by ACL before, the role has to remove it.
    # Only before the first install, so idempotence is not affected.
    - name: Create a log directory with a legacy ACL entry
      ansible.builtin.shell: >-
        mkdir -p /var/log/gitlab/puma
        && chmod 0700 /var/log/gitlab/puma
        && setfacl -m u:nobody:rx /var/log/gitlab/puma
      args:
        creates: /opt/gitlab/bin/gitlab-ctl

  vars:
    # Use a valid FQDN for testing
    gitlab_vhost_server: gitlab-test.example.com
    # Disable Let's Encrypt for testing (use self-signed cert instead)
    gitlab_vhost_letsencrypt: false
    # Pages behind the bundled nginx with a wildcard certificate. The daemon
    # must not bind port 80 and 443 itself here - the nginx already holds them.
    gitlab_pages_enabled: true
    gitlab_pages_domain: pages.example.com
    gitlab_pages_nginx_ssl_certificate: /etc/gitlab/ssl/pages-wildcard.crt
    gitlab_pages_nginx_ssl_certificate_key: /etc/gitlab/ssl/pages-wildcard.key

  roles:
    - role: alphanodes.setup.common
    - role: alphanodes.setup.gitlab_omnibus

  post_tasks:
    - name: Verify GitLab configuration file exists
      ansible.builtin.stat:
        path: /etc/gitlab/gitlab.rb
      register: gitlab_config

    - name: Check gitlab_omnibus role completed
      ansible.builtin.debug:
        msg: "GitLab Omnibus role executed successfully - config exists: {{ gitlab_config.stat.exists }}"
