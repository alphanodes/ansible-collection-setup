---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  roles:
    - role: alphanodes.setup.common
  tasks:
    - name: Check if fail2ban is running
      ansible.builtin.service:
        name: fail2ban
        state: started
      check_mode: true
      register: fail2ban_service
      failed_when: fail2ban_service.changed

    - name: Check fail2ban configuration syntax
      ansible.builtin.command: fail2ban-client -t
      register: fail2ban_syntax
      changed_when: false

    - name: Check if jail.local exists
      ansible.builtin.stat:
        path: /etc/fail2ban/jail.local
      register: jail_config

    - name: Verify jail.local contains basic configuration
      ansible.builtin.command: grep -q "ignoreip" /etc/fail2ban/jail.local
      register: basic_config
      changed_when: false

    - name: Check if Matrix configuration is disabled (default)
      ansible.builtin.stat:
        path: /etc/fail2ban/action.d/matrix.conf
      register: matrix_config

    - name: Check if Matrix script is disabled (default)
      ansible.builtin.stat:
        path: /etc/fail2ban/action.d/matrix.sh
      register: matrix_script

    - name: Verify Matrix actions are not present in jail.local (default)
      ansible.builtin.command: grep -q "action_with_matrix" /etc/fail2ban/jail.local
      register: matrix_actions
      changed_when: false
      failed_when: false

    - name: Check if SSH jail is enabled
      ansible.builtin.command: fail2ban-client status
      register: fail2ban_status
      changed_when: false

    - name: Verify SSH jail is running
      ansible.builtin.command: fail2ban-client status sshd
      register: sshd_jail_status
      changed_when: false
      failed_when: false

    - name: Check if nginx-http-auth jail is enabled
      ansible.builtin.command: fail2ban-client status nginx-http-auth
      register: nginx_jail_status
      changed_when: false
      failed_when: false

    - name: Check if nginx-form jail is enabled
      ansible.builtin.command: fail2ban-client status nginx-form
      register: nginx_form_jail
      changed_when: false
      failed_when: nginx_form_jail.rc != 0

    - name: Write sample access log for the nginx-form filter
      ansible.builtin.copy:
        dest: /tmp/nginx-form-sample.log
        mode: '0644'
        content: |
          192.0.2.10 - - [25/Sep/2026:10:00:00 +0200] "POST /de/kontakt HTTP/1.1" 200 512 "-" "bot"
          192.0.2.11 - - [25/Sep/2026:10:00:01 +0200] "POST /contact?x=1 HTTP/2.0" 303 0 "-" "bot"
          192.0.2.12 - - [25/Sep/2026:10:00:02 +0200] "GET /de/kontakt HTTP/1.1" 200 512 "-" "visitor"
          192.0.2.13 - - [25/Sep/2026:10:00:03 +0200] "POST /de/kontakt-info HTTP/1.1" 200 512 "-" "visitor"
          192.0.2.14 - - [25/Sep/2026:10:00:04 +0200] "POST /wp/ HTTP/1.1" 404 0 "-" "scanner"
      changed_when: false

    # Only POST requests to exactly the configured form paths may match
    - name: Test nginx-form filter against sample lines
      ansible.builtin.command: >-
        fail2ban-regex /tmp/nginx-form-sample.log
        nginx-form[form_paths="/(de/)?kontakt|/contact"]
      register: nginx_form_regex
      changed_when: false

    - name: Verify nginx-form filter matches only form submissions
      ansible.builtin.assert:
        that:
          - "'Lines: 5 lines, 0 ignored, 2 matched, 3 missed' in nginx_form_regex.stdout"
        fail_msg: "{{ nginx_form_regex.stdout }}"
        success_msg: "nginx-form filter matches POST requests to the form paths only"

    - name: Write sample access log for the nginx-scan filter
      ansible.builtin.copy:
        dest: /tmp/nginx-scan-sample.log
        mode: '0644'
        content: |
          192.0.2.20 - - [25/Sep/2026:10:00:00 +0200] "POST /_next/static/chunks/react-flight HTTP/1.1" 500 0 "-" "scanner"
          192.0.2.21 - - [25/Sep/2026:10:00:01 +0200] "POST /_react/flight HTTP/1.1" 404 0 "-" "scanner"
          192.0.2.22 - - [25/Sep/2026:10:00:02 +0200] "GET /wp-login.php HTTP/1.1" 404 0 "-" "scanner"
          192.0.2.23 - - [25/Sep/2026:10:00:03 +0200] "GET /issues/123 HTTP/1.1" 200 512 "-" "visitor"
          192.0.2.24 - - [25/Sep/2026:10:00:04 +0200] "GET /assets/_next.css HTTP/1.1" 200 512 "-" "visitor"
      changed_when: false

    # Framework and exploit paths match, regular pages do not
    - name: Test nginx-scan filter against sample lines
      ansible.builtin.command: fail2ban-regex /tmp/nginx-scan-sample.log nginx-scan
      register: nginx_scan_regex
      changed_when: false

    - name: Verify nginx-scan filter matches only scan requests
      ansible.builtin.assert:
        that:
          - "'Lines: 5 lines, 0 ignored, 3 matched, 2 missed' in nginx_scan_regex.stdout"
        fail_msg: "{{ nginx_scan_regex.stdout }}"
        success_msg: "nginx-scan filter matches framework and exploit paths only"

    - name: Get journalmatch of the drupal-honeypot jail
      ansible.builtin.command: fail2ban-client get drupal-honeypot journalmatch
      register: drupal_honeypot_journalmatch
      changed_when: false

    - name: Verify drupal-honeypot jail reads the drupal journal entries
      ansible.builtin.assert:
        that:
          - "'SYSLOG_IDENTIFIER=drupal' in drupal_honeypot_journalmatch.stdout"
        fail_msg: "{{ drupal_honeypot_journalmatch.stdout }}"

    # Only entries of this run count, verify may run repeatedly
    - name: Get current journal cursor
      ansible.builtin.command: journalctl -n 0 --show-cursor --no-pager
      register: journal_cursor
      changed_when: false

    # Lines in the format of the Drupal core module syslog
    - name: Write sample drupal entries to the journal
      ansible.builtin.command: logger -t drupal -- {{ item }}
      loop:
        - 'https://example.com|1793171605|honeypot|192.0.2.30|https://example.com/de/kontakt|https://example.com/de/kontakt|0||Blocked submission of webform_submission_contact_add_form due to Das Formular wurde zu schnell abgeschickt.'
        - 'https://example.com|1793171606|user|192.0.2.31|https://example.com/user/login|https://example.com/user/login|0||Login attempt failed for admin.'
        - 'https://example.com|1793171607|cron|127.0.0.1|https://example.com/||0||Cron run completed.'
      changed_when: false

    # The running jail has to ban from the journal (maxretry 1)
    - name: Wait until drupal-honeypot banned the sample address
      ansible.builtin.command: fail2ban-client get drupal-honeypot banip
      register: drupal_honeypot_banned
      until: "'192.0.2.30' in drupal_honeypot_banned.stdout"
      retries: 10
      delay: 2
      changed_when: false

    - name: Export drupal journal entries in syslog format
      ansible.builtin.shell: >-
        journalctl -t drupal -o short --no-pager
        --after-cursor={{ journal_cursor.stdout_lines | last | regex_replace('^-- cursor: ', '') | quote }}
        > /tmp/drupal-journal.log
      changed_when: false

    - name: Test drupal filters against the journal entries
      ansible.builtin.command: fail2ban-regex /tmp/drupal-journal.log {{ item }}
      loop:
        - drupal-honeypot
        - drupal-login
      register: drupal_regex
      changed_when: false

    - name: Verify each drupal filter matches only its own entry
      ansible.builtin.assert:
        that:
          - "'Lines: 3 lines, 0 ignored, 1 matched, 2 missed' in item.stdout"
        fail_msg: "{{ item.stdout }}"
      loop: '{{ drupal_regex.results }}'
      loop_control:
        label: '{{ item.item }}'

    # Dovecot 2.4 and 2.3 failures match, successful logins do not
    - name: Write sample dovecot log
      ansible.builtin.copy:
        dest: /tmp/dovecot-sample.log
        mode: '0644'
        content: |
          Oct 28 08:36:22 instance dovecot[8094]: imap-login: Login aborted: Logged out (auth failed, 1 attempts in 3 secs) (auth_failed): user=<nobody@example.com>, method=PLAIN, rip=192.0.2.40, lip=192.0.2.1, secured, session=<3K0DdeJeqMt/AAAB>
          Oct 28 08:36:23 instance dovecot[8094]: imap-login: Disconnected (auth failed, 2 attempts in 9 secs): user=<nobody@example.com>, method=PLAIN, rip=192.0.2.41, lip=192.0.2.1, TLS, session=<abc>
          Oct 28 08:36:24 instance dovecot[8094]: imap-login: Login: user=<user@example.com>, method=PLAIN, rip=192.0.2.42, lip=192.0.2.1, mpid=123, TLS, session=<def>
      changed_when: false

    - name: Test dovecot filter against sample lines
      ansible.builtin.command: fail2ban-regex /tmp/dovecot-sample.log dovecot
      register: dovecot_regex
      changed_when: false

    - name: Verify dovecot filter matches failed logins of 2.4 and 2.3
      ansible.builtin.assert:
        that:
          - "'Lines: 3 lines, 0 ignored, 2 matched, 1 missed' in dovecot_regex.stdout"
        fail_msg: "{{ dovecot_regex.stdout }}"

    - name: Verify recidive jail is running
      ansible.builtin.command: fail2ban-client status recidive
      changed_when: false

    - name: Verify fail2ban log file exists
      ansible.builtin.stat:
        path: /var/log/fail2ban.log
      register: fail2ban_log

    - name: Check iptables rules created by fail2ban
      ansible.builtin.command: iptables -L f2b-sshd
      register: iptables_rules
      changed_when: false
      failed_when: false

    - name: Test Matrix configuration with complete setup
      block:
        - name: Create test Matrix configuration
          ansible.builtin.template:
            src: ../../roles/fail2ban/templates/messenger.sh.j2
            dest: /tmp/test-matrix.sh
            mode: '0755'
          vars:
            fail2ban_matrix_server: "https://matrix.example.com"
            fail2ban_matrix_token: "test_token_12345"
            fail2ban_matrix_room_id: "!test:example.com"

        - name: Verify Matrix script syntax
          ansible.builtin.command: bash -n /tmp/test-matrix.sh
          register: matrix_script_syntax
          changed_when: false

        - name: Test Matrix script execution (dry-run)
          ansible.builtin.command: bash -c "echo 'Test ban message for _country_ 192.168.1.100' | head -1"
          register: matrix_test_message
          changed_when: false

        - name: Clean up test files
          ansible.builtin.file:
            path: /tmp/test-matrix.sh
            state: absent
      rescue:
        - name: Matrix test failed
          ansible.builtin.debug:
            msg: "Matrix configuration test failed - this is expected in test environment"

    - name: Display comprehensive test results
      ansible.builtin.debug:
        msg:
          - "=== FAIL2BAN ROLE VERIFICATION RESULTS ==="
          - "fail2ban service: {{ 'OK' if not fail2ban_service.changed else 'FAILED' }}"
          - "fail2ban syntax: {{ 'OK' if fail2ban_syntax.rc == 0 else 'FAILED' }}"
          - "jail.local exists: {{ 'OK' if jail_config.stat.exists else 'FAILED' }}"
          - "Basic configuration: {{ 'OK' if basic_config.rc == 0 else 'FAILED' }}"
          - "Matrix config disabled: {{ 'OK' if not matrix_config.stat.exists else 'WARNING: Matrix config found' }}"
          - "Matrix script disabled: {{ 'OK' if not matrix_script.stat.exists else 'WARNING: Matrix script found' }}"
          - "Matrix actions disabled: {{ 'OK' if matrix_actions.rc != 0 else 'WARNING: Matrix actions found' }}"
          - "fail2ban status: {{ 'OK' if fail2ban_status.rc == 0 else 'FAILED' }}"
          - "SSH jail running: {{ 'OK' if sshd_jail_status.rc == 0 else 'INFO: SSH jail not active' }}"
          - "Nginx jail running: {{ 'OK' if nginx_jail_status.rc == 0 else 'INFO: Nginx jail not active' }}"
          - "fail2ban log exists: {{ 'OK' if fail2ban_log.stat.exists else 'FAILED' }}"
          - "iptables rules: {{ 'OK' if iptables_rules.rc == 0 else 'INFO: No iptables rules yet' }}"
          - "Matrix script syntax: {{ 'OK' if matrix_script_syntax is defined and matrix_script_syntax.rc == 0 else 'SKIPPED' }}"
          - "=== fail2ban ROLE VERIFICATION SUCCESS ==="
