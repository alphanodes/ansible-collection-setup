---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # an outdated version, which has to be removed by ruby_remove_other_versions
    - name: Create fake outdated ruby version
      ansible.builtin.file:
        path: /opt/ruby/3.4.11/bin
        state: directory
        mode: '0755'

    # distribution ruby, which has to be removed with ruby_source: ruby_build
    - name: Install distribution ruby
      ansible.builtin.apt:
        name:
          - ruby
          - ruby-dev
        state: present
        update_cache: true

    # Like small hosts, where /tmp is a tmpfs too small for the build. The
    # build only succeeds, if ruby-build uses ruby_build_tmp_dir.
    - name: Mount small tmpfs on /tmp
      ansible.posix.mount:
        path: /tmp
        src: tmpfs
        fstype: tmpfs
        opts: size=100m,mode=1777
        state: ephemeral
