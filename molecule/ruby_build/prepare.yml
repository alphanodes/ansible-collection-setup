---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # an outdated version, which has to be removed by ruby_remove_other_versions
    - name: Create fake outdated ruby version
      ansible.builtin.file:
        path: /opt/ruby/3.4.11/bin
        state: directory
        mode: '0755'

    # distribution ruby, which has to be removed with ruby_source: ruby_build
    - name: Install distribution ruby
      ansible.builtin.apt:
        name:
          - ruby
          - ruby-dev
        state: present
        update_cache: true

    # Like small hosts, where /tmp is a tmpfs too small for the build. The
    # build only succeeds, if ruby-build uses ruby_build_tmp_dir.
    # Some images already have a mount on /tmp, which ansible.posix.mount
    # refuses to replace, so the tmpfs is mounted on top of it. The module
    # itself must not run from /tmp, which the mount would hide.
    - name: Mount small tmpfs on /tmp
      ansible.builtin.command: mount -t tmpfs -o size=100m,mode=1777 tmpfs /tmp
      environment:
        TMPDIR: /var/tmp
      changed_when: true
