---
# Simulate the upgrade from libpass 1.9.3 (ships the passlib module itself)
# to the alias libpass >= 1.9.5: pip installs passlib and then uninstalls the
# old libpass, which deletes the shared module files. Run the role again.
- name: Upgrade libpass in radicale virtualenv
  hosts: all
  tasks:
    - name: Install libpass 1.9.3
      ansible.builtin.pip:
        name: libpass==1.9.3
        virtualenv: /var/lib/radicale/.venv
      become: true
      become_user: radicale

    - name: Upgrade libpass to the alias of passlib
      ansible.builtin.pip:
        name: libpass
        state: latest
        virtualenv: /var/lib/radicale/.venv
      become: true
      become_user: radicale

- name: Converge again to restore the passlib module
  ansible.builtin.import_playbook: converge.yml
