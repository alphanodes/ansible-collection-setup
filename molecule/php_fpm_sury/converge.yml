---
- name: Converge
  hosts: all
  become: true

  vars:
    php_version: '7.4'
    php_sury_enabled: true
    php_extra_modules:
      - "{{ php_extension_prefix }}memcache"

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

  roles:
    - role: alphanodes.setup.common
    - role: alphanodes.setup.php_fpm
