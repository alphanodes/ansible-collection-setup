---
- name: Converge
  hosts: all
  become: true

  vars:
    # latest without a pinned checksum: the role verifies the download
    # against the .sha256 file of the mirror
    golang_version: latest

  roles:
    - role: alphanodes.setup.golang

  post_tasks:
    - name: Run go version
      ansible.builtin.command: go version
      changed_when: false
      register: go_version_info

    - name: Show installed go version
      ansible.builtin.debug:
        var: go_version_info.stdout

    - name: Assert the latest Go release is installed
      ansible.builtin.assert:
        that:
          - go_version_info.stdout.startswith('go version ' + golang_real_version + ' ')
        fail_msg: "expected {{ golang_real_version }}, got {{ go_version_info.stdout }}"
        quiet: true
