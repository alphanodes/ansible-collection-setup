---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Check the nftables service
      ansible.builtin.systemd_service:
        name: nftables
        state: started
        enabled: true
      check_mode: true
      register: nftables_service
      failed_when: nftables_service.changed

    - name: Validate the written configuration
      ansible.builtin.command: nft --check --file /etc/nftables.conf
      changed_when: false

    - name: Read the ruleset
      ansible.builtin.command: nft list ruleset
      register: ruleset
      changed_when: false

    - name: Verify the filter chains and their policies
      ansible.builtin.assert:
        that:
          - "'table inet netfilter' in ruleset.stdout"
          - ruleset.stdout is search('hook input priority filter; policy drop;')
          - ruleset.stdout is search('hook forward priority filter; policy drop;')
          - ruleset.stdout is search('hook output priority filter; policy accept;')
        fail_msg: "{{ ruleset.stdout }}"

    # ssh only from the configured sources, no unrestricted ssh rule
    - name: Verify the input rules
      ansible.builtin.assert:
        that:
          - "'ip saddr 192.0.2.0/24 tcp dport 7099 accept' in ruleset.stdout"
          - "'ip saddr 198.51.100.7 tcp dport 7099 accept' in ruleset.stdout"
          - "'ip6 saddr 2001:db8:1::/64 tcp dport 7099 accept' in ruleset.stdout"
          - ruleset.stdout is not search('tcp dport 22 accept')
          - ruleset.stdout is not search('\\n\\s*meta nfproto ipv[46] tcp dport 7099 accept')
          - "'tcp dport 80 accept' in ruleset.stdout"
          - "'tcp dport 8000-8010 accept' in ruleset.stdout"
          - "'udp dport 443 accept' in ruleset.stdout"
          - "'ip saddr 192.0.2.20 tcp dport 3306 accept' in ruleset.stdout"
          - "'ip6 saddr 2001:db8:2::20 tcp dport 3306 accept' in ruleset.stdout"
          - "'ip saddr 192.0.2.21 udp dport 514 accept' in ruleset.stdout"
          - "'ip saddr 10.10.0.0/16 accept' in ruleset.stdout"
          - "'ip saddr 203.0.113.9 drop' in ruleset.stdout"
          - "'ip6 saddr 2001:db8:bad::/48 drop' in ruleset.stdout"
          - "'ip saddr 192.0.2.100 tcp dport 10050 accept' in ruleset.stdout"
          - "'ip6 saddr 2001:db8::100 tcp dport 10050 accept' in ruleset.stdout"
          - "'ip saddr 192.0.2.101 tcp dport 10051 accept' in ruleset.stdout"
          - "'limit rate 15/minute burst 5 packets log prefix \"netfilter-dropped: \" level debug' in ruleset.stdout"
        fail_msg: "{{ ruleset.stdout }}"

    - name: Verify the honeypot
      ansible.builtin.assert:
        that:
          - ruleset.stdout is search('set honeypot \\{\\s+type ipv4_addr\\s+(size \\d+\\s+)?flags dynamic,timeout\\s+timeout 10m')
          - ruleset.stdout is search('tcp dport \\{[^}]*\\b6379\\b[^}]*\\} update @honeypot \\{ ip saddr \\} log prefix "HONEYPOT. " level info drop')
          - "'udp dport { 137, 138 } update @honeypot6 { ip6 saddr } log prefix \"HONEYPOT: \" level info drop' in ruleset.stdout"
          - "'ip saddr @honeypot update @honeypot { ip saddr } drop' in ruleset.stdout"
        fail_msg: "{{ ruleset.stdout }}"

    # Trusted sources and ssh must not be locked out by a honeypot hit, a known
    # scanner must lose the public ports and an opened port must be no trap
    - name: Verify the order of the honeypot rules
      vars:
        netfilter_pos_trusted: "{{ ruleset.stdout.find('ip saddr 10.10.0.0/16 accept') }}"
        netfilter_pos_ssh: "{{ ruleset.stdout.find('tcp dport 7099 accept') }}"
        netfilter_pos_zabbix: "{{ ruleset.stdout.find('tcp dport 10050 accept') }}"
        netfilter_pos_known: "{{ ruleset.stdout.find('ip saddr @honeypot update') }}"
        netfilter_pos_public: "{{ ruleset.stdout.find('tcp dport 80 accept') }}"
        netfilter_pos_trap: "{{ ruleset.stdout.find('update @honeypot { ip saddr } log prefix') }}"
      ansible.builtin.assert:
        that:
          - netfilter_pos_trusted | int >= 0
          - netfilter_pos_trusted | int < netfilter_pos_known | int
          - netfilter_pos_ssh | int < netfilter_pos_known | int
          - netfilter_pos_zabbix | int < netfilter_pos_known | int
          - netfilter_pos_known | int < netfilter_pos_public | int
          - netfilter_pos_public | int < netfilter_pos_trap | int
        fail_msg: "{{ ruleset.stdout }}"

    - name: Verify the hardening rules of the input chain
      ansible.builtin.assert:
        that:
          - "'tcp flags & (fin | syn | rst | ack) != syn ct state new drop' in ruleset.stdout"
          - "'iif != \"lo\" ip saddr 127.0.0.0/8 drop' in ruleset.stdout"
          - ruleset.stdout is search('icmp type \\{ destination-unreachable, time-exceeded, parameter-problem \\} accept')
          - "'icmp type echo-request limit rate 20/second burst 50 packets accept' in ruleset.stdout"
          - ruleset.stdout is search('icmpv6 type \\{[^}]*packet-too-big[^}]*nd-neighbor-solicit[^}]*\\} accept')
          - ruleset.stdout is not search('meta l4proto \\{ icmp, ipv6-icmp \\} accept')
          - "'udp sport 53' not in ruleset.stdout"
          - "'tcp dport 25 accept' not in ruleset.stdout"
          - "'udp dport { 5355, 5678 } drop' in ruleset.stdout"
        fail_msg: "{{ ruleset.stdout }}"

    # nft prints users as uid. redmine does not exist here, naming it would make
    # nft refuse the config, so a single uid remains
    - name: Verify the rules of the output chain
      ansible.builtin.assert:
        that:
          - ruleset.stdout is search('meta skuid \\d+ ip daddr 169\\.254\\.169\\.254 reject')
          - ruleset.stdout is search('tcp dport 25 meta skuid != \\d+ reject')
        fail_msg: "{{ ruleset.stdout }}"

    # The reject answers at once. The allowed users prove that the rules and not
    # the network of the container refuse. 192.0.2.1 is a documentation address.
    - name: Connect to the metadata service and an SMTP server
      ansible.builtin.shell: |
        set -o pipefail
        exec 2>&1
        echo "web-metadata: $(timeout 8 runuser -u www-data -- bash -c 'exec 3<>/dev/tcp/169.254.169.254/80' 2>&1 | tail -1)"
        echo "web-smtp: $(timeout 8 runuser -u www-data -- bash -c 'exec 3<>/dev/tcp/192.0.2.1/25' 2>&1 | tail -1)"
        echo "root-metadata: $(timeout 8 bash -c 'exec 3<>/dev/tcp/169.254.169.254/80' 2>&1 | tail -1)"
        echo "postfix-smtp: $(timeout 8 runuser -u postfix -- bash -c 'exec 3<>/dev/tcp/192.0.2.1/25' 2>&1 | tail -1)"
      args:
        executable: /bin/bash
      register: netfilter_output_blocked
      changed_when: false
      failed_when: false

    - name: Verify only the web user was rejected
      ansible.builtin.assert:
        that:
          - netfilter_output_blocked.stdout is search('web-metadata:.*Connection refused')
          - netfilter_output_blocked.stdout is search('web-smtp:.*Connection refused')
          - netfilter_output_blocked.stdout is not search('root-metadata:.*Connection refused')
          - netfilter_output_blocked.stdout is not search('postfix-smtp:.*Connection refused')
        fail_msg: "{{ netfilter_output_blocked.stdout }}"

    - name: Read the kernel network settings
      ansible.builtin.command: >-
        sysctl -n net.ipv4.conf.all.accept_redirects net.ipv6.conf.all.accept_redirects
        net.ipv4.conf.all.secure_redirects net.ipv4.conf.all.log_martians net.ipv4.conf.all.rp_filter
      register: netfilter_sysctl_values
      changed_when: false

    - name: Verify the kernel network settings
      ansible.builtin.assert:
        that:
          - netfilter_sysctl_values.stdout_lines[0] == '0'
          - netfilter_sysctl_values.stdout_lines[1] == '0'
          - netfilter_sysctl_values.stdout_lines[2] == '0'
          - netfilter_sysctl_values.stdout_lines[3] == '1'
          - netfilter_sysctl_values.stdout_lines[4] != '0'
        fail_msg: "{{ netfilter_sysctl_values.stdout }}"

    - name: Verify forward and nat rules
      ansible.builtin.assert:
        that:
          - "'ip saddr 198.51.100.1 ip daddr 10.10.0.2 tcp dport 80 accept' in ruleset.stdout"
          - "'ip daddr 10.10.0.3 meta l4proto icmp accept' in ruleset.stdout"
          - "'table ip netfilter-nat' in ruleset.stdout"
          - "'ip daddr 192.0.2.1 tcp dport 80 dnat to 10.10.0.2' in ruleset.stdout"
          - "'ip daddr 192.0.2.1 ip protocol icmp dnat to 10.10.0.2' in ruleset.stdout"
          - ruleset.stdout is search('oifname "eth0" ip saddr 10.10.0.2 snat to 192.0.2.1')
        fail_msg: "{{ ruleset.stdout }}"

    # fail2ban is a dependency of the role and keeps its own table, which its
    # nftables action creates with the first ban (actionstart_on_demand)
    - name: Ban a sample address in the sshd jail
      ansible.builtin.command: fail2ban-client set sshd banip 192.0.2.40
      changed_when: false

    - name: Get the stop command of the nftables service
      ansible.builtin.command: systemctl show nftables -p ExecStop
      register: nftables_execstop
      changed_when: false

    # the drop-in removes the flush ruleset of the packaged unit, systemctl
    # prints nothing for a cleared ExecStop
    - name: Verify the nftables service has no stop command
      ansible.builtin.assert:
        that:
          - nftables_execstop.stdout | trim | length == 0
        fail_msg: "{{ nftables_execstop.stdout }}"

    - name: Reload nftables
      ansible.builtin.systemd_service:
        name: nftables
        state: reloaded
      changed_when: false

    # Debian restarts the unit on package upgrades
    - name: Restart nftables
      ansible.builtin.systemd_service:
        name: nftables
        state: restarted
      changed_when: false

    - name: Read the ruleset after the reload
      ansible.builtin.command: nft list ruleset
      register: ruleset_reloaded
      changed_when: false

    - name: Unban the sample address again
      ansible.builtin.command: fail2ban-client set sshd unbanip 192.0.2.40
      changed_when: false

    - name: Verify reload and restart keep the table and the ban of fail2ban
      ansible.builtin.assert:
        that:
          - "'table inet f2b-table' in ruleset_reloaded.stdout"
          - "'192.0.2.40' in ruleset_reloaded.stdout"
          - "'table inet netfilter' in ruleset_reloaded.stdout"
        fail_msg: "{{ ruleset_reloaded.stdout }}"

    # the legacy iptables rules of the converge are gone with their package
    - name: Verify the iptables rules and packages were removed
      ansible.builtin.assert:
        that:
          - "'table ip filter' not in ruleset.stdout"
          - "'table ip6 filter' not in ruleset.stdout"
          - "'table ip nat' not in ruleset.stdout"
        fail_msg: "{{ ruleset.stdout }}"

    - name: Get the state of iptables-persistent
      ansible.builtin.command: dpkg-query -W -f '${db:Status-Abbrev}' iptables-persistent
      register: iptables_persistent
      changed_when: false
      failed_when: false

    - name: Verify iptables-persistent is not installed
      ansible.builtin.assert:
        that:
          - iptables_persistent.rc != 0 or iptables_persistent.stdout is not match('^ii')
        fail_msg: "iptables-persistent is still installed: {{ iptables_persistent.stdout }}"

    # Deactivation runs last, it removes the rules checked above
    - name: Ban a sample address before the deactivation
      ansible.builtin.command: fail2ban-client set sshd banip 192.0.2.41
      changed_when: false

    - name: Deactivate the rules
      ansible.builtin.include_role:
        name: alphanodes.setup.netfilter
      vars:
        netfilter_state: disabled
        ssh_server_port: 7099
        # the bans must outlast the run, also if the test host sleeps meanwhile
        fail2ban_sshd_bantime: 24h

    - name: Check the nftables service is stopped and disabled
      ansible.builtin.systemd_service:
        name: nftables
        state: stopped
        enabled: false
      check_mode: true
      register: nftables_service_disabled
      failed_when: nftables_service_disabled.changed

    - name: Read the configuration after the deactivation
      ansible.builtin.slurp:
        src: /etc/nftables.conf
      register: nftables_config_disabled

    - name: Validate the configuration after the deactivation
      ansible.builtin.command: nft --check --file /etc/nftables.conf
      changed_when: false

    - name: Verify the configuration has no rules
      ansible.builtin.assert:
        that:
          - nftables_config_disabled.content | b64decode is not search('(?m)^\\s*table ')
          - nftables_config_disabled.content | b64decode is not search('(?m)^\\s*flush ruleset')
        fail_msg: "{{ nftables_config_disabled.content | b64decode }}"

    # the postinst of the package runs try-restart, which does nothing for a
    # stopped unit, a start must not bring back the rules either
    - name: Run the service restart of a package upgrade
      ansible.builtin.command: systemctl try-restart nftables
      changed_when: false

    - name: Read the ruleset after the package upgrade restart
      ansible.builtin.command: nft list ruleset
      register: ruleset_try_restart
      changed_when: false

    - name: Start nftables manually
      ansible.builtin.systemd_service:
        name: nftables
        state: started
      changed_when: false

    - name: Read the ruleset after the manual start
      ansible.builtin.command: nft list ruleset
      register: ruleset_started
      changed_when: false

    - name: Verify the rules stay gone and the ban of fail2ban stays
      ansible.builtin.assert:
        that:
          - "'table inet netfilter' not in item"
          - "'table ip netfilter-nat' not in item"
          - "'table inet f2b-table' in item"
          - "'192.0.2.41' in item"
        fail_msg: "{{ item }}"
      loop:
        - "{{ ruleset_try_restart.stdout }}"
        - "{{ ruleset_started.stdout }}"

    # the unit is running again here, remove has to stop it before the drop-in
    # goes away, without the drop-in a stop flushes the whole ruleset
    - name: Remove the role setup
      ansible.builtin.include_role:
        name: alphanodes.setup.netfilter
      vars:
        netfilter_state: remove
        ssh_server_port: 7099
        # the bans must outlast the run, also if the test host sleeps meanwhile
        fail2ban_sshd_bantime: 24h

    - name: Check the nftables service drop-in
      ansible.builtin.stat:
        path: /etc/systemd/system/nftables.service.d/override.conf
      register: nftables_dropin_removed

    - name: Check the nftables service is stopped after the removal
      ansible.builtin.systemd_service:
        name: nftables
        state: stopped
        enabled: false
      check_mode: true
      register: nftables_service_removed
      failed_when: nftables_service_removed.changed

    - name: Read the ruleset after the removal
      ansible.builtin.command: nft list ruleset
      register: ruleset_removed
      changed_when: false

    - name: Read the fail2ban log for the check below
      ansible.builtin.command: journalctl -u fail2ban --no-pager -n 40
      register: netfilter_fail2ban_journal
      changed_when: false

    - name: Verify the removal keeps the ban of fail2ban
      ansible.builtin.assert:
        that:
          - not nftables_dropin_removed.stat.exists
          - "'table inet netfilter' not in ruleset_removed.stdout"
          - "'table inet f2b-table' in ruleset_removed.stdout"
          - "'192.0.2.41' in ruleset_removed.stdout"
        fail_msg: "{{ ruleset_removed.stdout }} {{ netfilter_fail2ban_journal.stdout }}"

    - name: Read the sysctl file after the removal
      ansible.builtin.slurp:
        src: /etc/sysctl.d/90-ansible.conf
      register: netfilter_sysctl_removed

    - name: Verify the removal took back the kernel network settings
      ansible.builtin.assert:
        that:
          - "'accept_redirects' not in netfilter_sysctl_removed.content | b64decode"
          - "'log_martians' not in netfilter_sysctl_removed.content | b64decode"
          - "'rp_filter' not in netfilter_sysctl_removed.content | b64decode"
        fail_msg: "{{ netfilter_sysctl_removed.content | b64decode }}"
