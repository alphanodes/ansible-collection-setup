---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

  vars:
    matrix_room_cleaner_base: "https://matrix.example.org"
    matrix_room_cleaner_token: "TEST_TOKEN"
    matrix_room_cleaner_room_id: "!room:example.org"
    matrix_room_cleaner_max_age_days: 7

  roles:
    - role: alphanodes.setup.matrix_room_cleaner
