---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read redmine_automation service unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/redmine-automation.service
      register: automation_unit

    - name: Decode redmine_automation service unit
      ansible.builtin.set_fact:
        automation_unit_decoded: "{{ automation_unit.content | b64decode }}"

    # Requires= would stop a running playbook whenever puma is restarted
    - name: Verify playbook service only wants the puma service
      ansible.builtin.assert:
        that:
          - "'Wants=puma-redmine.service' in automation_unit_decoded"
          - "'After=puma-redmine.service' in automation_unit_decoded"
          - "'Requires=' not in automation_unit_decoded"
        fail_msg: "redmine-automation.service must use Wants= and After=, not Requires=: {{ automation_unit_decoded }}"
        success_msg: "redmine-automation.service uses Wants= and After="

    - name: Read generated backup playbook
      ansible.builtin.slurp:
        src: /etc/ansible/playbooks/backup.yml
      register: backup_playbook

    - name: Parse generated backup playbook
      ansible.builtin.set_fact:
        backup_playbook_vars: "{{ (backup_playbook.content | b64decode | from_yaml)[0].vars }}"

    - name: Verify borg excludes reach the backup playbook
      ansible.builtin.assert:
        that:
          - backup_playbook_vars.backup_borg_excludes == ['sh:/srv/backups/*.tar.gz']
        fail_msg: "backup_borg_excludes missing in backup playbook: {{ backup_playbook_vars }}"
        success_msg: "backup_borg_excludes is passed to the backup playbook"
