---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

  roles:
    - role: alphanodes.setup.common
    - role: alphanodes.setup.ansible_node
      vars:
        # Pin the core to verify the pin reaches the venv (a point release
        # below the one the ansible package would pull)
        ansible_node_ansible_core_version: '2.21.5'
        # Override for testing: use 'install' without -U for idempotence
        ansible_node_collections:
          - name: 'git+https://git.alphanodes.com/alphanodes/ansible-collection-tasks.git,main'
            action: install
        # A timer depending on a service, to verify the unit dependencies
        ansible_node_playbooks:
          - name: redmine_automation
          - name: backup
          # Monthly timer which has to catch up missed runs
          - name: matomo_geoip_update
        # Host settings have to reach the generated playbook
        backup_with_borg: true
        backup_borg_excludes:
          - 'sh:/srv/backups/*.tar.gz'

  post_tasks:
    - name: Verify ansible is installed
      ansible.builtin.command:
        argv:
          - '{{ ansible_pip_venv_path }}/bin/ansible'
          - --version
      register: ansible_node_version
      changed_when: false

    - name: Verify the configured ansible-core version is installed
      ansible.builtin.assert:
        that:
          - ansible_node_version.stdout_lines[0] == 'ansible [core ' ~ ansible_node_ansible_core_version ~ ']'
