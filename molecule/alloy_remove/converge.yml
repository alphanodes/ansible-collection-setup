---
- name: Converge - Install Alloy
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

    - name: Install gnupg for GPG key handling
      ansible.builtin.apt:
        name:
          - gnupg
          - curl
        state: present

  vars:
    alloy_loki_url: "https://loki.example.com"
    alloy_basic_pass: testsecret123

  roles:
    - role: alphanodes.setup.alloy

- name: Converge - Remove Alloy without other Grafana packages
  hosts: all
  become: true

  vars:
    alloy_remove: true

  pre_tasks:
    # A plain purge, as the role did before, leaves the enablement link behind
    - name: Purge alloy without disabling it first
      ansible.builtin.apt:
        name: alloy
        purge: true
        state: absent

    - name: Check the dangling enablement link is left behind
      ansible.builtin.stat:
        path: /etc/systemd/system/multi-user.target.wants/alloy.service
      register: alloy_test_link
      failed_when: not alloy_test_link.stat.islnk | default(false)

  roles:
    - role: alphanodes.setup.alloy

  post_tasks:
    - name: Check systemd no longer knows the alloy unit
      ansible.builtin.command: systemctl show alloy.service -p LoadState --value
      register: alloy_test_load_state
      changed_when: false
      failed_when: alloy_test_load_state.stdout != 'not-found'

    - name: Check the Grafana apt repository is removed
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/grafana.sources
      register: alloy_test_repo
      failed_when: alloy_test_repo.stat.exists

    - name: Check the Grafana apt key is removed
      ansible.builtin.stat:
        path: /etc/apt/keyrings/grafana.asc
      register: alloy_test_key
      failed_when: alloy_test_key.stat.exists

- name: Converge - Install Alloy and Loki from the shared repository
  hosts: all
  become: true

  vars:
    alloy_loki_url: "https://loki.example.com"
    alloy_basic_pass: testsecret123

  roles:
    - role: alphanodes.setup.alloy

  post_tasks:
    - name: Install loki package from the Grafana repository
      ansible.builtin.apt:
        name: loki
        state: present

- name: Converge - Remove Alloy while Loki still needs the repository
  hosts: all
  become: true

  vars:
    alloy_remove: true

  roles:
    - role: alphanodes.setup.alloy
