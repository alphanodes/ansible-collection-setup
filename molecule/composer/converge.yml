---
- name: Converge
  hosts: all
  vars:
    # We need php_executable for composer
    php_executable: php
    # Test with a specific Composer version
    composer_version: ''
    composer_keep_updated: true
    # Test global package installation
    composer_global_packages:
      - { name: phpunit/phpunit, release: "@stable" }
    composer_add_to_path: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

    - name: Install PHP and dependencies
      ansible.builtin.package:
        name:
          - php-cli
          - php-json
          - php-mbstring
          - php-xml
          - php-zip
          - git
          - unzip
        state: present

    - name: Create deploy user for composer_auth_homes test
      ansible.builtin.user:
        name: deploy
        system: true
        home: /srv/deploy
        shell: /bin/bash
        create_home: true

    - name: Include composer role
      ansible.builtin.include_role:
        name: alphanodes.setup.composer

    # separate run, because the fake token must not end up in the global
    # composer home, where it would break composer global require
    - name: Include composer role to test auth.json for deploy users
      ansible.builtin.include_role:
        name: alphanodes.setup.composer
      vars:
        composer_home_path: /tmp/composer_auth_test
        composer_global_packages: []
        composer_github_oauth_token: 'test_token_not_a_real_credential'
        composer_auth_homes:
          - path: /srv/deploy/.composer
            owner: deploy
            group: deploy
