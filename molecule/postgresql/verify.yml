---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - vars/main.yml
  module_defaults:
    community.postgresql.postgresql_query:
      login_port: '{{ postgresql_port }}'
  tasks:
    - name: Check the configured PostgreSQL cluster is running
      ansible.builtin.command: systemctl is-active postgresql@{{ postgresql_version }}-main
      changed_when: false

    - name: Check PostgreSQL is listening on the configured port
      ansible.builtin.wait_for:
        port: '{{ postgresql_port }}'
        host: localhost
        timeout: 10

    - name: Inspect PostgreSQL configuration and data paths
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf'
        - '/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf'
        - '/var/lib/postgresql/{{ postgresql_version }}/main/PG_VERSION'
      register: postgresql_paths

    - name: Assert PostgreSQL configuration and data paths exist
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: 'Missing PostgreSQL path: {{ item.item }}'
      loop: '{{ postgresql_paths.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Read active server settings
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: >-
          SELECT current_setting('server_version_num')::integer / 10000 AS major,
          current_setting('port')::integer AS port,
          current_setting('max_connections')::integer AS max_connections,
          current_setting('shared_buffers') AS shared_buffers,
          current_setting('autovacuum_vacuum_threshold')::integer AS vacuum_threshold,
          current_setting('autovacuum_analyze_threshold')::integer AS analyze_threshold,
          current_setting('shared_preload_libraries') AS preload,
          current_setting('auto_explain.log_min_duration') AS explain_duration
      register: postgresql_settings

    - name: Assert configuration was applied to the expected server
      ansible.builtin.assert:
        that:
          - postgresql_settings.query_result[0].major == postgresql_version | int
          - postgresql_settings.query_result[0].port == postgresql_port
          - postgresql_settings.query_result[0].max_connections == postgresql_max_connections
          - postgresql_settings.query_result[0].shared_buffers == postgresql_shared_buffers
          - postgresql_settings.query_result[0].vacuum_threshold == postgresql_autovacuum_vacuum_threshold
          - postgresql_settings.query_result[0].analyze_threshold == postgresql_autovacuum_analyze_threshold
          - "'pg_stat_statements' in postgresql_settings.query_result[0].preload.split(',')"
          - "'auto_explain' in postgresql_settings.query_result[0].preload.split(',')"
          - postgresql_settings.query_result[0].explain_duration == '200ms'

    - name: Read WAL, TOAST and I/O timing settings
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: >-
          SELECT current_setting('wal_compression') AS wal_compression,
          current_setting('default_toast_compression') AS toast_compression,
          current_setting('track_io_timing') AS track_io_timing
      register: postgresql_compression_settings

    - name: Assert WAL, TOAST and I/O timing settings (PostgreSQL 18+ template)
      ansible.builtin.assert:
        that:
          - postgresql_compression_settings.query_result[0].wal_compression == 'lz4'
          - postgresql_compression_settings.query_result[0].toast_compression == 'lz4'
          - postgresql_compression_settings.query_result[0].track_io_timing == 'on'
      when: postgresql_version | int >= 18

    - name: Inspect the removed postgresqltuner.pl
      ansible.builtin.stat:
        path: /usr/local/bin/postgresqltuner.pl
      register: postgresql_tuner

    - name: Assert postgresqltuner.pl was removed
      ansible.builtin.assert:
        that: not postgresql_tuner.stat.exists
        fail_msg: /usr/local/bin/postgresqltuner.pl from older role versions was not removed

    - name: Read the configured database and owner
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: SELECT pg_get_userbyid(datdba) AS owner FROM pg_database WHERE datname = 'molecule_test'
      register: postgresql_database

    - name: Assert the configured database belongs to the configured user
      ansible.builtin.assert:
        that:
          - postgresql_database.query_result | length == 1
          - postgresql_database.query_result[0].owner == 'molecule_user'

    - name: Read installed extensions in template1 and the configured database
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: '{{ item }}'
        query: SELECT extname FROM pg_extension WHERE extname = 'pg_stat_statements'
      loop:
        - template1
        - molecule_test
      register: postgresql_extensions

    - name: Assert pg_stat_statements is installed and inherited
      ansible.builtin.assert:
        that: item.query_result | length == 1
      loop: '{{ postgresql_extensions.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Read configured reader privileges
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: >-
          SELECT rolsuper, rolcreatedb, has_database_privilege(rolname, 'molecule_test', 'CREATE') AS can_create
          FROM pg_roles WHERE rolname = 'molecule_reader'
      register: postgresql_reader

    - name: Assert configured user attributes and privileges
      ansible.builtin.assert:
        that:
          - postgresql_reader.query_result | length == 1
          - not postgresql_reader.query_result[0].rolsuper
          - not postgresql_reader.query_result[0].rolcreatedb
          - postgresql_reader.query_result[0].can_create

    - name: Test password authentication and database writes as the configured owner
      community.postgresql.postgresql_query:
        login_host: 127.0.0.1
        login_user: molecule_user
        login_password: molecule_password
        login_db: molecule_test
        query:
          - CREATE TEMP TABLE molecule_check (value integer)
          - INSERT INTO molecule_check VALUES (42)
          - SELECT value FROM molecule_check
      register: postgresql_operations

    - name: Assert database writes and reads succeeded
      ansible.builtin.assert:
        that: postgresql_operations.query_result[0].value == 42

    - name: Read PostgreSQL plugin credentials of the Zabbix agent
      ansible.builtin.stat:
        path: /etc/zabbix/zabbix_agent2.d/plugins.d/postgresql_credentials.conf
      register: postgresql_plugin_credentials

    - name: Assert the credentials are readable for the agent only
      ansible.builtin.assert:
        that:
          - postgresql_plugin_credentials.stat.exists
          - postgresql_plugin_credentials.stat.pw_name == 'root'
          - postgresql_plugin_credentials.stat.gr_name == 'zabbix'
          - postgresql_plugin_credentials.stat.mode == '0640'

    # Keys as the template "PostgreSQL by Zabbix agent 2" sends them: user
    # zbx_monitor and an empty password, which the plugin takes from its
    # default. Run as zabbix like the agent, so the file permissions count.
    - name: Query the PostgreSQL plugin of the Zabbix agent
      become: true
      become_user: zabbix
      ansible.builtin.command:
        argv:
          - zabbix_agent2
          - -t
          - 'pgsql.{{ item }}["tcp://localhost:{{ postgresql_port }}","zbx_monitor","","postgres"]'
      loop:
        - ping
        - bgwriter
        - db.discovery
      register: postgresql_plugin_keys
      changed_when: false

    - name: Assert the plugin connects and returns data
      ansible.builtin.assert:
        that:
          - postgresql_plugin_keys.results[0].stdout is search('\[s\|1(\.0+)?\]$')
          - postgresql_plugin_keys.results[1].stdout is search('checkpoints_req')
          - postgresql_plugin_keys.results[2].stdout is search('molecule_test')
        fail_msg: "{{ postgresql_plugin_keys.results | map(attribute='stdout') | list }}"

    # Like the UserParameter pg_collation_mismatch of the agent: zabbix runs the
    # query file through sudo as postgres (sudo-rs on Ubuntu)
    - name: Run the collation check as zabbix through sudo
      become: true
      become_user: zabbix
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - -u
          - postgres
          # No port: like the agent, pg_wrapper picks the port of the cluster
          - /usr/bin/psql
          - -X
          - -t
          - -A
          - -f
          - /etc/zabbix/pg_collation_mismatch.sql
      register: postgresql_collation_check
      changed_when: false
      failed_when: false

    - name: Read the active sudo implementation
      ansible.builtin.command: readlink -f /usr/bin/sudo
      register: postgresql_sudo_impl
      changed_when: false

    - name: Read the distribution
      ansible.builtin.command: grep -oP '^ID=\K.*' /etc/os-release
      register: postgresql_distribution
      changed_when: false

    # converge installs sudo-rs on Ubuntu, otherwise the check silently runs
    # with the classic sudo (sudo.ws) and the sudo-rs rules stay untested
    - name: Assert the collation check runs with sudo-rs on Ubuntu
      ansible.builtin.assert:
        that:
          - postgresql_sudo_impl.stdout is search('cargo|sudo-rs')
        fail_msg: 'Expected sudo-rs on Ubuntu, found {{ postgresql_sudo_impl.stdout }}'
      when: postgresql_distribution.stdout | trim == 'ubuntu'

    - name: Assert the collation check returns a count
      ansible.builtin.assert:
        that:
          - postgresql_collation_check.rc == 0
          - postgresql_collation_check.stdout | trim is match('^[0-9]+$')
        fail_msg: >-
          Collation check failed with {{ postgresql_sudo_impl.stdout }}:
          rc={{ postgresql_collation_check.rc }}
          {{ postgresql_collation_check.stdout }} {{ postgresql_collation_check.stderr }}

    # side_effect installed pg_stat_statements 1.10, converge updated it
    - name: Read the version of pg_stat_statements in template1
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: template1
        query: SELECT installed_version, default_version FROM pg_available_extensions WHERE name = 'pg_stat_statements'
      register: postgresql_pgss_version

    - name: Assert pg_stat_statements was updated to the version of the package
      ansible.builtin.assert:
        that:
          - postgresql_pgss_version.query_result[0].installed_version == postgresql_pgss_version.query_result[0].default_version
        fail_msg: "{{ postgresql_pgss_version.query_result | to_json }}"

    # Like the UserParameter pg_extension_outdated of the agent
    - name: Run the extension version check as zabbix through sudo
      become: true
      become_user: zabbix
      ansible.builtin.command:
        argv: [sudo, -n, -u, postgres, /etc/zabbix/pg_extension_outdated.sh]
        chdir: /
      register: postgresql_extension_check
      changed_when: false

    - name: Install an old version of pg_trgm to simulate a missing extension update
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: molecule_test
        query: CREATE EXTENSION pg_trgm VERSION '1.5'
      changed_when: false

    - name: Run the extension version check with the old extension
      become: true
      become_user: zabbix
      ansible.builtin.command:
        argv: [sudo, -n, -u, postgres, /etc/zabbix/pg_extension_outdated.sh]
        chdir: /
      register: postgresql_extension_check_old
      changed_when: false

    - name: Remove the old pg_trgm again
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: molecule_test
        query: DROP EXTENSION pg_trgm
      changed_when: false

    - name: Assert the extension version check counts outdated extensions
      ansible.builtin.assert:
        that:
          - postgresql_extension_check.stdout | trim == '0'
          - postgresql_extension_check_old.stdout | trim == '1'
        fail_msg: >-
          expected 0 and 1, got {{ postgresql_extension_check.stdout }} and
          {{ postgresql_extension_check_old.stdout }} {{ postgresql_extension_check_old.stderr }}

    # Through the agent like the server would ask for it, so the UserParameter
    # line, sudo and the script are tested together. -t prints key [s|value]
    - name: Run the health check through the Zabbix agent
      become: true
      become_user: zabbix
      ansible.builtin.command:
        argv: [zabbix_agent2, -c, /etc/zabbix/zabbix_agent2.conf, -t, pg_health]
        chdir: /
      register: postgresql_health_agent
      changed_when: false

    - name: Assert the health check reports a healthy server
      vars:
        health: "{{ postgresql_health_agent.stdout | regex_search('\\{.*\\}') | from_json }}"
      ansible.builtin.assert:
        that:
          - health.config_errors == 0
          - health.pending_restart == 0
          - health.inactive_slots == 0
          - health.slot_retained_bytes == 0
          - health.invalid_indexes == 0
          - health.timescaledb_failed_jobs == 0
          - health.autovacuum_max_workers == 3
        fail_msg: "{{ postgresql_health_agent.stdout }} {{ postgresql_health_agent.stderr }}"

    # Each problem the health check reports, undone again below. Replication
    # slots need postgresql_with_barman (max_replication_slots), not set up here
    - name: Change a setting that needs a restart
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: ALTER SYSTEM SET max_connections = 101
        autocommit: true
      changed_when: false

    - name: Reload the configuration
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: SELECT pg_reload_conf()
      changed_when: false

    # pg_file_settings reads the files on every query, no reload needed
    - name: Add an invalid setting to postgresql.auto.conf
      ansible.builtin.lineinfile:
        path: '/var/lib/postgresql/{{ postgresql_version }}/main/postgresql.auto.conf'
        line: "work_mem = 'molecule'"

    - name: Create a table with duplicate values
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: molecule_test
        query: CREATE TABLE molecule_health AS SELECT 1 AS id FROM generate_series(1, 2)
      changed_when: false

    # Fails on the duplicates and leaves the index behind as invalid
    - name: Create a unique index concurrently on the duplicates
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: molecule_test
        query: CREATE UNIQUE INDEX CONCURRENTLY molecule_health_id ON molecule_health (id)
        autocommit: true
      register: postgresql_health_index
      failed_when: postgresql_health_index is succeeded
      changed_when: false

    # The reload reaches the server processes asynchronously
    - name: Run the health check with the problems
      become: true
      become_user: zabbix
      ansible.builtin.command:
        argv: [sudo, -n, -u, postgres, /etc/zabbix/pg_health.sh]
        chdir: /
      register: postgresql_health_problems
      changed_when: false
      until: (postgresql_health_problems.stdout | from_json).pending_restart > 0
      retries: 5
      delay: 1

    - name: Remove the invalid setting
      ansible.builtin.lineinfile:
        path: '/var/lib/postgresql/{{ postgresql_version }}/main/postgresql.auto.conf'
        line: "work_mem = 'molecule'"
        state: absent

    - name: Reset the setting that needs a restart
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: ALTER SYSTEM RESET max_connections
        autocommit: true
      changed_when: false

    - name: Reload the configuration again
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: SELECT pg_reload_conf()
      changed_when: false

    - name: Drop the table with the invalid index
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: molecule_test
        query: DROP TABLE molecule_health
      changed_when: false

    - name: Assert the health check counts each problem
      vars:
        health: "{{ postgresql_health_problems.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - health.config_errors == 1
          - health.pending_restart == 1
          - health.inactive_slots == 0
          - health.invalid_indexes == 1
          - health.timescaledb_failed_jobs == 0
        fail_msg: "{{ postgresql_health_problems.stdout }} {{ postgresql_health_problems.stderr }}"

    - name: Read obsolete zabbix sql PostgreSQL files
      ansible.builtin.stat:
        path: /var/lib/zabbix/postgresql
      register: postgresql_obsolete_sql

    - name: Assert the obsolete sql files are removed
      ansible.builtin.assert:
        that:
          - not postgresql_obsolete_sql.stat.exists

    - name: Read the baseline recorded before the CLI check step
      ansible.builtin.slurp:
        src: /tmp/molecule-postgresql-before-check.json
      register: postgresql_check_baseline

    - name: Read server identity after the port change dry run
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: SELECT current_setting('port')::integer AS port, pg_postmaster_start_time()::text AS started
      register: postgresql_after_check

    - name: Read configuration checksum after the port change dry run
      ansible.builtin.stat:
        path: '/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf'
      register: postgresql_config_after_check

    - name: Assert the CLI check step preserved the original server and configuration
      ansible.builtin.assert:
        that:
          - postgresql_after_check.query_result == (postgresql_check_baseline.content | b64decode | from_json).server
          - postgresql_config_after_check.stat.checksum == (postgresql_check_baseline.content | b64decode | from_json).checksum
