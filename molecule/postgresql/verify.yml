---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - vars/main.yml
  module_defaults:
    community.postgresql.postgresql_query:
      login_port: '{{ postgresql_port }}'
  tasks:
    - name: Check the configured PostgreSQL cluster is running
      ansible.builtin.command: systemctl is-active postgresql@{{ postgresql_version }}-main
      changed_when: false

    - name: Check PostgreSQL is listening on the configured port
      ansible.builtin.wait_for:
        port: '{{ postgresql_port }}'
        host: localhost
        timeout: 10

    - name: Inspect PostgreSQL configuration and data paths
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf'
        - '/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf'
        - '/var/lib/postgresql/{{ postgresql_version }}/main/PG_VERSION'
      register: postgresql_paths

    - name: Assert PostgreSQL configuration and data paths exist
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: 'Missing PostgreSQL path: {{ item.item }}'
      loop: '{{ postgresql_paths.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Read active server settings
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: >-
          SELECT current_setting('server_version_num')::integer / 10000 AS major,
          current_setting('port')::integer AS port,
          current_setting('max_connections')::integer AS max_connections,
          current_setting('shared_buffers') AS shared_buffers,
          current_setting('autovacuum_vacuum_threshold')::integer AS vacuum_threshold,
          current_setting('autovacuum_analyze_threshold')::integer AS analyze_threshold,
          current_setting('shared_preload_libraries') AS preload,
          current_setting('auto_explain.log_min_duration') AS explain_duration
      register: postgresql_settings

    - name: Assert configuration was applied to the expected server
      ansible.builtin.assert:
        that:
          - postgresql_settings.query_result[0].major == postgresql_version | int
          - postgresql_settings.query_result[0].port == postgresql_port
          - postgresql_settings.query_result[0].max_connections == postgresql_max_connections
          - postgresql_settings.query_result[0].shared_buffers == postgresql_shared_buffers
          - postgresql_settings.query_result[0].vacuum_threshold == postgresql_autovacuum_vacuum_threshold
          - postgresql_settings.query_result[0].analyze_threshold == postgresql_autovacuum_analyze_threshold
          - "'pg_stat_statements' in postgresql_settings.query_result[0].preload.split(',')"
          - "'auto_explain' in postgresql_settings.query_result[0].preload.split(',')"
          - postgresql_settings.query_result[0].explain_duration == '200ms'

    - name: Read the configured database and owner
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: SELECT pg_get_userbyid(datdba) AS owner FROM pg_database WHERE datname = 'molecule_test'
      register: postgresql_database

    - name: Assert the configured database belongs to the configured user
      ansible.builtin.assert:
        that:
          - postgresql_database.query_result | length == 1
          - postgresql_database.query_result[0].owner == 'molecule_user'

    - name: Read installed extensions in template1 and the configured database
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: '{{ item }}'
        query: SELECT extname FROM pg_extension WHERE extname = 'pg_stat_statements'
      loop:
        - template1
        - molecule_test
      register: postgresql_extensions

    - name: Assert pg_stat_statements is installed and inherited
      ansible.builtin.assert:
        that: item.query_result | length == 1
      loop: '{{ postgresql_extensions.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Read configured reader privileges
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: >-
          SELECT rolsuper, rolcreatedb, has_database_privilege(rolname, 'molecule_test', 'CREATE') AS can_create
          FROM pg_roles WHERE rolname = 'molecule_reader'
      register: postgresql_reader

    - name: Assert configured user attributes and privileges
      ansible.builtin.assert:
        that:
          - postgresql_reader.query_result | length == 1
          - not postgresql_reader.query_result[0].rolsuper
          - not postgresql_reader.query_result[0].rolcreatedb
          - postgresql_reader.query_result[0].can_create

    - name: Test password authentication and database writes as the configured owner
      community.postgresql.postgresql_query:
        login_host: 127.0.0.1
        login_user: molecule_user
        login_password: molecule_password
        login_db: molecule_test
        query:
          - CREATE TEMP TABLE molecule_check (value integer)
          - INSERT INTO molecule_check VALUES (42)
          - SELECT value FROM molecule_check
      register: postgresql_operations

    - name: Assert database writes and reads succeeded
      ansible.builtin.assert:
        that: postgresql_operations.query_result[0].value == 42

    - name: Grant monitoring permissions to the test user
      become: true
      become_user: postgres
      community.postgresql.postgresql_membership:
        login_port: '{{ postgresql_port }}'
        group: pg_monitor
        target_roles: molecule_user
        state: present

    - name: Install the monitoring SQL for verification
      ansible.builtin.copy:
        src: ../../roles/postgresql/files/zabbix/postgresql/pgsql.bgwriter.sql
        dest: /tmp/molecule-pgsql.bgwriter.sql
        mode: '0644'

    - name: Execute monitoring SQL as an unprivileged monitoring role
      ansible.builtin.command:
        argv:
          - psql
          - -h
          - 127.0.0.1
          - -p
          - '{{ postgresql_port | string }}'
          - -U
          - molecule_user
          - -d
          - molecule_test
          - -qtAX
          - -v
          - ON_ERROR_STOP=1
          - -f
          - /tmp/molecule-pgsql.bgwriter.sql
      environment:
        PGPASSWORD: molecule_password
      changed_when: false
      register: postgresql_bgwriter

    - name: Assert monitoring JSON contains every expected numeric metric
      ansible.builtin.assert:
        that:
          - item in (postgresql_bgwriter.stdout | from_json)
          - (postgresql_bgwriter.stdout | from_json)[item] is number
          - (postgresql_bgwriter.stdout | from_json)[item] >= 0
      loop:
        - checkpoints_timed
        - checkpoints_req
        - checkpoint_write_time
        - checkpoint_sync_time
        - buffers_checkpoint
        - buffers_clean
        - maxwritten_clean
        - buffers_backend
        - buffers_backend_fsync
        - buffers_alloc
