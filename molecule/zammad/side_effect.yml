---
- name: Exercise disable and re-enable lifecycle
  hosts: all
  become: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Disable application
      ansible.builtin.include_role:
        name: alphanodes.setup.zammad
      vars:
        zammad_enabled: false

    - name: Read disabled Zammad service
      ansible.builtin.command: systemctl is-active zammad
      register: disabled_service
      changed_when: false
      failed_when: false

    - name: Inspect disabled vhost
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/zammad.conf
      register: disabled_vhost

    - name: Verify disabled lifecycle
      ansible.builtin.assert:
        that:
          - disabled_service.stdout == 'inactive'
          - not disabled_vhost.stat.exists

    - name: Remove database link to simulate the previous configuration layout
      ansible.builtin.file:
        path: /opt/zammad/config/database.yml
        state: absent

    - name: Restore a regular database file to exercise migration
      ansible.builtin.copy:
        src: /etc/zammad/database.yml
        dest: /opt/zammad/config/database.yml
        remote_src: true
        owner: zammad
        group: zammad
        mode: '0600'

    - name: Re-enable application
      ansible.builtin.include_role:
        name: alphanodes.setup.zammad
