---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: redis-auth-tcp-instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  - name: redis-auth-socket-instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  - name: redis-auth-plain-instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
  inventory:
    group_vars:
      all:
        redis_use_redis_io: false
        redis_server_maxmemory: 64mb
    host_vars:
      redis-auth-tcp-instance:
        redis_server_bind: '127.0.0.2'
        redis_server_port: 6387
        redis_server_requirepass: molecule-redis-password
      redis-auth-socket-instance:
        redis_server_port: '0'
        redis_server_unixsocket: /run/redis/auth-test.sock
        redis_server_requirepass: molecule-socket-password
        redis_server_disabled_commands:
          - DEBUG
          - FLUSHALL
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - check
    - verify
    - destroy
