---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

    # Postfix for the queue checks of linux_check.sh. Mails to other hosts
    # are deferred, so a test mail stays in the queue.
    - name: Preseed the postfix configuration type
      ansible.builtin.debconf:
        name: postfix
        question: postfix/main_mailer_type
        value: Internet Site
        vtype: select

    - name: Install postfix
      ansible.builtin.apt:
        name: postfix
        state: present

    - name: Defer deliveries to other hosts
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: '^defer_transports'
        line: defer_transports = smtp
      notify: Restart postfix

  handlers:
    - name: Restart postfix
      ansible.builtin.service:
        name: postfix
        state: restarted

  vars:
    # Zabbix configuration for testing
    zabbix_server_vhost: "zabbix.example.com"

    # Disable API tasks for testing (no Zabbix server available)
    zabbix_agent_server_api: false

    # The collection ships empty journal pattern lists, test with a minimal set
    zabbix_agent_journalctl_keywords:
      - error
      - failed
      - warning
      - Connection refused
    zabbix_agent_journalctl_ignore_all:
      - RoutingError
      - 'SASL (LOGIN|PLAIN|CRAM-MD5|DIGEST-MD5) authentication failed'
      - 'status=deferred'
    zabbix_agent_redmine_log_ignore_all:
      - RoutingError
    # A Redmine host, so the Redmine UserParameters and pattern files exist
    redmine_instances:
      molecule: {}
    zabbix_agent_systemd_failed_ignore:
      - 'sentinel-agent-task-.*\.service'
    # Sudo rules for the SMART plugin of zabbix-agent2
    zabbix_agent_with_smart: true
    # fail2ban installs its own UserParameter file with monitoring
    zabbix_monitoring: true

  roles:
    - role: alphanodes.setup.zabbix_agent
    - role: alphanodes.setup.fail2ban
