---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check zabbix-agent2 is installed
      ansible.builtin.command: dpkg -l zabbix-agent2
      register: zabbix_package
      changed_when: false
      failed_when: zabbix_package.rc != 0

    - name: Check zabbix-agent2 service is running
      ansible.builtin.systemd:
        name: zabbix-agent2
      register: zabbix_service
      failed_when: zabbix_service.status.ActiveState != "active"

    - name: Check zabbix configuration file exists
      ansible.builtin.stat:
        path: /etc/zabbix/zabbix_agent2.conf
      register: zabbix_conf
      failed_when: not zabbix_conf.stat.exists

    - name: Check zabbix addons directory exists
      ansible.builtin.stat:
        path: /usr/share/zabbix_addons/scripts
      register: zabbix_addons
      failed_when: not zabbix_addons.stat.exists

    - name: Check linux_check.sh script exists
      ansible.builtin.stat:
        path: /usr/share/zabbix_addons/scripts/linux_check.sh
      register: linux_check
      failed_when: not linux_check.stat.exists

    - name: Check sudoers configuration exists
      ansible.builtin.stat:
        path: /etc/sudoers.d/zabbix
      register: zabbix_sudoers
      failed_when: not zabbix_sudoers.stat.exists

    - name: Read the sudo implementation
      ansible.builtin.command: readlink -f /usr/bin/sudo
      register: smart_sudo_impl
      changed_when: false

    # The SMART plugin of zabbix-agent2 calls sudo -n smartctl. sudo -l with a
    # command only checks the rules (rc 0 if allowed), independent of the
    # error text and of whether smartctl finds the device.
    - name: Check the smartctl commands of the SMART plugin are allowed for zabbix
      ansible.builtin.command:
        cmd: sudo -n -u zabbix sudo -n -l {{ item }}
      loop:
        - /usr/sbin/smartctl -j -V
        - /usr/sbin/smartctl --scan -j
        - /usr/sbin/smartctl --scan -d sat -j
        - /usr/sbin/smartctl -a /dev/sda -j
        - /usr/sbin/smartctl -a /dev/sda -d sat -j
        - /usr/sbin/smartctl -a /dev/sda -d cciss,0 -j
      register: smart_allowed
      changed_when: false
      # The role skips the SMART rules with sudo-rs (no globs in arguments)
      when: smart_sudo_impl.stdout is not search('sudo-rs|cargo')

    - name: Check smartctl with other arguments is denied for zabbix
      ansible.builtin.command:
        cmd: sudo -n -u zabbix sudo -n -l /usr/sbin/smartctl -a /dev/sda -d sat -s on -j
      register: smart_denied
      changed_when: false
      failed_when: false
      when: smart_sudo_impl.stdout is not search('sudo-rs|cargo')

    - name: Verify sudo denies smartctl with other arguments
      when: smart_sudo_impl.stdout is not search('sudo-rs|cargo')
      ansible.builtin.assert:
        that:
          - smart_denied.rc != 0
        fail_msg: "zabbix may run smartctl with arbitrary arguments: {{ smart_denied.stderr }}"
        success_msg: "sudo allows only the smartctl commands of the SMART plugin"

    - name: Check zabbix user exists
      ansible.builtin.getent:
        database: passwd
        key: zabbix
      register: zabbix_user

    - name: Check old nginx status file still included by a vhost
      ansible.builtin.stat:
        path: /usr/share/zabbix_addons/conf/nginx-server-status.conf
      register: old_nginx_status
      failed_when: not old_nginx_status.stat.exists

    - name: Get group memberships of zabbix user
      ansible.builtin.command: id -nG zabbix
      register: zabbix_groups
      changed_when: false

    - name: Verify zabbix user is member of adm and www-data
      ansible.builtin.assert:
        that:
          - "'adm' in zabbix_groups.stdout.split()"
          - "'www-data' in zabbix_groups.stdout.split()"

    - name: Verify zabbix agent is listening on port 10050
      ansible.builtin.wait_for:
        port: 10050
        timeout: 5

    # The main configuration and the included files, the UserParameters live
    # in zabbix_agent2.d
    - name: Read the agent configuration with its included files
      ansible.builtin.shell: cat /etc/zabbix/zabbix_agent2.conf /etc/zabbix/zabbix_agent2.d/*.conf
      register: zabbix_conf_content
      changed_when: false

    - name: Keep the agent configuration content
      ansible.builtin.set_fact:
        zabbix_conf_decoded: "{{ zabbix_conf_content.stdout }}"

    - name: Verify journal UserParameters use the wrapper script
      ansible.builtin.assert:
        that:
          - "'UserParameter=journalctl[*], bash /usr/share/zabbix_addons/scripts/journal_check.sh global' in zabbix_conf_decoded"
          - "'UserParameter=journalctl_service[*], bash /usr/share/zabbix_addons/scripts/journal_check.sh service' in zabbix_conf_decoded"
        fail_msg: "journal UserParameters do not call journal_check.sh"
        success_msg: "journal UserParameters call journal_check.sh"

    - name: Run systemctl.status UserParameter
      ansible.builtin.command:
        cmd: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t 'systemctl.status[zabbix-agent2]'
      register: systemctl_status_test
      changed_when: false

    # The Services template reads the unit type from the last line
    - name: Verify systemctl.status ends with the unit type
      ansible.builtin.assert:
        that:
          - systemctl_status_test.stdout is search('Type=simple\s*\]?\s*$')
        fail_msg: "systemctl.status does not end with the Type line: {{ systemctl_status_test.stdout }}"
        success_msg: "systemctl.status ends with the Type line"

    # converge defers deliveries to other hosts, so the mail stays queued
    - name: Queue a test mail
      ansible.builtin.command:
        cmd: /usr/sbin/sendmail molecule@example.net
        stdin: test
      changed_when: false

    - name: Wait until postfix picked up the test mail
      ansible.builtin.command: postqueue -j
      register: postfix_queue_wait
      until: >-
        postfix_queue_wait.stdout_lines | length == 1
        and (postfix_queue_wait.stdout_lines[0] | from_json).queue_name != 'maildrop'
      retries: 20
      delay: 1
      changed_when: false

    - name: Run the postfix queue checks of linux_check.sh as zabbix
      ansible.builtin.command:
        cmd: sudo -n -u zabbix bash /usr/share/zabbix_addons/scripts/linux_check.sh {{ item }} postfix
      loop:
        - queue_count
        - queue_age
      register: postfix_queue_check
      changed_when: false

    - name: Remove the test mail
      ansible.builtin.command: postsuper -d ALL
      changed_when: false

    - name: Verify the postfix queue checks count the test mail
      ansible.builtin.assert:
        that:
          - postfix_queue_check.results[0].stdout == '1'
          - postfix_queue_check.results[1].stdout is match('^[0-9]+$')
        fail_msg: "postfix queue checks returned {{ postfix_queue_check.results | map(attribute='stdout') | list }}"
        success_msg: "postfix queue checks count the queued mail"

    - name: Verify no configuration line exceeds the agent limit of 2048 bytes
      ansible.builtin.assert:
        that:
          - zabbix_conf_decoded.split('\n') | map('length') | max <= 2048
        fail_msg: "the agent configuration contains a line longer than 2048 bytes, agent will not start"
        success_msg: "all configuration lines within 2048 bytes"

    - name: Read journal pattern files
      ansible.builtin.slurp:
        src: /etc/zabbix/journal/{{ item }}.list
      loop:
        - keywords
        - ignore
        - redmine_keywords
        - redmine_ignore
      register: journal_patterns

    # An empty line matches everything, with grep -v it would hide all lines
    - name: Verify journal pattern files are filled and contain no empty lines
      ansible.builtin.assert:
        that:
          - pattern_lines | length > 0
          - pattern_lines | select('equalto', '') | list | length == 0
        fail_msg: "{{ item.item }}.list is empty or contains empty lines"
        success_msg: "{{ item.item }}.list is valid"
      vars:
        pattern_lines: "{{ (item.content | b64decode).rstrip('\n').split('\n') }}"
      loop: "{{ journal_patterns.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify keyword and ignore patterns are deployed
      ansible.builtin.assert:
        that:
          - "'Connection refused' in (journal_patterns.results[0].content | b64decode)"
          - "'RoutingError' in (journal_patterns.results[1].content | b64decode)"
          - "'RoutingError' in (journal_patterns.results[3].content | b64decode)"
        fail_msg: "journal patterns are missing expected entries"
        success_msg: "journal patterns contain expected entries"

    # Ansible logs the module arguments to the journal, so the test messages
    # use a random marker passed by environment, which never shows up there.
    - name: Generate journal test marker
      ansible.builtin.command: cat /proc/sys/kernel/random/uuid
      register: journal_marker
      changed_when: false

    - name: Write test messages to the journal
      ansible.builtin.shell: |
        set -o pipefail
        echo "$MARK relay warning: relayhost configuration problem" | systemd-cat -t molecule-relay
        echo "$MARK deferred status=deferred (connect to relay[192.0.2.1]:25: Connection timed out)" | systemd-cat -t molecule-relay
        echo "$MARK warning: unknown[192.0.2.1]: SASL LOGIN authentication failed" | systemd-cat -t molecule-smtpd
        systemd-run --unit=puma-molecule --wait --quiet --setenv=MARK="$MARK" /bin/sh -c 'echo "$MARK puma error"'
        systemctl reset-failed puma-molecule.service 2>/dev/null || true
        # Rails logs a backtrace as one journal entry with embedded newlines,
        # journalctl prints its continuation lines indented without the unit.
        # systemd-cat would split it into single entries, so send it natively.
        # The message is built from the environment, systemd logs the command
        # line of systemd-run units, which must not contain the marker.
        cat > /tmp/journal_multiline.py <<'EOF'
        import os, socket, struct, time
        mark = os.environ['MARK']
        kind = os.environ['KIND']
        lines = [f'{mark} {kind} multiline head', f'  {mark} {kind} multiline error']
        if kind == 'puma':
            lines += ['  ', f'{mark} {kind} multiline cause error']
        msg = '\n'.join(lines).encode()
        data = b'MESSAGE\n' + struct.pack('<Q', len(msg)) + msg + b'\n'
        sock = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM)
        sock.sendto(data, '/run/systemd/journal/socket')
        # journald resolves the unit of a datagram via /proc/<pid>/cgroup,
        # so the sender has to outlive the processing of its message
        time.sleep(1)
        EOF
        systemd-run --unit=puma-molecule-multiline --wait --quiet \
          --setenv=MARK="$MARK" --setenv=KIND=puma /usr/bin/python3 /tmp/journal_multiline.py
        systemd-run --unit=molecule-multiline --wait --quiet \
          --setenv=MARK="$MARK" --setenv=KIND=other /usr/bin/python3 /tmp/journal_multiline.py
        systemctl reset-failed puma-molecule-multiline.service molecule-multiline.service 2>/dev/null || true
        rm -f /tmp/journal_multiline.py
        journalctl --flush
      args:
        executable: /bin/bash
      environment:
        MARK: "{{ journal_marker.stdout }}"
      changed_when: false

    - name: Run journalctl item through the agent
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t 'journalctl[]'
      register: journal_item
      changed_when: false

    - name: Run journalctl_service item through the agent
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t 'journalctl_service[puma-molecule]'
      register: journal_service_item
      changed_when: false

    # The converge defines a Redmine instance, so the Redmine UserParameter exists
    - name: Run redmine_log item through the agent
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t 'redmine_log[puma-molecule]'
      register: journal_redmine
      changed_when: false

    - name: Run redmine_log item for the multiline puma unit through the agent
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t 'redmine_log[puma-molecule-multiline]'
      register: journal_redmine_multiline
      changed_when: false

    - name: Verify journal checks detect errors and skip ignored lines
      ansible.builtin.assert:
        that:
          - "'ZBX_NOTSUPPORTED' not in journal_item.stdout"
          - "(journal_marker.stdout ~ ' relay warning: relayhost configuration problem') in journal_item.stdout"
          - "(journal_marker.stdout ~ ' deferred status=deferred') not in journal_item.stdout"
          - "(journal_marker.stdout ~ ' warning: unknown') not in journal_item.stdout"
          - "(journal_marker.stdout ~ ' puma error') not in journal_item.stdout"
          - "(journal_marker.stdout ~ ' puma error') in journal_service_item.stdout"
          - "(journal_marker.stdout ~ ' puma error') in journal_redmine.stdout"
        fail_msg: "journal check result is wrong: {{ journal_item.stdout }}"
        success_msg: "journal checks report errors, ignore patterns and puma exclusion work"

    - name: Verify the puma exclusion covers continuation lines of multiline entries
      ansible.builtin.assert:
        that:
          - "(journal_marker.stdout ~ ' puma multiline') not in journal_item.stdout"
          - "(journal_marker.stdout ~ ' other multiline error') in journal_item.stdout"
          - "(journal_marker.stdout ~ ' puma multiline error') in journal_redmine_multiline.stdout"
          - "(journal_marker.stdout ~ ' puma multiline cause error') in journal_redmine_multiline.stdout"
        fail_msg: "multiline journal check result is wrong: {{ journal_item.stdout }} / {{ journal_redmine_multiline.stdout }}"
        success_msg: "puma continuation lines stay out of journalctl[], other units and redmine_log keep them"

    - name: Read systemd global status before the test
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t systemctl.global_status
      register: systemd_status_before
      changed_when: false

    # A failed transient unit named like SentinelOne maintenance tasks must not
    # change the reported state, any other failed unit must turn it degraded
    - name: Create failed units for the systemd status test
      ansible.builtin.shell: |
        systemd-run --unit=sentinel-agent-task-molecule --wait --quiet /bin/false || true
        systemd-run --unit=molecule-failing-unit --wait --quiet /bin/false || true
        systemctl list-units --failed --no-legend --plain
      args:
        executable: /bin/bash
      register: systemd_failed_units
      changed_when: false

    - name: Read systemd global status with both failed units
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t systemctl.global_status
      register: systemd_status_both
      changed_when: false

    - name: Reset the other failed unit
      ansible.builtin.command: systemctl reset-failed molecule-failing-unit.service
      changed_when: false

    - name: Read systemd global status with only the ignored unit failed
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t systemctl.global_status
      register: systemd_status_ignored
      changed_when: false

    - name: Reset the ignored failed unit
      ansible.builtin.command: systemctl reset-failed sentinel-agent-task-molecule.service
      changed_when: false

    - name: Verify ignored failed units do not degrade the systemd status
      ansible.builtin.assert:
        that:
          - "'sentinel-agent-task-molecule.service' in systemd_failed_units.stdout"
          - "'molecule-failing-unit.service' in systemd_failed_units.stdout"
          - "'State: degraded' in systemd_status_both.stdout"
          - "(systemd_status_ignored.stdout | regex_search('State: [a-z]+')) == (systemd_status_before.stdout | regex_search('State: [a-z]+'))"
        fail_msg: >-
          before: {{ systemd_status_before.stdout }},
          both failed: {{ systemd_status_both.stdout }},
          only ignored failed: {{ systemd_status_ignored.stdout }}
        success_msg: "systemd status ignores SentinelOne tasks and reports other failed units"

    # sshd_config is mode 0600 (ssh role), so the check has to use sshd -T
    - name: Read sshd settings via linux_check.sh as zabbix
      ansible.builtin.command: /usr/share/zabbix_addons/scripts/linux_check.sh {{ item }} sshd_config
      become: true
      become_user: zabbix
      loop:
        - PasswordAuthentication
        - PermitEmptyPasswords
        - StrictModes
        - X11Forwarding
      register: sshd_checks
      changed_when: false

    - name: Verify the sshd checks return yes or no
      ansible.builtin.assert:
        that:
          - sshd_checks.results | map(attribute='stdout') | reject('in', ['yes', 'no']) | list | length == 0
        fail_msg: "sshd checks return no setting: {{ sshd_checks.results | map(attribute='stdout') | list }}"
        success_msg: "sshd checks read the effective sshd configuration"

    - name: Run the other linux_check.sh checks as zabbix
      ansible.builtin.command: /usr/share/zabbix_addons/scripts/linux_check.sh {{ item }}
      become: true
      become_user: zabbix
      loop:
        - world_write_etc perm
        - server_name_in_hosts performance
        - password_accounts users
      register: linux_checks
      changed_when: false

    - name: Verify the other linux_check.sh checks return real values
      ansible.builtin.assert:
        that:
          - linux_checks.results[0].stdout is regex('^[0-9]+$')
          - linux_checks.results[1].stdout in ['yes', 'no']
          - linux_checks.results[2].stdout is regex('^(none|[a-z_][a-z0-9_.-]*( [a-z_][a-z0-9_.-]*)*)$')
        fail_msg: "linux_check.sh returns: {{ linux_checks.results | map(attribute='stdout') | list }}"
        success_msg: "world_write_etc, server_name_in_hosts and password_accounts work as zabbix"

    - name: Read the UserParameters of the main agent configuration
      ansible.builtin.command: grep -c '^UserParameter=' /etc/zabbix/zabbix_agent2.conf
      register: userparameter_main
      changed_when: false
      failed_when: userparameter_main.rc not in [0, 1]

    - name: Read the UserParameter files
      ansible.builtin.stat:
        path: '/etc/zabbix/zabbix_agent2.d/{{ item }}.conf'
      loop:
        - userparameter_journal
        - userparameter_linux
        - userparameter_systemd
        - userparameter_redmine
        - fail2ban
        # Groups not active on this host, php was left over by prepare
        - userparameter_php
        - userparameter_drupal
      register: userparameter_files

    - name: Verify each group has its own file and inactive groups are removed
      ansible.builtin.assert:
        that:
          - userparameter_main.stdout | trim == '0'
          - userparameter_files.results[:5] | map(attribute='stat.exists') | select | list | length == 5
          - userparameter_files.results[5:] | map(attribute='stat.exists') | select | list | length == 0
        fail_msg: >-
          main configuration has {{ userparameter_main.stdout | trim }} UserParameters, files:
          {{ userparameter_files.results | map(attribute='item') | zip(userparameter_files.results | map(attribute='stat.exists')) | list }}

    # The file of the fail2ban role and its sudo rule, as zabbix like the agent
    - name: Run the fail2ban discovery through the agent
      ansible.builtin.command:
        argv: [zabbix_agent2, -c, /etc/zabbix/zabbix_agent2.conf, -t, fail2ban.discovery]
        chdir: /
      become: true
      become_user: zabbix
      register: fail2ban_discovery
      changed_when: false

    - name: Verify the fail2ban discovery lists the jails
      ansible.builtin.assert:
        that:
          # The LLD macro starts with a Jinja comment tag, match around it
          - fail2ban_discovery.stdout is search('JAIL\}":"sshd"')
        fail_msg: "fail2ban.discovery returns: {{ fail2ban_discovery.stdout }}"

    # With fork_worker, workers 1..n are children of worker 0, so the Puma
    # template selects the workers by process title, not by parent PID
    - name: Start fake puma processes as nobody
      ansible.builtin.shell: |
        setsid runuser -u nobody -- bash -c 'exec -a "puma 8.0.0 (unix:///run/x/redmine.sock) [x]" sleep 300' > /dev/null 2>&1 &
        setsid runuser -u nobody -- bash -c 'exec -a "puma: cluster worker 0: 1 [x]" sleep 300' > /dev/null 2>&1 &
        setsid runuser -u nobody -- bash -c 'exec -a "puma: cluster worker 1: 1 [x]" sleep 300' > /dev/null 2>&1 &
        sleep 1
      changed_when: true

    # The native keys of the Puma template, as zabbix like the agent: the
    # largest worker and the master (for single mode)
    - name: Run puma memory items through the agent
      ansible.builtin.command:
        argv:
          - zabbix_agent2
          - -c
          - /etc/zabbix/zabbix_agent2.conf
          - -t
          - 'proc.mem[,{{ item.user }},max,"{{ item.title }}",rss]'
        chdir: /
      become: true
      become_user: zabbix
      loop:
        - {user: nobody, title: 'puma: cluster worker'}
        - {user: nobody, title: '^puma [0-9]'}
        - {user: daemon, title: 'puma: cluster worker'}
      register: puma_rss
      changed_when: false

    - name: Verify puma memory items find the workers and the master
      ansible.builtin.assert:
        that:
          - puma_rss.results[0].stdout is regex('\\[[a-z]\\|[1-9][0-9]*\\]')
          - puma_rss.results[1].stdout is regex('\\[[a-z]\\|[1-9][0-9]*\\]')
          - puma_rss.results[2].stdout is regex('\\[[a-z]\\|0\\]')
        fail_msg: "puma memory is wrong: {{ puma_rss.results | map(attribute='stdout') | list }}"
        success_msg: "puma memory finds workers and master by title and reports 0 without puma"

    # Each title selects only its own processes: the master pattern must not
    # catch the workers, or the master item would report the largest worker
    - name: Count the puma processes per title through the agent
      ansible.builtin.command:
        argv:
          - zabbix_agent2
          - -c
          - /etc/zabbix/zabbix_agent2.conf
          - -t
          - 'proc.num[,nobody,,"{{ item }}"]'
        chdir: /
      become: true
      become_user: zabbix
      loop:
        - '^puma [0-9]'
        - 'puma: cluster worker'
      register: puma_count
      changed_when: false

    - name: Verify the titles select one master and two workers
      ansible.builtin.assert:
        that:
          - puma_count.results[0].stdout is regex('\\[[a-z]\\|1\\]')
          - puma_count.results[1].stdout is regex('\\[[a-z]\\|2\\]')
        fail_msg: "puma process selection is wrong: {{ puma_count.results | map(attribute='stdout') | list }}"

    # zabbix may only run the exact root commands of linux_check.sh, generic
    # tools like cat or find with arbitrary arguments would grant root access
    - name: Run allowed root commands as zabbix via sudo
      ansible.builtin.command: "sudo -n {{ item }}"
      become: true
      become_user: zabbix
      loop:
        - /usr/bin/find /etc -type f -perm -002
        - /usr/bin/find /etc -type d -perm -002
        - /usr/bin/passwd -S -a
        - /usr/sbin/sshd -T
      changed_when: false

    - name: Try forbidden root commands as zabbix via sudo
      ansible.builtin.command: "sudo -n {{ item }}"
      become: true
      become_user: zabbix
      loop:
        - /bin/cat /etc/shadow
        - /usr/bin/tail /etc/shadow
        - /usr/bin/test -f /etc/shadow
        - /usr/bin/stat /etc/shadow
        - /usr/bin/find /etc -maxdepth 0 -exec /bin/true ;
        - /usr/bin/find / -maxdepth 0
        - /usr/bin/passwd -S root
        - /usr/bin/apt-get -qq update
      register: zabbix_forbidden_sudo
      changed_when: false
      failed_when: false

    - name: Verify forbidden root commands are rejected
      ansible.builtin.assert:
        that:
          - zabbix_forbidden_sudo.results | map(attribute='rc') | select('equalto', 0) | list | length == 0
        fail_msg: >-
          zabbix can run a forbidden command as root:
          {{ zabbix_forbidden_sudo.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}
        success_msg: "zabbix sudo rights are limited to the linux_check.sh commands"
