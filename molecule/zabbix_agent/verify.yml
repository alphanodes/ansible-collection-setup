---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check zabbix-agent2 is installed
      ansible.builtin.command: dpkg -l zabbix-agent2
      register: zabbix_package
      changed_when: false
      failed_when: zabbix_package.rc != 0

    - name: Check zabbix-agent2 service is running
      ansible.builtin.systemd:
        name: zabbix-agent2
      register: zabbix_service
      failed_when: zabbix_service.status.ActiveState != "active"

    - name: Check zabbix configuration file exists
      ansible.builtin.stat:
        path: /etc/zabbix/zabbix_agent2.conf
      register: zabbix_conf
      failed_when: not zabbix_conf.stat.exists

    - name: Check zabbix addons directory exists
      ansible.builtin.stat:
        path: /usr/share/zabbix_addons/scripts
      register: zabbix_addons
      failed_when: not zabbix_addons.stat.exists

    - name: Check linux_check.sh script exists
      ansible.builtin.stat:
        path: /usr/share/zabbix_addons/scripts/linux_check.sh
      register: linux_check
      failed_when: not linux_check.stat.exists

    - name: Check sudoers configuration exists
      ansible.builtin.stat:
        path: /etc/sudoers.d/zabbix
      register: zabbix_sudoers
      failed_when: not zabbix_sudoers.stat.exists

    - name: Check zabbix user exists
      ansible.builtin.getent:
        database: passwd
        key: zabbix
      register: zabbix_user

    - name: Verify zabbix agent is listening on port 10050
      ansible.builtin.wait_for:
        port: 10050
        timeout: 5

    - name: Read zabbix_agent2.conf content
      ansible.builtin.slurp:
        src: /etc/zabbix/zabbix_agent2.conf
      register: zabbix_conf_content

    - name: Decode zabbix_agent2.conf content
      ansible.builtin.set_fact:
        zabbix_conf_decoded: "{{ zabbix_conf_content.content | b64decode }}"

    - name: Verify journal UserParameters use the wrapper script
      ansible.builtin.assert:
        that:
          - "'UserParameter=journalctl[*], bash /usr/share/zabbix_addons/scripts/journal_check.sh global' in zabbix_conf_decoded"
          - "'UserParameter=journalctl_service[*], bash /usr/share/zabbix_addons/scripts/journal_check.sh service' in zabbix_conf_decoded"
        fail_msg: "journal UserParameters do not call journal_check.sh"
        success_msg: "journal UserParameters call journal_check.sh"

    - name: Verify no configuration line exceeds the agent limit of 2048 bytes
      ansible.builtin.assert:
        that:
          - zabbix_conf_decoded.split('\n') | map('length') | max <= 2048
        fail_msg: "zabbix_agent2.conf contains a line longer than 2048 bytes, agent will not start"
        success_msg: "all configuration lines within 2048 bytes"

    - name: Read journal pattern files
      ansible.builtin.slurp:
        src: /etc/zabbix/journal/{{ item }}.list
      loop:
        - keywords
        - ignore
        - redmine_keywords
        - redmine_ignore
      register: journal_patterns

    # An empty line matches everything, with grep -v it would hide all lines
    - name: Verify journal pattern files are filled and contain no empty lines
      ansible.builtin.assert:
        that:
          - pattern_lines | length > 0
          - pattern_lines | select('equalto', '') | list | length == 0
        fail_msg: "{{ item.item }}.list is empty or contains empty lines"
        success_msg: "{{ item.item }}.list is valid"
      vars:
        pattern_lines: "{{ (item.content | b64decode).rstrip('\n').split('\n') }}"
      loop: "{{ journal_patterns.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify keyword and ignore patterns are deployed
      ansible.builtin.assert:
        that:
          - "'Connection refused' in (journal_patterns.results[0].content | b64decode)"
          - "'RoutingError' in (journal_patterns.results[1].content | b64decode)"
          - "'RoutingError' in (journal_patterns.results[3].content | b64decode)"
        fail_msg: "journal patterns are missing expected entries"
        success_msg: "journal patterns contain expected entries"

    # Ansible logs the module arguments to the journal, so the test messages
    # use a random marker passed by environment, which never shows up there.
    - name: Generate journal test marker
      ansible.builtin.command: cat /proc/sys/kernel/random/uuid
      register: journal_marker
      changed_when: false

    - name: Write test messages to the journal
      ansible.builtin.shell: |
        set -o pipefail
        echo "$MARK relay warning: relayhost configuration problem" | systemd-cat -t molecule-relay
        echo "$MARK deferred status=deferred (connect to relay[192.0.2.1]:25: Connection timed out)" | systemd-cat -t molecule-relay
        echo "$MARK warning: unknown[192.0.2.1]: SASL LOGIN authentication failed" | systemd-cat -t molecule-smtpd
        systemd-run --unit=puma-molecule --wait --quiet --setenv=MARK="$MARK" /bin/sh -c 'echo "$MARK puma error"'
        systemctl reset-failed puma-molecule.service 2>/dev/null || true
        journalctl --flush
      args:
        executable: /bin/bash
      environment:
        MARK: "{{ journal_marker.stdout }}"
      changed_when: false

    - name: Run journalctl item through the agent
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t 'journalctl[]'
      register: journal_item
      changed_when: false

    - name: Run journalctl_service item through the agent
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t 'journalctl_service[puma-molecule]'
      register: journal_service_item
      changed_when: false

    # The converge defines a Redmine instance, so the Redmine UserParameter exists
    - name: Run redmine_log item through the agent
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t 'redmine_log[puma-molecule]'
      register: journal_redmine
      changed_when: false

    - name: Verify journal checks detect errors and skip ignored lines
      ansible.builtin.assert:
        that:
          - "'ZBX_NOTSUPPORTED' not in journal_item.stdout"
          - "(journal_marker.stdout ~ ' relay warning: relayhost configuration problem') in journal_item.stdout"
          - "(journal_marker.stdout ~ ' deferred status=deferred') not in journal_item.stdout"
          - "(journal_marker.stdout ~ ' warning: unknown') not in journal_item.stdout"
          - "(journal_marker.stdout ~ ' puma error') not in journal_item.stdout"
          - "(journal_marker.stdout ~ ' puma error') in journal_service_item.stdout"
          - "(journal_marker.stdout ~ ' puma error') in journal_redmine.stdout"
        fail_msg: "journal check result is wrong: {{ journal_item.stdout }}"
        success_msg: "journal checks report errors, ignore patterns and puma exclusion work"

    - name: Read systemd global status before the test
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t systemctl.global_status
      register: systemd_status_before
      changed_when: false

    # A failed transient unit named like SentinelOne maintenance tasks must not
    # change the reported state, any other failed unit must turn it degraded
    - name: Create failed units for the systemd status test
      ansible.builtin.shell: |
        systemd-run --unit=sentinel-agent-task-molecule --wait --quiet /bin/false || true
        systemd-run --unit=molecule-failing-unit --wait --quiet /bin/false || true
        systemctl list-units --failed --no-legend --plain
      args:
        executable: /bin/bash
      register: systemd_failed_units
      changed_when: false

    - name: Read systemd global status with both failed units
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t systemctl.global_status
      register: systemd_status_both
      changed_when: false

    - name: Reset the other failed unit
      ansible.builtin.command: systemctl reset-failed molecule-failing-unit.service
      changed_when: false

    - name: Read systemd global status with only the ignored unit failed
      ansible.builtin.command: zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf -t systemctl.global_status
      register: systemd_status_ignored
      changed_when: false

    - name: Reset the ignored failed unit
      ansible.builtin.command: systemctl reset-failed sentinel-agent-task-molecule.service
      changed_when: false

    - name: Verify ignored failed units do not degrade the systemd status
      ansible.builtin.assert:
        that:
          - "'sentinel-agent-task-molecule.service' in systemd_failed_units.stdout"
          - "'molecule-failing-unit.service' in systemd_failed_units.stdout"
          - "'State: degraded' in systemd_status_both.stdout"
          - "(systemd_status_ignored.stdout | regex_search('State: [a-z]+')) == (systemd_status_before.stdout | regex_search('State: [a-z]+'))"
        fail_msg: >-
          before: {{ systemd_status_before.stdout }},
          both failed: {{ systemd_status_both.stdout }},
          only ignored failed: {{ systemd_status_ignored.stdout }}
        success_msg: "systemd status ignores SentinelOne tasks and reports other failed units"

    # zabbix may only run the exact root commands of linux_check.sh, generic
    # tools like cat or find with arbitrary arguments would grant root access
    - name: Run allowed root commands as zabbix via sudo
      ansible.builtin.command: "sudo -n {{ item }}"
      become: true
      become_user: zabbix
      loop:
        - /usr/bin/find /etc -type f -perm -002
        - /usr/bin/find /etc -type d -perm -002
        - /usr/bin/passwd -S root
      changed_when: false

    - name: Try forbidden root commands as zabbix via sudo
      ansible.builtin.command: "sudo -n {{ item }}"
      become: true
      become_user: zabbix
      loop:
        - /bin/cat /etc/shadow
        - /usr/bin/tail /etc/shadow
        - /usr/bin/test -f /etc/shadow
        - /usr/bin/stat /etc/shadow
        - /usr/bin/find /etc -maxdepth 0 -exec /bin/true ;
        - /usr/bin/find / -maxdepth 0
      register: zabbix_forbidden_sudo
      changed_when: false
      failed_when: false

    - name: Verify forbidden root commands are rejected
      ansible.builtin.assert:
        that:
          - zabbix_forbidden_sudo.results | map(attribute='rc') | select('equalto', 0) | list | length == 0
        fail_msg: >-
          zabbix can run a forbidden command as root:
          {{ zabbix_forbidden_sudo.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}
        success_msg: "zabbix sudo rights are limited to the linux_check.sh commands"
