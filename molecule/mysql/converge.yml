---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

  roles:
    - role: alphanodes.setup.mysql
      vars:
        # Bootstrap over the unix socket and set a root password for the tests
        mysql_socket_force: true
        mysql_root_password: root
        # Use /tmp as tmpdir in CI to avoid permission and mount issues in /run.
        # The role leaves a world writable directory alone, see roles/mysql.
        mysql_server_tmpdir: /tmp
        # Create a test database for the verification
        mysql_databases:
          - name: test_db
            encoding: utf8mb4
            collation: utf8mb4_unicode_ci

  post_tasks:
    - name: Make sure we can connect to MySQL via Unix socket.
      ansible.builtin.command: "mysql -u root -proot -e 'show databases;'"
      changed_when: false

    - name: Make sure we can connect to MySQL via TCP.
      ansible.builtin.command: "mysql -u root -proot -h 127.0.0.1 -e 'show databases;'"
      changed_when: false
