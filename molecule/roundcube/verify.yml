---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
      check_mode: true
      register: nginx_service
      failed_when: nginx_service.changed

    - name: Check nginx configuration syntax
      ansible.builtin.command: nginx -t
      register: nginx_syntax
      changed_when: false

    - name: Check if php-fpm is running
      ansible.builtin.service:
        name: php8.2-fpm
        state: started
      check_mode: true
      register: phpfpm_service
      failed_when: phpfpm_service.changed

    - name: Check if mysql is running
      ansible.builtin.service:
        name: mysql
        state: started
      check_mode: true
      register: mysql_service
      failed_when: mysql_service.changed

    - name: Check if roundcube vhost config exists
      ansible.builtin.stat:
        path: /etc/nginx/sites-available/roundcube.conf
      register: roundcube_vhost

    - name: Verify roundcube vhost exists
      ansible.builtin.assert:
        that:
          - roundcube_vhost.stat.exists
        fail_msg: "roundcube vhost configuration not found"

    - name: Verify roundcube vhost is enabled
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/roundcube.conf
      register: roundcube_enabled

    - name: Verify roundcube vhost is enabled
      ansible.builtin.assert:
        that:
          - roundcube_enabled.stat.exists
        fail_msg: "roundcube vhost not enabled"

    - name: Check if roundcube config exists
      ansible.builtin.stat:
        path: /srv/roundcube/config/config.inc.php
      register: roundcube_config

    - name: Verify roundcube config exists
      ansible.builtin.assert:
        that:
          - roundcube_config.stat.exists
        fail_msg: "roundcube configuration file not found"

    - name: Read roundcube config
      ansible.builtin.slurp:
        src: /srv/roundcube/config/config.inc.php
      register: roundcube_config_content

    - name: Verify roundcube config uses the configured IMAP host
      ansible.builtin.assert:
        that:
          - >-
            "$config['imap_host'] = 'tls://imap.example.com:143';"
            in (roundcube_config_content.content | b64decode)
        fail_msg: "imap_host does not match roundcube_imap_host"

    - name: Check roundcube database exists
      ansible.builtin.command: >
        mysql -e "SHOW DATABASES LIKE 'roundcube';"
      register: roundcube_db
      changed_when: false

    - name: Verify roundcube database exists
      ansible.builtin.assert:
        that:
          - "'roundcube' in roundcube_db.stdout"
        fail_msg: "roundcube database not found"

    - name: Test roundcube endpoint via HTTPS
      ansible.builtin.command: >
        curl -sk -o /dev/null -w '%{http_code}' -H 'Host: roundcube.local'
        https://127.0.0.1/
      register: roundcube_endpoint
      changed_when: false
      failed_when: roundcube_endpoint.stdout not in ['200', '302', '403']

    - name: Check vhost has PHP-FPM configuration
      ansible.builtin.command: grep -q "fastcgi_pass" /etc/nginx/sites-available/roundcube.conf
      register: fpm_config
      changed_when: false
      failed_when: fpm_config.rc != 0

    - name: Check vhost uses public_html as document root
      ansible.builtin.command: grep -q "root /srv/roundcube/public_html;" /etc/nginx/sites-available/roundcube.conf
      register: root_config
      changed_when: false
      failed_when: root_config.rc != 0

    - name: Fetch roundcube login page
      ansible.builtin.command: >
        curl -sk -H 'Host: roundcube.local' https://127.0.0.1/
      register: roundcube_login
      changed_when: false

    - name: Verify login page is rendered by roundcube 1.7
      ansible.builtin.assert:
        that:
          - "'rcmloginuser' in roundcube_login.stdout"
          - "'static.php/skins/elastic/' in roundcube_login.stdout"
        fail_msg: "roundcube login page not rendered or static.php not used"

    - name: Check static files are served via static.php
      ansible.builtin.command: >
        curl -sk -o /dev/null -w '%{http_code} %{content_type}' -H 'Host: roundcube.local'
        https://127.0.0.1/static.php/{{ item }}
      register: static_files
      changed_when: false
      failed_when: not static_files.stdout.startswith('200 ')
      loop:
        - skins/elastic/styles/styles.min.css
        - program/js/app.js
        - plugins/archive/archive.js

    - name: Check files outside public_html are not reachable
      ansible.builtin.command: >
        curl -sk -o /dev/null -w '%{http_code}' -H 'Host: roundcube.local'
        https://127.0.0.1/{{ item }}
      register: hidden_files
      changed_when: false
      failed_when: hidden_files.stdout != '404'
      loop:
        - config/config.inc.php
        - composer.json
        - static.php/config/config.inc.php

    - name: Read roundcube database schema version
      ansible.builtin.command: >
        mysql -N -e "SELECT value FROM roundcube.system WHERE name = 'roundcube-version';"
      register: roundcube_schema
      changed_when: false

    - name: Verify roundcube database schema is installed
      ansible.builtin.assert:
        that:
          - roundcube_schema.stdout | length > 0
        fail_msg: "roundcube database schema not installed"

    - name: Check build results were rebuilt after the side effect
      ansible.builtin.stat:
        path: /srv/roundcube/skins/elastic/styles/styles.min.css
      register: rebuilt_css

    - name: Verify missing build results are rebuilt
      ansible.builtin.assert:
        that:
          - rebuilt_css.stat.exists
          - rebuilt_css.stat.size > 0
        fail_msg: "styles.min.css was not rebuilt after it was removed"

    - name: Check removed third-party plugins are gone
      ansible.builtin.stat:
        path: /srv/roundcube/plugins/{{ item }}
      register: removed_plugins
      loop:
        - carddav
        - contextmenu

    - name: Verify removed third-party plugins are gone
      ansible.builtin.assert:
        that:
          - removed_plugins.results | selectattr('stat.exists') | list | length == 0
        fail_msg: "third-party plugin directory still exists"

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "=== ROUNDCUBE + NGINX_MONO INTEGRATION TESTS ==="
          - "Nginx service: {{ 'OK' if not nginx_service.changed else 'FAILED' }}"
          - "Nginx syntax: {{ 'OK' if nginx_syntax.rc == 0 else 'FAILED' }}"
          - "PHP-FPM service: {{ 'OK' if not phpfpm_service.changed else 'FAILED' }}"
          - "MySQL service: {{ 'OK' if not mysql_service.changed else 'FAILED' }}"
          - "Roundcube vhost: {{ 'OK' if roundcube_vhost.stat.exists else 'FAILED' }}"
          - "Roundcube enabled: {{ 'OK' if roundcube_enabled.stat.exists else 'FAILED' }}"
          - "Roundcube config: {{ 'OK' if roundcube_config.stat.exists else 'FAILED' }}"
          - "Roundcube database: {{ 'OK' if 'roundcube' in roundcube_db.stdout else 'FAILED' }}"
          - "Roundcube endpoint: {{ 'OK' if roundcube_endpoint.stdout in ['200', '302', '403'] else 'FAILED' }}"
          - "PHP-FPM config: {{ 'OK' if fpm_config.rc == 0 else 'FAILED' }}"
          - "public_html root: {{ 'OK' if root_config.rc == 0 else 'FAILED' }}"
          - "Database schema: {{ roundcube_schema.stdout }}"
          - "=== ROUNDCUBE INTEGRATION SUCCESS ==="
