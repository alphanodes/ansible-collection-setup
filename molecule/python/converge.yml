---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

    # A cache from earlier pip runs, the role has to remove it. Only on the
    # first converge, so the idempotence run finds nothing to remove.
    - name: Create an old pip cache
      ansible.builtin.command:
        cmd: mkdir -p /root/.cache/pip/http-v2 /root/.molecule-pip-cache-seeded
        creates: /root/.molecule-pip-cache-seeded

  vars:
    # Use 'present' for idempotency tests, production uses 'latest'
    python_pip_default_state: present
    python_pip_packages:
      # Test installing a specific version of a package
      - name: six
        version: '1.16.0'
        virtualenv: /opt/molecule-venv

  roles:
    - role: alphanodes.setup.python
