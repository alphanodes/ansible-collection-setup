---
# Test: certbot + nginx_mono integration on fresh server
#
# Simulates the real-world deployment sequence:
#   1. certbot runs FIRST on a fresh server (only Debian default nginx config)
#   2. nginx_mono creates the real vhost (must not conflict with certbot's temp config)
#   3. certbot runs AGAIN (must detect existing vhost and skip temp config)
#
# This catches the chicken-and-egg problem where certbot needs ACME challenge
# support on port 80, but nginx_mono hasn't created its vhost yet.
#
# Phase 0 runs certbot in standalone mode first, so the host switches from
# standalone to webroot. The stop/start hooks created there must stay while a
# certificate still renews with standalone (phase 1) and be removed once none
# does (phase 3), otherwise nginx is stopped before every validation.

- name: Converge
  hosts: all
  become: true

  vars:
    nginx_with_ssl: false
    nginx_with_ipv6: false
    nginx_with_http3: false
    hoster: 'local'

    certbot_auto_renew: true
    certbot_remove_cron_job: true
    certbot_deploy_hook: "systemctl reload nginx"
    certbot_nginx_integration: true
    certbot_create_method: webroot
    certbot_webroot: /var/www/letsencrypt
    certbot_create_if_missing: false

    certbot_certs:
      - domains:
          - test.local

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false

    - name: Install nginx and cron
      ansible.builtin.apt:
        name:
          - nginx
          - cron
        state: present

    # The Debian test images install ansible-core with pip, which puts a new
    # cryptography into /usr/local. It shadows the Debian package and breaks
    # the pyOpenSSL that the Debian certbot imports, so certbot crashes on
    # start. Servers do not have it, so remove it to test the real certbot.
    - name: Remove cryptography installed by pip
      ansible.builtin.pip:
        name: cryptography
        state: absent
        extra_args: --break-system-packages
      when: ansible_facts['distribution'] == 'Debian'

    - name: Create test document root
      ansible.builtin.file:
        path: /srv/certbot_test
        state: directory
        mode: '0755'

  tasks:
    # Phase 0: standalone mode creates the stop/start renewal hooks
    - name: "Phase 0: Include certbot role in standalone mode"
      ansible.builtin.include_role:
        name: alphanodes.setup.certbot
      vars:
        certbot_create_method: standalone
        certbot_create_standalone_stop_services:
          - nginx

    - name: "Phase 0: Check standalone hooks"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/letsencrypt/renewal-hooks/pre/stop_services
        - /etc/letsencrypt/renewal-hooks/post/start_services
      register: standalone_hooks

    - name: "Phase 0: Read standalone hooks"
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/letsencrypt/renewal-hooks/pre/stop_services
        - /etc/letsencrypt/renewal-hooks/post/start_services
      register: standalone_hooks_content

    - name: "Phase 0: Verify standalone hooks were created"
      ansible.builtin.assert:
        that:
          - standalone_hooks.results | selectattr('stat.exists') | list | length == 2
          - standalone_hooks.results | map(attribute='stat.mode') | unique | list == ['0750']
          - "'systemctl stop nginx' in (standalone_hooks_content.results[0].content | b64decode)"
          - "'systemctl start nginx' in (standalone_hooks_content.results[1].content | b64decode)"
        fail_msg: "Standalone mode must create executable stop/start hooks for nginx"

    # A certificate issued in standalone mode keeps renewing with standalone
    # after the switch to webroot, together with a webroot certificate. Its
    # renewal config may call the hook files, so the webroot run in phase 1
    # must keep them.
    - name: "Phase 0: Create renewal config folder"
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal
        state: directory
        mode: '0755'

    - name: "Phase 0: Create renewal configs of both authenticators"
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal/{{ item.name }}.conf
        content: |
          [renewalparams]
          authenticator = {{ item.authenticator }}
        mode: '0644'
      loop:
        - {name: standalone.test.local, authenticator: standalone}
        - {name: webroot.test.local, authenticator: webroot}

    # Phase 1: certbot on fresh server (Debian default nginx config active)
    - name: "Phase 1: Include certbot role on fresh server"
      ansible.builtin.include_role:
        name: alphanodes.setup.certbot

    - name: "Phase 1: Check standalone hooks"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/letsencrypt/renewal-hooks/pre/stop_services
        - /etc/letsencrypt/renewal-hooks/post/start_services
      register: standalone_hooks_kept

    # The fake standalone config has no certificate, so the switch to webroot
    # must fail without failing the role and leave the config untouched
    - name: "Phase 1: Read standalone renewal config"
      ansible.builtin.slurp:
        src: /etc/letsencrypt/renewal/standalone.test.local.conf
      register: standalone_renewal_conf

    - name: "Phase 1: Verify standalone config and hooks are unchanged"
      ansible.builtin.assert:
        that:
          - "'authenticator = standalone' in (standalone_renewal_conf.content | b64decode)"
          - standalone_hooks_kept.results | selectattr('stat.exists') | list | length == 2
        fail_msg: "A failed or skipped switch must keep the standalone config and its hooks"

    - name: "Phase 1: Verify switch to webroot was tried and failed"
      ansible.builtin.assert:
        that:
          - certbot_migrate_results.results | length == 1
          - certbot_migrate_results.results[0].rc != 0
        fail_msg: "certbot reconfigure must be tried and fail without a certificate"
      when: certbot_version_output.stdout.split() | last is version('2.3', '>=')

    # Debian 12 ships certbot 2.1 without reconfigure
    - name: "Phase 1: Verify switch to webroot was skipped for old certbot"
      ansible.builtin.assert:
        that:
          - certbot_migrate_results.results | selectattr('skipped', 'defined') | list | length == 1
        fail_msg: "certbot reconfigure must not run with certbot older than 2.3"
      when: certbot_version_output.stdout.split() | last is version('2.3', '<')

    # Once the standalone certificate is gone, phase 3 removes the hooks
    - name: "Phase 1: Remove standalone renewal config"
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal/standalone.test.local.conf
        state: absent

    # Phase 2: nginx_mono creates vhost (must remove temp ACME config)
    - name: "Phase 2: Include nginx_mono role to create vhost"
      ansible.builtin.include_role:
        name: alphanodes.setup.nginx_mono
      vars:
        nginx_mono_service_name: certbot_test
        nginx_mono_service_enabled: true
        nginx_mono_service_config:
          server_name: test.local
          root: /srv/certbot_test
          index: index.html
          vhost_default: true
          vhost_for_zabbix: false
          letsencrypt: false
          # Redirect names are part of the certificate, so they must answer
          # the ACME challenge themselves instead of redirecting it
          redirects:
            - alias.test.local

    # Phase 3: certbot runs again (must not recreate temp ACME config)
    - name: "Phase 3: Include certbot role again (subsequent run)"
      ansible.builtin.include_role:
        name: alphanodes.setup.certbot

    # Phase 4: re-render the same vhost with an empty certbot_certs. The ACME
    # include used to be gated on certbot_certs, which meant a host whose
    # vhosts were rendered before certbot_certs existed could never pass the
    # HTTP-01 challenge - certbot ran before nginx_mono could fix the vhost.
    # The include must now be present regardless of certbot_certs.
    - name: "Phase 4: Re-render vhost without certbot_certs"
      ansible.builtin.include_role:
        name: alphanodes.setup.nginx_mono
      vars:
        certbot_certs: []
        nginx_mono_service_name: certbot_test
        nginx_mono_service_enabled: true
        nginx_mono_service_config:
          server_name: test.local
          root: /srv/certbot_test
          index: index.html
          vhost_default: true
          vhost_for_zabbix: false
          letsencrypt: false
          # Redirect names are part of the certificate, so they must answer
          # the ACME challenge themselves instead of redirecting it
          redirects:
            - alias.test.local
