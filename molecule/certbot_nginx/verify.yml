---
- name: Verify certbot + nginx_mono integration
  hosts: all
  gather_facts: false
  tasks:
    # nginx must be running with valid config
    - name: Check nginx configuration syntax
      ansible.builtin.command: nginx -t
      register: nginx_syntax
      changed_when: false

    - name: Verify nginx config is valid
      ansible.builtin.assert:
        that:
          - nginx_syntax.rc == 0
        fail_msg: "nginx configuration is invalid: {{ nginx_syntax.stderr }}"

    - name: Check nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
      check_mode: true
      register: nginx_service
      failed_when: nginx_service.changed

    # Temporary ACME server block must be removed
    - name: Check temporary ACME challenge server block is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/acme-challenge.conf
      register: acme_server_block

    - name: Verify temporary ACME server block was removed
      ansible.builtin.assert:
        that:
          - not acme_server_block.stat.exists
        fail_msg: "Temporary ACME challenge server block should have been removed by nginx_mono"

    # Debian default must be removed
    - name: Check Debian default nginx config is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_config

    - name: Verify Debian default config was removed
      ansible.builtin.assert:
        that:
          - not default_config.stat.exists
        fail_msg: "Debian default nginx config should have been removed"

    # nginx_mono vhost must exist and be active
    - name: Check nginx_mono vhost exists
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/certbot_test.conf
      register: vhost_config

    - name: Verify vhost is enabled
      ansible.builtin.assert:
        that:
          - vhost_config.stat.exists
        fail_msg: "nginx_mono vhost certbot_test.conf is not enabled"

    # ACME challenge include must still exist (shared config, not the server block)
    - name: Check acme-challenge.conf include exists
      ansible.builtin.stat:
        path: /etc/nginx/acme-challenge.conf
      register: acme_include

    - name: Verify acme-challenge.conf include exists
      ansible.builtin.assert:
        that:
          - acme_include.stat.exists
        fail_msg: "ACME challenge nginx include config not found"

    # Webroot directory must exist
    - name: Check webroot directory exists
      ansible.builtin.stat:
        path: /var/www/letsencrypt
      register: webroot_dir

    - name: Verify webroot directory exists
      ansible.builtin.assert:
        that:
          - webroot_dir.stat.exists
          - webroot_dir.stat.isdir
        fail_msg: "Certbot webroot directory not found"

    # Vhost must include ACME challenge in redirect block (our fix).
    # The include uses a glob so nginx tolerates a missing file on hosts
    # without certbot - see nginx_mono/templates/includes/port_redirect.inc.j2.
    # Converge phase 4 re-renders this vhost with an empty certbot_certs, so
    # this also guards against the include becoming conditional again.
    - name: Check vhost contains ACME challenge include
      ansible.builtin.shell: |
        set -e
        grep -F 'include /etc/nginx/acme-challenge*.conf' /etc/nginx/sites-available/certbot_test.conf
      register: vhost_acme_check
      changed_when: false
      failed_when: vhost_acme_check.rc != 0

    # The redirect must sit inside "location /" - a server level "return" runs
    # in the rewrite phase, before location matching, and would swallow the
    # ACME challenge requests.
    - name: Check redirect is wrapped in location block
      ansible.builtin.shell: |
        set -e -o pipefail
        grep -A2 -F 'include /etc/nginx/acme-challenge*.conf' /etc/nginx/sites-available/certbot_test.conf | grep -qF 'location / {'
      args:
        executable: /bin/bash
      register: vhost_location_check
      changed_when: false
      failed_when: vhost_location_check.rc != 0

    # No duplicate default_server on port 80
    - name: Check for duplicate default_server on port 80
      ansible.builtin.shell: |
        set -euo pipefail
        count=$(nginx -T 2>/dev/null | grep -c 'listen 80 default_server')
        if [ "$count" -gt 1 ]; then
          echo "FAIL: Found $count default_server directives on port 80"
          exit 1
        fi
        echo "OK: Found $count default_server directive on port 80"
      args:
        executable: /bin/bash
      register: default_server_check
      changed_when: false
      failed_when: default_server_check.rc != 0

    # The standalone hooks of converge phase 0 must be gone after the switch
    # to webroot, otherwise nginx is stopped before every validation
    - name: Check standalone hooks are absent
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/letsencrypt/renewal-hooks/pre/stop_services
        - /etc/letsencrypt/renewal-hooks/post/start_services
      register: standalone_hooks

    - name: Verify standalone hooks were removed
      ansible.builtin.assert:
        that:
          - standalone_hooks.results | selectattr('stat.exists') | list | length == 0
        fail_msg: "Standalone hooks must be removed for webroot mode"

    # A redirect name must serve the ACME challenge from the webroot and
    # redirect everything else
    - name: Create ACME challenge folder
      ansible.builtin.file:
        path: /var/www/letsencrypt/.well-known/acme-challenge
        state: directory
        mode: '0755'

    - name: Create ACME challenge test file
      ansible.builtin.copy:
        dest: /var/www/letsencrypt/.well-known/acme-challenge/redirect-test
        content: redirect-test-token
        mode: '0644'

    - name: Request ACME challenge on redirect name
      ansible.builtin.uri:
        url: http://127.0.0.1/.well-known/acme-challenge/redirect-test
        headers:
          Host: alias.test.local
        follow_redirects: none
        return_content: true
      register: redirect_acme_response

    - name: Request other path on redirect name
      ansible.builtin.uri:
        url: http://127.0.0.1/some/page
        headers:
          Host: alias.test.local
        follow_redirects: none
        status_code: 301
      register: redirect_other_response

    - name: Verify redirect name serves ACME challenge and redirects the rest
      ansible.builtin.assert:
        that:
          - redirect_acme_response.status == 200
          - redirect_acme_response.content == 'redirect-test-token'
          - redirect_other_response.location == 'https://test.local/some/page'
        fail_msg: "Redirect names must answer the ACME challenge and redirect all other requests"

    # A static redirect vhost must serve the ACME challenge as well. robots.txt
    # and friends are no longer redirected, they hit the default locations.
    - name: Request paths on static redirect vhost
      ansible.builtin.uri:
        url: "http://127.0.0.1{{ item.path }}"
        headers:
          Host: static.test.local
        follow_redirects: none
        return_content: true
        status_code: "{{ item.status }}"
      loop:
        - {path: /.well-known/acme-challenge/redirect-test, status: 200}
        - {path: /some/page, status: 301}
        - {path: /robots.txt, status: 404}
      register: static_redirect_responses

    - name: Verify static redirect vhost serves ACME challenge and redirects the rest
      ansible.builtin.assert:
        that:
          - static_redirect_responses.results[0].content == 'redirect-test-token'
          - static_redirect_responses.results[1].location == 'https://www.example.com'
        fail_msg: "Static redirect vhosts must answer the ACME challenge and redirect all other requests"

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "nginx config valid: {{ 'OK' if nginx_syntax.rc == 0 else 'FAILED' }}"
          - "nginx running: {{ 'OK' if not nginx_service.changed else 'FAILED' }}"
          - "temp ACME block removed: {{ 'OK' if not acme_server_block.stat.exists else 'FAILED' }}"
          - "default config removed: {{ 'OK' if not default_config.stat.exists else 'FAILED' }}"
          - "vhost enabled: {{ 'OK' if vhost_config.stat.exists else 'FAILED' }}"
          - "acme include exists: {{ 'OK' if acme_include.stat.exists else 'FAILED' }}"
          - "webroot exists: {{ 'OK' if webroot_dir.stat.exists else 'FAILED' }}"
          - "vhost has ACME include: {{ 'OK' if vhost_acme_check.rc == 0 else 'FAILED' }}"
          - "no duplicate default_server: {{ 'OK' if default_server_check.rc == 0 else 'FAILED' }}"
