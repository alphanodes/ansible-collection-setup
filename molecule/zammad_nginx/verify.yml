---
- name: Verify
  hosts: all
  become: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Verify Basic Auth protects static and proxied paths
      ansible.builtin.uri:
        url: http://127.0.0.1{{ item }}
        headers:
          Host: '{{ zammad_vhost_server }}'
        status_code: 401
      loop:
        - /
        - /robots.txt
        - /assets/auth-test.js
        - /ws
        - /cable

    - name: Verify shared credentials grant access to static content
      ansible.builtin.uri:
        url: http://127.0.0.1/robots.txt
        headers:
          Host: '{{ zammad_vhost_server }}'
        url_username: molecule
        url_password: molecule-http-password
        force_basic_auth: true
        return_content: true
      register: authenticated

    - name: Verify the authenticated response
      ansible.builtin.assert:
        that:
          - authenticated.content == 'Zammad auth test\n'

    - name: Verify wrong credentials are rejected
      ansible.builtin.uri:
        url: http://127.0.0.1/robots.txt
        headers:
          Host: '{{ zammad_vhost_server }}'
        url_username: molecule
        url_password: wrong-password
        force_basic_auth: true
        status_code: 401

    # No Zammad backend is running in this isolated nginx test. A 502 response
    # confirms that valid credentials pass the gateway and reach proxy routing.
    - name: Verify authenticated requests pass through to backend routing
      ansible.builtin.uri:
        url: http://127.0.0.1{{ item }}
        headers:
          Host: '{{ zammad_vhost_server }}'
        url_username: molecule
        url_password: molecule-http-password
        force_basic_auth: true
        status_code: 502
      loop:
        - /
        - /ws
        - /cable

    - name: Read generated vhost
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/zammad.conf
      register: vhost

    - name: Verify gateway credentials are not forwarded to application backends
      ansible.builtin.assert:
        that:
          - (vhost.content | b64decode).count('proxy_set_header Authorization "";') == 3

    - name: Verify the proxy locations get the shared and the Zammad specific headers once
      ansible.builtin.assert:
        that:
          - (vhost.content | b64decode).count('proxy_set_header ' + item.header + ';') == item.count
          - (vhost.content | b64decode).count('proxy_set_header ' + (item.header | split(' ') | first) + ' ') == item.count
        fail_msg: "Expected {{ item.count }} of: {{ item.header }}"
      loop:
        - {header: 'Host $host', count: 3}
        - {header: 'X-Forwarded-For $proxy_add_x_forwarded_for', count: 3}
        - {header: 'Client-IP ""', count: 3}
        - {header: 'Forwarded $proxy_forwarded', count: 3}
        - {header: 'X-Forwarded-Proto $scheme', count: 3}
        - {header: 'X-Forwarded-Scheme ""', count: 3}
        - {header: 'X-Forwarded-Ssl ""', count: 3}
        - {header: 'X-Forwarded-User ""', count: 1}
        - {header: 'Upgrade $http_upgrade', count: 2}
        - {header: 'Connection $connection_upgrade', count: 2}

    - name: Verify the proxy timeouts of the websocket and the application locations
      ansible.builtin.assert:
        that:
          - (vhost.content | b64decode).count('proxy_read_timeout 86400;') == 2
          - (vhost.content | b64decode).count('proxy_read_timeout 180;') == 1
          - (vhost.content | b64decode).count('proxy_http_version 1.1;') == 3
