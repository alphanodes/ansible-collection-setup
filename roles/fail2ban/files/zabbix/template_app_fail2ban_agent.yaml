---
zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 48d19098672f4e7aa7dab1942260d87d
      template: Fail2ban
      name: Fail2ban
      description: |
        Checks that fail2ban is running and discovers all jails with the
        number of banned IPs and its change.

        This template requires:
        - Zabbix agent with UserParameter fail2ban.discovery and
          fail2ban.status[*] configured by the
          alphanodes.setup.zabbix_agent role
        - the sudo rule for fail2ban-client installed by the
          alphanodes.setup.fail2ban role
      vendor:
        name: AlphaNodes
        version: 7.4-__DATE__
      groups:
        - name: Templates/Applications
      items:
        - uuid: de416c540fd0435db1822e38c036f0d7
          name: 'Fail2Ban service is running'
          key: 'proc.num[fail2ban-server]'
          history: 2w
          description: 'Number of running fail2ban-server processes.'
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Fail2ban
          triggers:
            - uuid: ffa07343b51d4bf58c2b8c324c6a7a62
              expression: 'last(/Fail2ban/proc.num[fail2ban-server])=0'
              name: 'Fail2ban server is Down'
              priority: AVERAGE
      discovery_rules:
        - uuid: ccbd8ba7a96d47b8953af017e3b0f803
          name: 'Fail2ban discovery'
          key: fail2ban.discovery
          delay: 15m
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of jails from fail2ban daemon.'
          item_prototypes:
            - uuid: 0c5158f7dba44bfb96a53d8415ea7498
              name: 'Fail2ban Delta {#JAIL} banned IPs'
              type: DEPENDENT
              key: 'fail2ban.status.delta[{#JAIL}]'
              history: 2w
              preprocessing:
                - type: SIMPLE_CHANGE
              master_item:
                key: 'fail2ban.status[{#JAIL}]'
              tags:
                - tag: Application
                  value: Fail2ban
            - uuid: 8cc0b05211fc4278b2feb46727a4ca97
              name: 'Fail2ban {#JAIL} banned IPs'
              type: ZABBIX_ACTIVE
              key: 'fail2ban.status[{#JAIL}]'
              history: 2w
              tags:
                - tag: Application
                  value: Fail2ban
          graph_prototypes:
            - uuid: b151e34af81548b1b92cf0a6b36cdee7
              name: 'Count of banned IPs on jail {#JAIL}'
              graph_items:
                - color: 00C800
                  item:
                    host: Fail2ban
                    key: 'fail2ban.status[{#JAIL}]'
            - uuid: dfc13edae3e244fc8c4f75cd88e64291
              name: 'Delta count of banned IPs on jail {#JAIL}'
              graph_items:
                - color: 1A7C11
                  item:
                    host: Fail2ban
                    key: 'fail2ban.status.delta[{#JAIL}]'
      tags:
        - tag: application
          value: fail2ban
      valuemaps:
        - uuid: 249132609d114d21bf84a38a3c559bfd
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
