# Fail2Ban configuration file
#
# Repeated form submissions via nginx access log
#
# Bots abuse contact forms to send spam. A visitor submits a form once, so
# repeated POST requests to a form path from one IP are banned. The paths
# (extended regex, alternatives separated by |) are set per jail:
#   filter = nginx-form[form_paths="/(de/)?kontakt|/contact"]
#
# Requires logpath = nginx access log in jail configuration.
[Definition]
form_paths = /contact
failregex = ^<HOST> \S+ \S+ \[.*?\] "POST (%(form_paths)s)(\?[^" ]*)? HTTP/[^"]*" \d+
ignoreregex =
