---

matomo_packages:
  - libmaxminddb-dev
  - php{{ php_version }}-gd
  - php{{ php_version }}-ldap
  - php{{ php_version }}-maxminddb
  - php{{ php_version }}-mbstring
  - php{{ php_version }}-xml
matomo_php_mods_available: /etc/php/{{ php_version }}/mods-available

matomo_redis_php_packages:
  - php{{ php_version }}-redis
  - php{{ php_version }}-igbinary
