---
# Should be in the PATH of your users, so composer runs without the full path.
composer_path: /usr/local/bin/composer
# Update to the latest release on every run, cannot be combined with composer_version.
composer_keep_updated: false
# Install a specific release, e.g. '2.8.4'. Empty uses composer_version_branch.
composer_version: ''
# '--2' (latest 2.x), '--1' (legacy 1.x), '--preview' or '' (latest release,
# which may be a new major version).
composer_version_branch: '--2'

# The directory where global packages will be installed.
composer_home_path: '~/.composer'
composer_home_owner: root
composer_home_group: root

# A list of packages to install globally. See commented examples below for
# usage; the 'release' is optional, and defaults to '@stable'.
composer_global_packages: []
# - { name: phpunit/phpunit, release: "4.7.x" }
# - { name: phpunit/phpunit, release: "@stable" }

# Add vendor/bin of composer_home_path to the system PATH, if global packages
# are configured.
composer_add_to_path: true

# Add a project vendor/bin directory to the PATH
composer_add_project_to_path: false
# composer_project_path: /path/to/project/vendor/bin

# GitHub OAuth token (used to help overcome API rate limits).
composer_github_oauth_token: ''

# Additional COMPOSER_HOME directories which should receive the auth.json.
# Required for deploy users running composer on their own, because composer
# reads the auth.json from the HOME of the executing user. Paths must be
# absolute, group defaults to owner. Files are written with mode 0600 and
# require composer_github_oauth_token.
composer_auth_homes: []
# - path: /srv/drupal/.composer
#   owner: drupal
#   group: drupal

# PHP executable name or full path
# php_executable: php
