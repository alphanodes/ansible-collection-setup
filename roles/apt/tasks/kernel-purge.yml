---

# Weekly removal of unused kernel packages. The script removes installed
# kernels apt considers autoremovable (booted and newest kernels stay) and
# purges leftover config files of removed kernels. This is independent of
# the unattended-upgrades schedule, because unattended-upgrades does not
# detect the kernel package naming of Debian trixie.

- name: Manage apt-kernel-purge script
  ansible.builtin.template:
    src: apt-kernel-purge.sh.j2
    dest: /usr/local/sbin/apt-kernel-purge
    mode: '0755'
  when: apt_kernel_purge_enabled | bool

- name: Manage apt-kernel-purge timer
  ansible.builtin.include_role:
    name: alphanodes.setup.systemd_timer
  vars:
    timers:
      apt-kernel-purge:
        state: "{{ 'present' if apt_kernel_purge_enabled else 'absent' }}"
        exec_start: /usr/local/sbin/apt-kernel-purge
        on_calendar: '{{ apt_kernel_purge_on_calendar }}'
        persistent: true
        after_service: network.target

- name: Remove apt-kernel-purge script
  ansible.builtin.file:
    path: /usr/local/sbin/apt-kernel-purge
    state: absent
  when: not apt_kernel_purge_enabled | bool
