---

- name: Ensure configuration directory exists
  ansible.builtin.file:
    path: /etc/redmine
    state: directory
    mode: '0755'

- name: Ensure Redmine packages are installed
  ansible.builtin.apt:
    name: '{{ redmine_packages }}'
    state: present

- name: Ensure jemalloc library is installed
  ansible.builtin.apt:
    name: libjemalloc2
    state: present
  when: redmine_with_jemalloc

# build packages and ruby-dev are required to compile native gem extensions
- name: Install ruby with build and dev packages
  ansible.builtin.include_role:
    name: alphanodes.setup.ruby
  vars:
    ruby_build: true
    ruby_dev: true
