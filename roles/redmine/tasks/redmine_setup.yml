---

- name: Use rvm repository for ruby for Ubuntu
  when: ansible_facts.distribution == 'Ubuntu' and redmine_rvm_apt
  block:
    - name: Remove old apt repository files
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/apt/sources.list.d/ppa_launchpadcontent_net_rael_gc_rvm_ubuntu.list
        - /etc/apt/trusted.gpg.d/rvm-ppa.asc

    # see https://docs.ansible.com/ansible/latest/collections/ansible/builtin/deb822_repository_module.html
    - name: Add rvm apt repository
      ansible.builtin.deb822_repository:
        name: rvm
        uris: '{{ redmine_rvm_apt_url }}'
        types: deb
        suites: '{{ redmine_rvm_apt_suites }}'
        components: '{{ redmine_rvm_apt_components }}'
        signed_by: '{{ redmine_rvm_apt_signed_by }}'
        state: present
      register: rvm_repo

    - name: Update apt cache
      apt:
        update_cache: true
      when: rvm_repo.changed
      tags:
        - skip_ansible_lint

- name: Do not use rvm apt repository for Ubuntu
  when: ansible_facts.distribution == 'Ubuntu' and not redmine_rvm_apt
  ansible.builtin.deb822_repository:
    name: rvm
    state: absent

- name: Include MySQL role
  ansible.builtin.include_role:
    name: alphanodes.setup.mysql
  when: redmine_with_mysql

- name: PostgreSQL
  when: redmine_with_postgresql
  block:
    # client role is not triggered by meta dep on alphanodes.setup.postgresql
    - name: Include PostgreSQL client role
      ansible.builtin.include_role:
        name: alphanodes.setup.postgresql_client

    - name: Include PostgreSQL role
      ansible.builtin.include_role:
        name: alphanodes.setup.postgresql

- name: Include ImageMagick policy tasks
  ansible.builtin.include_tasks: imagemagick.yml

# Ubuntu 26.04 ships an enforce-mode AppArmor profile for /usr/bin/gs that
# denies reads outside HOME/mnt/media/printers. ImageMagick then fails to
# render PDF thumbnails ("Last OS error: Permission denied"). Drop a local
# override so ghostscript can read Redmine attachments. The block is skipped
# automatically on hosts without the gs profile (no AppArmor or older distro).
# Per-instance overrides are deployed by redmine_instance.yml into
# /etc/apparmor.d/local/gs.d/ and pulled in by the include below.
- name: Stat gs AppArmor profile
  ansible.builtin.stat:
    path: /etc/apparmor.d/gs
  register: gs_apparmor_profile

- name: Configure gs AppArmor local override
  when: gs_apparmor_profile.stat.exists
  block:
    - name: Ensure gs AppArmor drop-in directory exists
      ansible.builtin.file:
        path: /etc/apparmor.d/local/gs.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy gs AppArmor local override include
      ansible.builtin.template:
        src: etc/apparmor.d/local/gs.j2
        dest: /etc/apparmor.d/local/gs
        owner: root
        group: root
        mode: '0644'
      notify: Reload gs AppArmor profile

- name: Install nginx maps for redmine
  tags:
    - nginx
  ansible.builtin.template:
    src: etc/nginx/redmine_maps.conf
    dest: /etc/nginx/conf.d/
    mode: '0644'
  notify: Restart nginx

- name: Remove obsolete configuration files
  tags:
    - nginx
  ansible.builtin.file:
    path: /etc/nginx/conf.d/map_api_redmine.conf
    state: absent
  notify: Restart nginx
