---

- name: Get Gem.user_dir - {{ redmine_instance_name }}
  ansible.builtin.command: "{{ ruby_bin_dir }}/ruby -e 'print Gem.user_dir'"
  become: true
  become_user: '{{ redmine_user }}'
  register: gem_info
  changed_when: false

- name: Set redmine_ruby_gem_home - {{ redmine_instance_name }}
  ansible.builtin.set_fact:
    redmine_ruby_gem_home: '{{ gem_info.stdout }}'

- name: Set redmine_ruby_opt - {{ redmine_instance_name }}
  ansible.builtin.set_fact:
    redmine_ruby_opt: "{{ redmine_instance.ruby_opt | default(redmine_systemd_ruby_opt) | default('-W:no-deprecated -W:no-experimental', true) }}"

- name: Ensure run directory exists after reboot - {{ redmine_instance_name }}
  ansible.builtin.include_role:
    name: alphanodes.setup.systemd_timer
  vars:
    timers:
      "{{ puma_service_name }}-directory":
        exec_start: /usr/bin/install -g {{ redmine_instance_name }} -o {{ redmine_instance_name }} -d {{ redmine_run_base_path }}/{{ redmine_instance_name }}
        on_boot_sec: 5s
        before_service: '{{ puma_service_name }}.service'

- name: Install puma systemd service - {{ redmine_instance_name }}
  ansible.builtin.template:
    src: etc/systemd/system/puma.service.j2
    dest: "/etc/systemd/system/{{ puma_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon

- name: Flush all handlers at this point
  ansible.builtin.meta: flush_handlers

- name: Ensure puma services start after reboot - {{ redmine_instance_name }}
  ansible.builtin.systemd_service:
    name: '{{ puma_service_name }}'
    enabled: true

- name: Set active_puma_phased_restart_hour - {{ redmine_instance_name }}
  ansible.builtin.set_fact:
    active_puma_phased_restart_hour: "{{ redmine_instance.puma_phased_restart_hour | default(redmine_puma_phased_restart_hour) }}"

- name: Configure daily Puma phased restart timer - {{ redmine_instance_name }}
  ansible.builtin.include_role:
    name: alphanodes.setup.systemd_timer
  vars:
    timers:
      "{{ puma_service_name }}-phased-restart":
        exec_start: /bin/sh -c 'kill -USR1 $(cat {{ redmine_run_base_path }}/{{ redmine_instance_name }}/redmine.pid)'
        on_calendar: '*-*-* {{ active_puma_phased_restart_hour }}:00:00'
        persistent: true
        syslog_identifier: '{{ puma_service_name }}-phased-restart'
        state: "{{ 'present' if active_puma_phased_restart_hour | string | length > 0 else 'absent' }}"
