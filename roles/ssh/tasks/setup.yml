---

- name: Be sure ssh is installed
  ansible.builtin.apt:
    name: '{{ ssh_server_packages }}'
    state: present

- name: Remove ssh service systemd-socket file
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d/00-socket.conf
    state: absent

- name: Disable systemd-socket activation
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: stopped
    enabled: false

# This is not created by dist, because socket is used
- name: Ensure privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Start ssh service
  ansible.builtin.systemd_service:
    name: ssh.service
    state: started
    enabled: true

- name: Check Match rules that allow passwords
  ansible.builtin.assert:
    that:
      - ssh_server_authentication_methods != 'publickey'
        or item.rules is not search('(?im)^\\s*(PasswordAuthentication|KbdInteractiveAuthentication|ChallengeResponseAuthentication)[\\s=]+yes')
        or item.rules is search('(?im)^\\s*AuthenticationMethods[\\s=]')
    fail_msg: >-
      Match {{ item.user | default(item.group) }} allows passwords, but
      AuthenticationMethods publickey still refuses them. Add
      "AuthenticationMethods any" to its rules.
    quiet: true
  loop: "{{ (ssh_server_match_user or []) + (ssh_server_match_group or []) }}"
  loop_control:
    label: "{{ item.user | default(item.group) }}"

# sshd refuses every key if a line of RevokedKeys cannot be parsed, so only
# plain public keys (no authorized_keys options) are allowed
- name: Check revoked ssh keys
  ansible.builtin.assert:
    that:
      - item is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\\.com|sk-ecdsa-sha2-nistp256@openssh\\.com) [A-Za-z0-9+/]+={0,3}( .*)?$')
    fail_msg: "Not a plain public key in ssh_server_revoked_keys: {{ item }}"
    quiet: true
  loop: "{{ ssh_server_revoked_keys }}"
  loop_control:
    label: "{{ item | truncate(40) }}"

- name: Update revoked ssh keys
  ansible.builtin.template:
    src: revoked_keys.j2
    dest: /etc/ssh/revoked_keys
    owner: root
    group: root
    mode: '0644'

- name: Update ssh server configuration
  ansible.builtin.template:
    src: sshd_dropin.conf.j2
    dest: '{{ ssh_server_config_file }}'
    owner: root
    group: root
    mode: '0600'
    validate: sshd -T -f %s -C user=root,host=localhost,addr=127.0.0.1,lport={{ ssh_server_port }}
  notify: Restart ssh

# sshd_config of a former version of this role is replaced by the file of
# the distribution, which includes sshd_config.d at the top. The drop-in is
# written before, so a run that fails in between keeps a complete configuration.
# Ansible marker plus "Protocol 2", which only the former template has (a
# marker alone also matches blocks of blockinfile)
- name: Check for sshd_config of a former role version
  ansible.builtin.command: >-
    awk 'tolower($0) ~ /ansible managed|managed by ansible/ { marker = 1 }
    $0 == "Protocol 2" { protocol = 1 }
    END { exit !(marker && protocol) }' /etc/ssh/sshd_config
  register: ssh_legacy_sshd_config
  changed_when: false
  failed_when: ssh_legacy_sshd_config.rc > 1
  check_mode: false

- name: Restore sshd_config of the distribution
  ansible.builtin.copy:
    src: /usr/share/openssh/sshd_config
    dest: /etc/ssh/sshd_config
    remote_src: true
    owner: root
    group: root
    mode: '0644'
    # the Include path is absolute, so this checks it with all drop-ins
    validate: sshd -t -f %s
  when: ssh_legacy_sshd_config.rc == 0
  notify: Restart ssh

# Others (e.g. Google OS Login) add lines above it, so an existing Include
# stays where it is
- name: Include sshd_config.d in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf\s*$'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: sshd -t -f %s
  notify: Restart ssh

# Port adds a listener for each line, cloud-init of new hosts sets it there
- name: Remove Port from sshd_config, the drop-in sets it
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*Port\s'
    state: absent
    validate: sshd -t -f %s
  notify: Restart ssh

# The drop-in is validated on its own, a restart with an invalid combination
# with sshd_config or other drop-ins would leave sshd stopped
- name: Validate complete ssh server configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Check for small DH groups
  ansible.builtin.command: awk '!/^#/ && $5 < {{ ssh_server_moduli_minimum }}' /etc/ssh/moduli
  register: ssh_small_moduli
  changed_when: false
  check_mode: false
  when: ssh_server_moduli_minimum | int > 0

- name: Remove small DH groups
  ansible.builtin.shell: >-
    awk '/^#/ || $5 >= {{ ssh_server_moduli_minimum }}' /etc/ssh/moduli > /etc/ssh/moduli.new
    && test -s /etc/ssh/moduli.new
    && mv /etc/ssh/moduli.new /etc/ssh/moduli
  changed_when: true
  when:
    - ssh_server_moduli_minimum | int > 0
    - ssh_small_moduli.stdout | length > 0
  notify: Restart ssh

- name: Remove debian dist files, if available
  ansible.builtin.file:
    path: /etc/ssh/{{ item }}
    state: absent
  when: ssh_with_config_file_cleanup | bool
  loop:
    - sshd_config.ucf-dist
    - ssh_config.dpkg-dist

- name: Update ssh client configuration
  ansible.builtin.template:
    src: ssh_config.j2
    dest: /etc/ssh/ssh_config
    mode: '0644'
