---
# Certificate creation via the DNS-01 challenge. Unlike webroot this needs no
# running webserver and is the only way to get a wildcard certificate.

- name: Determine certificate name
  ansible.builtin.set_fact:
    cert_item_name: "{{ cert_item.name | default(cert_item.domains | first | replace('*.', '')) }}"

- name: Check if certificate already exists
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ cert_item_name }}/cert.pem
  register: letsencrypt_cert

- name: Check if domains have changed
  when: letsencrypt_cert.stat.exists
  block:
    - name: Register certificate domains
      # certbot renamed the "Domains" line to "Identifiers" in 4.0 (it can
      # hold IP addresses now). Debian still ships an older certbot, the venv
      # install pulls the current one - so both spellings have to match.
      ansible.builtin.shell: |
        set -o pipefail
        {{ certbot_script }} certificates --cert-name {{ cert_item_name }} | grep -E 'Domains|Identifiers' | cut -d':' -f2
      args:
        executable: /bin/bash
      changed_when: false
      register: letsencrypt_cert_domains_dirty

    - name: Cleanup domain list
      ansible.builtin.set_fact:
        letsencrypt_cert_domains: >-
          {{ letsencrypt_cert_domains_dirty.stdout | trim | split(' ') |
             map('trim') | select('!=', '') | list | sort }}

    - name: Determine if domains have changed
      ansible.builtin.set_fact:
        letsencrypt_cert_domains_changed: >-
          {{ letsencrypt_cert_domains != (cert_item.domains |
             map('trim') | select('!=', '') | unique | list | sort) }}

- name: Generate new certificate if one doesn't exist
  ansible.builtin.command: "{{ certbot_create_command }}"
  register: certbot_create_result
  changed_when: certbot_create_result.rc == 0
  when: not letsencrypt_cert.stat.exists or letsencrypt_cert_domains_changed | default(false)
