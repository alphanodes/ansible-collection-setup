---
# Use Debian's built-in certbot.timer instead of cron.
# The timer runs twice daily with RandomizedDelaySec=43200 (12h jitter).

# Checking for the crontab binary alone is not enough: Ubuntu ships
# /usr/bin/crontab without the cron package, and the cron module then dies with
# "Unable to read crontab". Hosts that only use systemd timers - which is our
# default - look exactly like that. So look for the actual entry instead, and
# touch the crontab only when there is something to remove.
- name: Check for a legacy certbot cron job
  ansible.builtin.shell: |
    set -o pipefail
    command -v crontab > /dev/null || exit 1
    crontab -l -u root 2> /dev/null | grep -q 'Certbot automatic renewal.'
  args:
    executable: /bin/bash
  register: crontab_check
  changed_when: false
  failed_when: false
  when: certbot_remove_cron_job

- name: Remove legacy certbot cron job if exists
  ansible.builtin.cron:
    name: Certbot automatic renewal.
    user: root
    state: absent
  when:
    - certbot_remove_cron_job
    - crontab_check.rc | default(1) == 0

- name: Ensure renewal-hooks deploy directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: certbot_deploy_hook | length > 0

- name: Create global deploy hook
  ansible.builtin.template:
    src: deploy-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload_services
    owner: root
    group: root
    mode: "0755"
  when: certbot_deploy_hook | length > 0

- name: Remove deploy hook if not configured
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy/reload_services
    state: absent
  when: certbot_deploy_hook | length == 0

- name: Enable and start certbot.timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not certbot_with_venv | default(false)

# A venv install has no Debian certbot.timer, so the role provides its own.
# Same cadence as Debian's unit: twice a day with a large random delay, so the
# renewal does not hit Let's Encrypt at a predictable minute.
- name: Manage certbot renewal timer for venv installations
  ansible.builtin.include_role:
    name: alphanodes.setup.systemd_timer
  vars:
    timers:
      certbot-venv-renew:
        state: "{{ 'present' if certbot_with_venv | default(false) else 'absent' }}"
        timer_comment: (Let's Encrypt renewal from venv)
        exec_start: "{{ certbot_venv_path }}/bin/certbot -q renew"
        on_calendar: '*-*-* 00,12:00:00'
        randomized_delay_sec: 12h
        persistent: true
