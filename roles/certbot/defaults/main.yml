---
# Certbot auto-renew using systemd timer (Debian's built-in certbot.timer).
# The timer runs twice daily with a random delay up to 12 hours.
certbot_auto_renew: true

# Remove legacy cron job if it exists (from previous installations).
certbot_remove_cron_job: true

# Global deploy hook - runs after successful certificate renewal.
# Example: "systemctl reload nginx"
certbot_deploy_hook: ""

# Test mode uses Let's Encrypt staging servers (no rate limits).
certbot_testmode: false

# Enable HSTS header.
certbot_hsts: false

# Parameters used when creating new Certbot certs.
certbot_create_if_missing: false
certbot_create_method: webroot
certbot_create_extra_args: ""
certbot_admin_email: email@example.com

# Expand existing certificates with new domains.
certbot_expand: false

# Default webroot for acme-challenge, can be overwritten per cert.
certbot_webroot: /var/www/letsencrypt

# DNS-01 challenge (certbot_create_method: dns).
# Required for wildcard certificates - Let's Encrypt does not accept HTTP-01
# for those.
#
# Plugin name without the "dns-" prefix, e.g. hetzner, cloudflare, rfc2136.
certbot_dns_plugin: ""
# Plugin credentials, written to certbot_dns_credentials_file. Keys are
# prefixed automatically, so {'api_token': 'abc'} with plugin "hetzner"
# becomes "dns_hetzner_api_token = abc".
certbot_dns_credentials: {}
certbot_dns_credentials_file: /etc/letsencrypt/dns-{{ certbot_dns_plugin }}.ini
# Seconds to wait for the TXT record to propagate. 0 keeps the plugin default.
certbot_dns_propagation_seconds: 0
# Debian ships plugins for cloudflare, desec, google, infomaniak, rfc2136 and
# route53. List the package here when the plugin is available via apt.
certbot_dns_apt_packages: []
# For plugins that are not packaged for Debian (e.g. certbot-dns-hetzner).
# Setting this installs certbot plus the plugin into certbot_venv_path,
# because Debian 13 marks the system Python as externally managed (PEP 668)
# and pip would otherwise need --break-system-packages.
certbot_dns_pip_packages: []
certbot_venv_path: /opt/certbot/venv
# Upgrade certbot and the plugin in the venv on every run. Off by default so
# a rollout does not silently pull a new certbot version.
certbot_venv_upgrade: false

# List of certificates to create.
# Example:
# certbot_certs:
#   - name: example.com
#     email: admin@example.com
#     webroot: "/var/www/html/"
#     domains:
#       - example.com
#       - www.example.com
#   - domains:
#       - example2.com
certbot_certs: []

# Services to stop/start for standalone mode.
# Only used when certbot_create_method == 'standalone'.
# Example: [nginx] if nginx is running but standalone mode is needed.
certbot_create_standalone_stop_services: []

# The certbot command constructed from variables.
# Can be overwritten for special use cases.
# Authenticator part of the certbot call. Kept separate because DNS-01 needs
# the plugin name and its credentials file instead of a plain --<method> flag.
certbot_authenticator_args: >-
  {% if certbot_create_method == 'dns' %}
  {# "--authenticator dns-<plugin>" instead of "--dns-<plugin>": plugins that
     do not register their own shortcut flag make the short form an ambiguous
     argparse prefix of --dns-<plugin>-credentials. #}
  --authenticator dns-{{ certbot_dns_plugin }}
  --dns-{{ certbot_dns_plugin }}-credentials {{ certbot_dns_credentials_file }}
  {{ '--dns-' ~ certbot_dns_plugin ~ '-propagation-seconds ' ~ certbot_dns_propagation_seconds
     if certbot_dns_propagation_seconds | int > 0 else '' }}
  {% elif certbot_create_method == 'webroot' %}
  --webroot --webroot-path {{ cert_item.webroot | default(certbot_webroot) }}
  {% else %}
  --{{ certbot_create_method }}
  {% endif %}

certbot_create_command: >-
  {{ certbot_script }} certonly {{ certbot_authenticator_args }}
  {{ '--hsts' if certbot_hsts else '' }}
  {{ '--test-cert' if certbot_testmode else '' }}
  --noninteractive --agree-tos
  --email {{ cert_item.email | default(certbot_admin_email) }}
  {{ certbot_create_extra_args }}
  --cert-name {{ cert_item_name }}
  -d {{ cert_item.domains | join(',') }}
  {{ '--expand' if certbot_expand else '' }}
  {{ '--pre-hook /etc/letsencrypt/renewal-hooks/pre/stop_services'
    if certbot_create_standalone_stop_services and certbot_create_method == 'standalone'
  else '' }}
  {{ '--post-hook /etc/letsencrypt/renewal-hooks/post/start_services'
    if certbot_create_standalone_stop_services and certbot_create_method == 'standalone'
  else '' }}
  {{ "--deploy-hook '" ~ cert_item.deploy_hook ~ "'"
    if cert_item.deploy_hook | default('')
  else '' }}

# nginx_mono integration: configure webroot location in nginx.
certbot_nginx_integration: true
