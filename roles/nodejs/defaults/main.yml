---
# Set the version of Node.js to install ("20.x", "22.x", "24.x", "26.x").
# Version numbers from NodeSource: https://github.com/nodesource/distributions
# Only used with the NodeSource repository, see nodejs_use_distribution_packages
nodejs_version: '20.x'

# Debian 13 ships a maintained Node.js 20 and installs it by default, older
# releases and Ubuntu use the NodeSource repository. Set to false to install
# nodejs_version from NodeSource on Debian 13 as well, e.g. for applications
# that need a newer release. Switching in either direction replaces the
# installed packages, NodeSource nodejs conflicts with the distribution npm.
nodejs_use_distribution_packages: "{{ ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] | int >= 13 }}"

# Debian 13 splits nodejs and npm into separate packages, NodeSource bundles npm
nodejs_packages: "{{ ['nodejs', 'npm'] if nodejs_use_distribution_packages else ['nodejs'] }}"

nodejs_apt_url: https://deb.nodesource.com/node_{{ nodejs_version }}
nodejs_apt_key_host: deb.nodesource.com
nodejs_apt_signed_by: https://{{ nodejs_apt_key_host }}/gpgkey/nodesource-repo.gpg.key
nodejs_apt_suites: nodistro
nodejs_apt_components: main
nodejs_apt_source_update: "{{ not nodejs_use_distribution_packages }}"

# The user for whom the npm packages will be installed.
# nodejs_install_npm_user: username

# The directory for global installations.
npm_config_prefix: /usr/local/lib/npm

# Set to true to suppress the UID/GID switching when running package scripts. If
# set explicitly to false, then installing as a non-root user will fail.
npm_config_unsafe_perm: "false"

# Define a list of global packages to be installed with NPM.
nodejs_npm_global_packages: []
#  # Install a specific version of a package.
#  - name: jslint
#    version: 0.9.3
#  # Install the latest stable release of a package.
#  - name: node-sass
#  # This shorthand syntax also works (same as previous example).
#  - node-sass

# The path of a package.json file used to install packages globally.
nodejs_package_json_path: ""

# Whether or not /etc/profile.d/npm.sh (globa) must be generated.
# Set to false if you need to handle this manually with a per-user install.
nodejs_generate_etc_profile: true

# remove nodejs
nodejs_remove: false
