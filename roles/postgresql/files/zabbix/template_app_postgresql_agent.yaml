---
zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 748ad4d098d447d492bb935c907f652f
      name: Templates/Databases
  templates:
    - uuid: 9f3c6494ce954586a7151f635d4f022a
      template: 'PostgreSQL Custom'
      name: 'PostgreSQL Custom'
      description: |
        Custom monitoring for PostgreSQL installations, with custom queries
        of the agent 2 PostgreSQL plugin (pgsql.custom.query) for states the
        plugin keys do not report: errors in the configuration files,
        settings waiting for a restart, replication slots holding WAL,
        collation version mismatches after glibc upgrades, and per database
        invalid indexes, extensions older than their installed package and
        failed TimescaleDB jobs.

        Linked by the wrapper "PostgreSQL" together with
        "PostgreSQL by Zabbix agent 2", link the wrapper to hosts. Uses the
        connection macros of the vendor template.

        This template requires the alphanodes.setup.postgresql role with
        zabbix_monitoring: it installs the queries server_health,
        databases and database_health, enables custom queries in the plugin
        and grants zbx_monitor read access to pg_file_settings.
      vendor:
        name: AlphaNodes
        version: 7.4-__DATE__
      groups:
        - name: Templates/Databases
      items:
        - uuid: d64254a9e7c74ebc9bad529818458733
          name: 'PostgreSQL: Get health state'
          key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}",server_health]'
          delay: 15m
          # Only feeds the dependent items, which keep the values
          history: '0'
          value_type: TEXT
          description: 'One row of server state the plugin keys do not report, from the custom query server_health.'
          tags:
            - tag: component
              value: raw
        - uuid: a32417b465ff4d8cbd40faf6130921b1
          name: 'PostgreSQL: Autovacuum max workers'
          type: DEPENDENT
          key: pg_health.autovacuum_max_workers
          history: 7d
          trends: 180d
          value_type: UNSIGNED
          description: 'Setting autovacuum_max_workers, used by the trigger on busy autovacuum workers of the wrapper "PostgreSQL".'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].autovacuum_max_workers'
          master_item:
            key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}",server_health]'
          tags:
            - tag: component
              value: postgresql
        - uuid: 7f4660849f824d26b26bb0dc3b74f9f0
          name: 'PostgreSQL: Collation version mismatch count'
          type: DEPENDENT
          key: pg_collation_mismatch
          history: 7d
          trends: 180d
          value_type: UNSIGNED
          description: 'Number of databases with a collation version mismatch. Non-zero means glibc was upgraded without running ALTER DATABASE ... REFRESH COLLATION VERSION.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].collation_mismatch'
          master_item:
            key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}",server_health]'
          tags:
            - tag: component
              value: postgresql
            - tag: log-type
              value: warning
          triggers:
            - uuid: c9c61309ffcd4e14b3918cffb6b17320
              expression: 'last(/PostgreSQL Custom/pg_collation_mismatch)>0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/PostgreSQL Custom/pg_collation_mismatch,2h)=0'
              name: 'PostgreSQL: Collation version mismatch detected'
              priority: WARNING
              description: 'PostgreSQL collation version mismatch detected after glibc upgrade. Fix: sudo -u postgres psql -c "ALTER DATABASE <dbname> REFRESH COLLATION VERSION;" for each affected database. Check with: SELECT datname, datcollversion, pg_database_collation_actual_version(oid) FROM pg_database;'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: maintenance
        - uuid: 2c4cd2ff209741cc8d7b34370f6a33a0
          name: 'PostgreSQL: Configuration file errors'
          type: DEPENDENT
          key: pg_health.config_errors
          history: 7d
          trends: 180d
          value_type: UNSIGNED
          description: 'Lines of postgresql.conf, conf.d and postgresql.auto.conf that PostgreSQL rejects (pg_file_settings.error), the server keeps the previous value. Settings waiting for a restart are counted by pending_restart only.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].config_errors'
          master_item:
            key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}",server_health]'
          tags:
            - tag: component
              value: postgresql
          triggers:
            - uuid: af935440f3064e3b9dc38834d0f7013c
              expression: 'last(/PostgreSQL Custom/pg_health.config_errors)>0'
              name: 'PostgreSQL: {ITEM.LASTVALUE} errors in the configuration files'
              priority: WARNING
              description: |
                PostgreSQL rejects settings of its configuration files and keeps
                running with the previous values, often a wrong value rendered by
                the role. List them with:
                SELECT sourcefile, sourceline, name, error FROM pg_file_settings WHERE error IS NOT NULL;
              tags:
                - tag: scope
                  value: notice
        - uuid: 3c33eb5f76e34e4bb15fd1cb0555e907
          name: 'PostgreSQL: Settings pending a restart'
          type: DEPENDENT
          key: pg_health.pending_restart
          history: 7d
          trends: 180d
          value_type: UNSIGNED
          description: 'Settings changed in the configuration files that only take effect after a restart (pg_settings.pending_restart).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].pending_restart'
          master_item:
            key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}",server_health]'
          tags:
            - tag: component
              value: postgresql
          triggers:
            # On a dependent item, the master item keeps no history
            - uuid: 5663e14de3854c11813531a5bce20b1f
              expression: 'nodata(/PostgreSQL Custom/pg_health.pending_restart,1h)=1'
              name: 'PostgreSQL: No health check data for 1h'
              priority: INFO
              description: 'The custom query server_health returns no data, e.g. because custom queries are not enabled in the plugin or zbx_monitor lacks the grants on pg_file_settings. Check the item error of "PostgreSQL: Get health state" on the host.'
              tags:
                - tag: scope
                  value: availability
            - uuid: f392de34e6d64689b4972588babda76f
              expression: 'min(/PostgreSQL Custom/pg_health.pending_restart,30m)>0'
              name: 'PostgreSQL: {ITEM.LASTVALUE} settings wait for a restart'
              priority: WARNING
              description: |
                Changed settings are not active yet, they need a restart of
                PostgreSQL. The role restarts on every configuration change, so
                a restart failed or was skipped, or the setting was changed by
                hand (ALTER SYSTEM). List them with:
                SELECT name, setting FROM pg_settings WHERE pending_restart;
              tags:
                - tag: scope
                  value: notice
        - uuid: ad8502d270654e3b93260218f3019e74
          name: 'PostgreSQL: Inactive replication slots'
          type: DEPENDENT
          key: pg_health.inactive_slots
          history: 7d
          trends: 180d
          value_type: UNSIGNED
          description: 'Replication slots without a connected client. They keep WAL until the client returns or the slot is dropped.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].inactive_slots'
          master_item:
            key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}",server_health]'
          tags:
            - tag: component
              value: replication
          triggers:
            - uuid: 3b9f15f4a05146b7a98ddd060afa25de
              expression: 'min(/PostgreSQL Custom/pg_health.inactive_slots,1h)>0'
              name: 'PostgreSQL: {ITEM.LASTVALUE} inactive replication slots'
              priority: WARNING
              description: |
                A replication slot has no connected client for 1h, e.g. of a
                removed standby or barman streaming. It keeps all WAL from its
                position on, until the disk is full. Check with:
                SELECT slot_name, slot_type, active, restart_lsn FROM pg_replication_slots;
                and drop unused slots with SELECT pg_drop_replication_slot('<name>');
              tags:
                - tag: scope
                  value: capacity
        - uuid: b620a19e8d6a4a51a67190c59d11bc8b
          name: 'PostgreSQL: WAL retained by replication slots'
          type: DEPENDENT
          key: pg_health.slot_retained_bytes
          history: 7d
          trends: 180d
          value_type: UNSIGNED
          units: B
          description: 'WAL between the current position and the oldest restart_lsn of all replication slots.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].slot_retained_bytes'
          master_item:
            key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}",server_health]'
          tags:
            - tag: component
              value: replication
          triggers:
            - uuid: 8287c8012ae64833958d066ce8d29831
              expression: 'min(/PostgreSQL Custom/pg_health.slot_retained_bytes,1h)>{$PG.SLOT_RETAINED.MAX.WARN}'
              name: 'PostgreSQL: Replication slots retain {ITEM.LASTVALUE} of WAL'
              priority: WARNING
              description: |
                Replication slots keep more WAL than {$PG.SLOT_RETAINED.MAX.WARN} bytes
                for 1h, the client of a slot falls behind or is gone. Check with:
                SELECT slot_name, active, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)) FROM pg_replication_slots;
              tags:
                - tag: scope
                  value: capacity
      discovery_rules:
        - uuid: 0aaf0b312b664e9a9bb403e35bc93726
          name: 'Database health discovery'
          key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{$PG.DATABASE}",databases]'
          delay: 1h
          description: 'Databases that allow connections, without the templates (custom query databases).'
          item_prototypes:
            - uuid: ffd1311f01d04083a416b02b69e24087
              name: 'DB [{#DBNAME}]: Get health state'
              key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{#DBNAME}",database_health]'
              delay: 15m
              # Only feeds the dependent items, which keep the values
              history: '0'
              value_type: TEXT
              description: 'One row of database state, from the custom query database_health.'
              tags:
                - tag: component
                  value: raw
                - tag: database
                  value: '{#DBNAME}'
            - uuid: 42234db09f8445bcb7b2c69129c12f9a
              name: 'DB [{#DBNAME}]: Invalid indexes'
              type: DEPENDENT
              key: 'pg_db.invalid_indexes["{#DBNAME}"]'
              history: 7d
              trends: 180d
              value_type: UNSIGNED
              description: 'Indexes marked invalid (pg_index.indisvalid), left behind by a failed CREATE INDEX CONCURRENTLY or REINDEX CONCURRENTLY.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[0].invalid_indexes'
              master_item:
                key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{#DBNAME}",database_health]'
              tags:
                - tag: component
                  value: postgresql
                - tag: database
                  value: '{#DBNAME}'
              trigger_prototypes:
                - uuid: 5fca6a4c1e7746e382271e1bfd6029b7
                  expression: 'min(/PostgreSQL Custom/pg_db.invalid_indexes["{#DBNAME}"],1h)>0'
                  name: 'PostgreSQL: DB [{#DBNAME}]: {ITEM.LASTVALUE} invalid indexes'
                  priority: WARNING
                  description: |
                    Invalid indexes are not used by queries, but still updated on
                    every write, and a unique index does not enforce uniqueness. List
                    them in the database with:
                    SELECT indexrelid::regclass FROM pg_index WHERE NOT indisvalid;
                    Fix with REINDEX INDEX CONCURRENTLY <name>; or drop and create the index again.
                  tags:
                    - tag: scope
                      value: notice
            - uuid: bb2afe8c5b3249aab944e23ad79cea8b
              name: 'DB [{#DBNAME}]: Outdated extensions'
              type: DEPENDENT
              key: 'pg_db.outdated_extensions["{#DBNAME}"]'
              history: 7d
              trends: 180d
              value_type: UNSIGNED
              description: 'Installed extensions whose version is older than the one of the installed package. Package updates do not run ALTER EXTENSION ... UPDATE.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[0].outdated_extensions'
              master_item:
                key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{#DBNAME}",database_health]'
              tags:
                - tag: component
                  value: postgresql
                - tag: database
                  value: '{#DBNAME}'
              trigger_prototypes:
                # On a dependent item, the master item keeps no history
                - uuid: 9d06a0e7771147d6ba66c12a4990253b
                  expression: 'nodata(/PostgreSQL Custom/pg_db.outdated_extensions["{#DBNAME}"],1h)=1'
                  name: 'PostgreSQL: DB [{#DBNAME}]: No health check data for 1h'
                  priority: INFO
                  description: 'The custom query database_health returns no data for this database, e.g. because zbx_monitor may not connect to it. Check the item error of "DB [{#DBNAME}]: Get health state" on the host.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: bfcde640b02d40c4a2833b107c48b1e3
                  expression: 'last(/PostgreSQL Custom/pg_db.outdated_extensions["{#DBNAME}"])>0'
                  name: 'PostgreSQL: DB [{#DBNAME}]: {ITEM.LASTVALUE} extensions older than the installed package'
                  priority: WARNING
                  description: |
                    The package of an extension was updated, but the extension in the
                    database still runs the old version (e.g. TimescaleDB 2.23.1 with
                    package 2.32.1 on PostgreSQL 18.7 broke all background jobs).
                    List them with:
                    SELECT name, installed_version, default_version FROM pg_available_extensions WHERE installed_version <> default_version;
                    Fix with ALTER EXTENSION <name> UPDATE; in the database. TimescaleDB
                    needs psql -X, the command as first one of the session and the
                    clients (zabbix-server) stopped.
                  tags:
                    - tag: scope
                      value: maintenance
            - uuid: 45479d56e72d45dfa97ced52c3798524
              name: 'DB [{#DBNAME}]: Failed TimescaleDB jobs'
              type: DEPENDENT
              key: 'pg_db.timescaledb_failed_jobs["{#DBNAME}"]'
              history: 7d
              trends: 180d
              value_type: UNSIGNED
              description: 'TimescaleDB background jobs (compression, retention, continuous aggregates) whose last run failed. Always 0 without TimescaleDB.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[0].timescaledb_failed_jobs'
              master_item:
                key: 'pgsql.custom.query["{$PG.CONNSTRING.AGENT2}","{$PG.USER}","{$PG.PASSWORD}","{#DBNAME}",database_health]'
              tags:
                - tag: component
                  value: timescaledb
                - tag: database
                  value: '{#DBNAME}'
              trigger_prototypes:
                - uuid: 69a14190eb72458fbbb7084412f7b6b7
                  expression: 'last(/PostgreSQL Custom/pg_db.timescaledb_failed_jobs["{#DBNAME}"])>0'
                  name: 'PostgreSQL: DB [{#DBNAME}]: {ITEM.LASTVALUE} TimescaleDB jobs failed'
                  priority: WARNING
                  description: |
                    The last run of TimescaleDB background jobs failed, e.g. after a
                    package update without ALTER EXTENSION timescaledb UPDATE or with
                    too few background workers. List them with:
                    SELECT job_id, hypertable_name, last_run_status, total_failures FROM timescaledb_information.job_stats WHERE last_run_status = 'Failed';
                    and read the error in the journal of PostgreSQL.
                  tags:
                    - tag: scope
                      value: notice
          lld_macro_paths:
            - lld_macro: '{#DBNAME}'
              path: $.datname
      tags:
        - tag: class
          value: software
        - tag: subclass
          value: database
        - tag: target
          value: postgresql
      macros:
        - macro: '{$PG.SLOT_RETAINED.MAX.WARN}'
          value: '4294967296'
          description: 'Bytes of WAL that replication slots may keep for 1h, twice the max_wal_size of the role (2GB)'
