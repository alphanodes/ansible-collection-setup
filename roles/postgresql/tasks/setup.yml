---
- name: Set fact postgresql_barman_archive_command
  ansible.builtin.set_fact:
    postgresql_barman_archive_command: 'rsync -a -e "ssh -p {{ postgresql_barman_port }}" %p {{ postgresql_barman_user }}@{{ postgresql_barman_host }}:{{ postgresql_barman_dir }}/{{ postgresql_barman_name | mandatory }}/incoming/%f'
  when:
    - postgresql_with_barman
    - postgresql_barman_archive_command is undefined

- name: Be sure PostgreSQL are installed
  ansible.builtin.apt:
    name: '{{ postgresql_packages }}'
    state: present

- name: Include postgis tasks
  ansible.builtin.include_tasks: postgis.yml
  when: postgresql_with_postgis

- name: Include TimescaleDB tasks
  ansible.builtin.include_tasks: timescaledb.yml
  when: postgresql_with_timescaledb

- name: Include pgvector tasks
  ansible.builtin.include_tasks: pgvector.yml
  when: postgresql_with_pgvector

- name: Ensure PostgreSQL is started and enabled to start at boot.
  ansible.builtin.systemd_service:
    name: postgresql
    state: started
    enabled: true

- name: Update PostgreSQL configuration (version 17 and below)
  ansible.builtin.template:
    src: postgresql.j2
    dest: '/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf'
    mode: '0644'
    owner: '{{ postgresql_user }}'
    group: '{{ postgresql_group }}'
  notify: Restart postgresql
  when: postgresql_version | int < 18

- name: Update PostgreSQL configuration (version 18+)
  ansible.builtin.template:
    src: postgresql18.j2
    dest: '/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf'
    mode: '0644'
    owner: '{{ postgresql_user }}'
    group: '{{ postgresql_group }}'
  notify: Restart postgresql
  when: postgresql_version | int >= 18

- name: Update PostgreSQL hba configuration
  ansible.builtin.template:
    src: pg_hba.j2
    dest: '/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf'
    owner: '{{ postgresql_user }}'
    group: '{{ postgresql_group }}'
    mode: '0640'
  notify: Restart postgresql

- name: Check if PostgreSQL database is initialized.
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: pgdata_dir_version

- name: Ensure PostgreSQL database is initialized.
  ansible.builtin.command: "{{ postgresql_bin_path }}/initdb -D {{ postgresql_data_dir }}"
  when: not pgdata_dir_version.stat.exists
  become: true
  become_user: "{{ postgresql_user }}"
  # See: https://github.com/ansible/ansible/issues/16048#issuecomment-229012509
  vars:
    ansible_ssh_pipelining: true

- name: Include locales tasks
  ansible.builtin.include_tasks: locales.yml

# Apply port, preload library and locale changes before connecting to the database.
- name: Apply pending PostgreSQL configuration changes
  ansible.builtin.meta: flush_handlers

# A dry run does not restart the server after rendering a changed port.
# postmaster.pid belongs to this data directory and records the running port on line 4.
- name: Check for a running PostgreSQL cluster in check mode
  ansible.builtin.stat:
    path: '{{ postgresql_data_dir }}/postmaster.pid'
  register: postgresql_pid_stat
  when: ansible_check_mode

- name: Read the running PostgreSQL cluster in check mode
  ansible.builtin.slurp:
    src: '{{ postgresql_data_dir }}/postmaster.pid'
  register: postgresql_pid_file
  when:
    - ansible_check_mode
    - postgresql_pid_stat.stat.exists

- name: Select the PostgreSQL connection port
  ansible.builtin.set_fact:
    _postgresql_login_port: >-
      {{ (postgresql_pid_file.content | b64decode).splitlines()[3] | int
         if ansible_check_mode and postgresql_pid_file.content is defined
         else postgresql_port | int }}

- name: Wait for the configured PostgreSQL cluster
  become: true
  become_user: '{{ postgresql_user }}'
  ansible.builtin.command:
    argv:
      - '{{ postgresql_bin_path }}/pg_isready'
      - -h
      - /run/postgresql
      - -p
      - '{{ _postgresql_login_port | string }}'
  check_mode: false
  register: postgresql_ready
  changed_when: false
  until: postgresql_ready.rc == 0
  retries: 10
  delay: 2

- name: Add pg_stat_statements to template1
  become_user: postgres
  become: true
  community.postgresql.postgresql_ext:
    login_port: "{{ _postgresql_login_port | default(postgresql_port) }}"
    name: pg_stat_statements
    login_db: template1
  when: postgresql_with_pg_stat_statements

- name: Add pgvector extension to template1
  become_user: postgres
  become: true
  community.postgresql.postgresql_ext:
    login_port: "{{ _postgresql_login_port | default(postgresql_port) }}"
    name: vector
    login_db: template1
  when: postgresql_with_pgvector

- name: Remove entire PostgreSQL log directory if syslog is active
  ansible.builtin.file:
    path: /var/log/postgresql
    state: absent
  when:
    - postgresql_log_destination == 'syslog'
    - ansible_facts['hostname'] != 'instance'

- name: Include postgresqltuner tasks
  ansible.builtin.include_tasks: postgresqltuner.yml
