---
- name: With zabbix monitoring
  when:
    - zabbix_monitoring
    - zabbix_agent_remove is undefined or not zabbix_agent_remove
  block:
    - name: Add zabbix PostgreSQL user
      become_user: postgres
      become: true
      community.postgresql.postgresql_user:
        login_port: "{{ _postgresql_login_port | default(postgresql_port) }}"
        name: '{{ postgresql_zabbix_user }}'
        password: '{{ postgresql_zabbix_password }}'
        state: present
      no_log: '{{ hide_sensitive_data }}'

    - name: Set zabbix PostgreSQL grant
      community.postgresql.postgresql_membership:
        login_port: "{{ _postgresql_login_port | default(postgresql_port) }}"
        group: pg_monitor
        target_roles: "{{ postgresql_zabbix_user }}"
        state: present
      become_user: postgres
      become: true

    # pg_file_settings (errors in the configuration files) is readable by
    # superusers only. A view checks the functions it calls against the user
    # of the view, so the function needs the grant as well. Only in the
    # database the template connects to ({$PG.DATABASE}).
    - name: Allow zabbix to read pg_file_settings
      become_user: postgres
      become: true
      community.postgresql.postgresql_privs:
        login_port: "{{ _postgresql_login_port | default(postgresql_port) }}"
        login_db: '{{ postgresql_zabbix_database }}'
        roles: '{{ postgresql_zabbix_user }}'
        type: table
        schema: pg_catalog
        objs: pg_file_settings
        privs: SELECT

    - name: Allow zabbix to call pg_show_all_file_settings
      become_user: postgres
      become: true
      community.postgresql.postgresql_privs:
        login_port: "{{ _postgresql_login_port | default(postgresql_port) }}"
        login_db: '{{ postgresql_zabbix_database }}'
        roles: '{{ postgresql_zabbix_user }}'
        type: function
        schema: pg_catalog
        objs: pg_show_all_file_settings()
        privs: EXECUTE

    # Queries of pgsql.custom.query, root owned so zabbix cannot change them.
    # The plugin reads them on start.
    - name: Install custom queries for zabbix
      ansible.builtin.copy:
        src: zabbix/queries/
        dest: '{{ postgresql_zabbix_queries_dir }}/'
        owner: root
        group: root
        mode: '0644'
        directory_mode: '0755'
      notify: Restart zabbix-agent2

    # Replaced by the custom queries of the PostgreSQL plugin
    - name: Remove obsolete checks run through sudo
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/sudoers.d/postgresql
        - /etc/zabbix/pg_collation_mismatch.sql
        - /etc/zabbix/pg_extension_outdated.sh
        - /etc/zabbix/pg_health.sh

    # Provides the pgsql.* keys of the template "PostgreSQL by Zabbix agent 2"
    # (from the Zabbix repository, which the zabbix_agent role sets up)
    - name: Install PostgreSQL plugin of the Zabbix agent
      ansible.builtin.apt:
        name: zabbix-agent2-plugin-postgresql
        state: present
      notify: Restart zabbix-agent2

    # A file of its own, so the configuration file of the package stays untouched
    - name: Configure PostgreSQL plugin credentials
      ansible.builtin.template:
        src: zabbix_agent2_postgresql.conf.j2
        dest: '{{ postgresql_zabbix_plugin_config }}'
        owner: root
        group: zabbix
        mode: '0640'
      no_log: '{{ hide_sensitive_data }}'
      notify: Restart zabbix-agent2

    # The old UserParameter based monitoring is replaced by the plugin
    - name: Remove obsolete zabbix sql PostgreSQL files
      ansible.builtin.file:
        path: '{{ zabbix_agent_home }}/postgresql'
        state: absent

- name: Without zabbix monitoring
  when: not zabbix_monitoring
  block:
    - name: Remove zabbix PostgreSQL user
      become_user: postgres
      become: true
      community.postgresql.postgresql_user:
        login_port: "{{ _postgresql_login_port | default(postgresql_port) }}"
        name: '{{ postgresql_zabbix_user }}'
        state: absent

    - name: Remove custom queries and obsolete checks for zabbix
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - '{{ postgresql_zabbix_queries_dir }}'
        - /etc/sudoers.d/postgresql
        - /etc/zabbix/pg_collation_mismatch.sql
        - /etc/zabbix/pg_extension_outdated.sh
        - /etc/zabbix/pg_health.sh

    - name: Remove PostgreSQL plugin credentials of the Zabbix agent
      ansible.builtin.file:
        path: '{{ postgresql_zabbix_plugin_config }}'
        state: absent

    - name: Remove zabbix sql postgresql files
      ansible.builtin.file:
        path: '{{ zabbix_agent_home }}/postgresql'
        state: absent
