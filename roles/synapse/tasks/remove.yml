---
# Removes the service and keeps the data: the PostgreSQL database, the media
# store, the signing key and the user owning them. A later reinstall with the
# same server_name continues where it stopped. Drop them by hand once they are
# no longer needed.

- name: Gather installed packages
  ansible.builtin.package_facts:
    manager: apt

# Disable before the purge, otherwise systemd keeps reporting the unit as
# enabled and monitoring alerts about a service that is gone
- name: Stop and disable Synapse
  ansible.builtin.systemd_service:
    name: '{{ synapse_service_name }}'
    state: stopped
    enabled: false
  when: "'matrix-synapse-py3' in ansible_facts.packages"

- name: Remove Synapse package
  ansible.builtin.apt:
    name: matrix-synapse-py3
    purge: true
    state: absent
  notify: Reload systemd daemon

# Also removes the key it downloaded for signed_by
- name: Remove the matrix.org apt repository
  ansible.builtin.deb822_repository:
    name: matrix-org
    state: absent

# homeserver.signing.key stays next to them
- name: Remove the Synapse configuration of this role
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - '{{ synapse_config_file }}'
    - '{{ synapse_server_name_file }}'
    - '{{ synapse_report_stats_file }}'
    - '{{ synapse_log_config_file }}'

- name: Remove the Synapse vhost
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/nginx/sites-available/synapse.conf
    - /etc/nginx/sites-enabled/synapse.conf
  register: synapse_vhost_removed

- name: Reload nginx without the Synapse vhost
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when:
    - synapse_vhost_removed is changed
    - "'nginx' in ansible_facts.packages"

- name: Apply the removal
  ansible.builtin.meta: flush_handlers
