---
# defaults file for netfilter

# possible states:
# - active = rules from this role are loaded and reloaded on changes
# - disabled = nftables installed, the rules of this role are removed from the
#   kernel and the configuration, the service is stopped and not started at boot
# - reset = same as disabled
# - remove = like disabled, nothing else is uninstalled, fail2ban needs nftables
netfilter_state: disabled

netfilter_packages:
  - nftables

# Rules of the former iptables engine are flushed and these packages removed
# once the nftables rules are active
netfilter_iptables_cleanup_packages:
  - iptables-persistent
  - netfilter-persistent

netfilter_config_file: /etc/nftables.conf

# Rate of new ICMP echo requests accepted from all sources together. Further ones
# only pass as a trusted source or as part of a tracked ping.
netfilter_icmp_echo_limit: 20/second burst 50 packets

# Users without access to the cloud metadata service. Only existing users are
# used, a user created by a later role is added with the next run.
netfilter_metadata_blocked_users:
  - www-data
  - redmine
netfilter_metadata_addresses:
  - 169.254.169.254

# Only these users may connect to port 25 of other hosts, e.g. [postfix]. Empty
# disables the restriction. Enable it per host only after checking that nothing else
# sends there: Redmine, Matomo and Drupal can use their own SMTP server, a Redmine
# helpdesk plugin even per project. Only existing users are used.
netfilter_output_smtp_users: []

# Dropped without logging, they would fill the log sample (LLMNR, MikroTik discovery)
netfilter_silent_drop_udp_ports:
  - 5355
  - 5678

netfilter_blocked_addresses: []
netfilter_blocked_addresses_v6: []

# e.g. [80, 443] or ['8000-8080']
netfilter_allowed_tcp_ports: []
netfilter_allowed_udp_ports: []
# e.g. [{port: 3306, saddr: '192.0.2.10/32'}]
netfilter_allowed_tcp_ports_with_saddr: []
netfilter_allowed_udp_ports_with_saddr: []

netfilter_allowed_tcp_ports_with_saddr_v6: []
netfilter_allowed_udp_ports_with_saddr_v6: []

# sources accepted on all ports
netfilter_allowed_networks: []
netfilter_allowed_networks_v6: []
# only used with netfilter_filter_output_policy other than accept
netfilter_allowed_networks_output: []
netfilter_allowed_networks_output_v6: []

netfilter_allow_zabbix_server: true
netfilter_zabbix_server_address: "{{ zabbix_server_ip | default('') }}"
netfilter_zabbix_server_address_v6: "{{ zabbix_server_ip_v6 | default('') }}"
netfilter_zabbix_server_port: 10050
netfilter_allowed_active_zabbix_addresses: []
netfilter_allowed_active_zabbix_addresses_v6: []
# if yes, all ipv6 addresses are allowed as source (netfilter_allowed_active_zabbix_addresses_v6 is not used)
netfilter_allowed_active_zabbix_addresses_v6_all: false

# NAT (IPv4 only), e.g.
# netfilter_prerouting:
#   - {daddr: 192.0.2.1, dport: 80, dest: 10.0.0.2, saddr: 198.51.100.1, prot: tcp}
#   - {daddr: 192.0.2.1, prot: icmp, dest: 10.0.0.2}
# netfilter_postrouting:
#   - {saddr: 10.0.0.2, oifname: eth0, snat_to: 192.0.2.1}
netfilter_postrouting: []
netfilter_prerouting: []
# e.g. [{saddr: 198.51.100.1, daddr: 10.0.0.2, dport: 80, prot: tcp, saddr_v6: ..., daddr_v6: ...}]
netfilter_forward: []

# if not specified, all sources are allowed
netfilter_ssh_sources: []
netfilter_ssh_sources_v6: []

netfilter_log_dropped_packets: true

# accept or drop
netfilter_filter_input_policy: drop
netfilter_filter_forward_policy: drop
netfilter_filter_output_policy: accept

netfilter_nat_prerouting_policy: accept
netfilter_nat_postrouting_policy: accept

# Sources probing these ports lose the public ports for the timeout, every further
# packet renews it. Trusted sources and ssh are not affected. Empty lists disable
# the honeypot, which is the right choice behind NAT, as one infected client would
# lock out everybody sharing the address.
netfilter_honeypot_tcp_ports:
  - 23
  - 139
  - 445
  - 3389
  - 5900
  - 6379
  - 9200
  - 27017
netfilter_honeypot_udp_ports:
  - 137
  - 138
netfilter_honeypot_timeout: 10m
