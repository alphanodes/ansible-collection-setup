---

- name: Be sure nftables is installed
  ansible.builtin.apt:
    name: '{{ netfilter_packages }}'
    state: present

# Debian restarts nftables.service on package upgrades and its ExecStop flushes
# the whole ruleset, including the table of fail2ban. Without ExecStop a restart
# only reloads the configuration.
- name: Create the nftables service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: '0755'

- name: Keep nftables from flushing the ruleset on stop
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/nftables.service.d/override.conf
    mode: '0644'
  notify: Reload systemd daemon

- name: Activate rules
  when: netfilter_state == 'active'
  block:
    # The rules use the numeric uids of the users existing now
    - name: Read the existing users
      ansible.builtin.getent:
        database: passwd

    # Only the tables of this role are replaced, the table of fail2ban stays
    - name: Generate nftables rules
      ansible.builtin.template:
        src: nftables.conf.j2
        dest: '{{ netfilter_config_file }}'
        mode: '0755'
        validate: nft --check --file %s
      notify: Reload nftables

    - name: Ensure nftables is running and starts at boot
      ansible.builtin.systemd_service:
        name: nftables
        state: started
        enabled: true

    - name: Flush handlers to load the rules before the iptables cleanup
      ansible.builtin.meta: flush_handlers

- name: Deactivate rules
  when: netfilter_state != 'active'
  ansible.builtin.include_tasks: deactivate.yml

# Only once the nftables rules protect the host, other states leave foreign
# iptables rules (e.g. of Docker) alone
- name: Include iptables cleanup tasks
  ansible.builtin.include_tasks: cleanup_iptables.yml
  when: netfilter_state == 'active'
