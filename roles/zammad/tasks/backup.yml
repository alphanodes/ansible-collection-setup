---
- name: Create Zammad backup directory
  ansible.builtin.file:
    path: '{{ zammad_backup_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Configure Zammad backup connection
  ansible.builtin.template:
    src: backup.json.j2
    dest: /etc/zammad-backup.json
    owner: root
    group: root
    mode: '0600'
  no_log: '{{ hide_sensitive_data }}'

- name: Install Zammad backup program
  ansible.builtin.copy:
    src: zammad-backup.py
    dest: /usr/local/sbin/zammad-backup
    owner: root
    group: root
    mode: '0750'

- name: Manage Zammad backup timer
  ansible.builtin.include_role:
    name: alphanodes.setup.systemd_timer
  vars:
    timers:
      zammad-backup:
        state: "{{ 'present' if zammad_backup_enabled and zammad_enabled else 'absent' }}"
        exec_start: /usr/local/sbin/zammad-backup
        on_calendar: '{{ zammad_backup_on_calendar }}'
        randomized_delay_sec: '{{ zammad_backup_randomized_delay_sec }}'
        persistent: true
        after_service: postgresql.service
        service_extra: |
          UMask=0077
          TimeoutStartSec=1h
