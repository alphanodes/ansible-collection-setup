---

# Where ruby comes from:
#   package:    distribution packages (ruby, ruby-dev)
#   ruby_build: compiled with ruby-build (including YJIT) to
#               ruby_install_base/ruby_version. Nothing of this is installed
#               with package, and leftovers of a former ruby_build setup are removed.
ruby_source: package

# Ruby version to compile with ruby_source: ruby_build, e.g. 4.0.9
# (has to be a definition known by ruby_build_tool_version)
ruby_version: ''

# Directory for compiled ruby versions, each version gets its own sub directory
ruby_install_base: /opt/ruby

# Remove compiled ruby versions in ruby_install_base other than ruby_version
ruby_remove_other_versions: true

# Configure options for compiling ruby
ruby_configure_opts: '--enable-yjit --disable-install-doc'

# ruby-build release (git tag), see https://github.com/rbenv/ruby-build/releases
ruby_build_tool_version: v20261023
ruby_build_tool_repo: https://github.com/rbenv/ruby-build.git
ruby_build_tool_dir: /usr/local/share/ruby-build

# Additional packages for ruby_source: ruby_build (rustc is required for YJIT)
ruby_build_tool_packages:
  - git
  - rustc
  - zlib1g-dev

ruby_required_packages:
  - ruby

ruby_dev_packages:
  - ruby-dev

ruby_build_packages:
  - autoconf
  - automake
  - bison
  - build-essential
  - gawk
  - libffi-dev
  - libgdbm-dev
  - libgmp-dev
  - libncurses-dev
  - libreadline-dev
  - libsqlite3-dev
  - libssl-dev
  - libsystemd-dev
  - libyaml-dev
  - libzstd-dev
  - sqlite3

# if this is true, required packages will be removed!
ruby_without_required_packages: false

# if this is false, ruby_dev_packages will be removed!
ruby_dev: false
# if ruby_dev is false and if ruby_without_dev_packages is true,
# ruby_dev_packages will be removed
ruby_without_dev_packages: false

ruby_build: false
# if ruby_build is false and if ruby_without_build_packages is true,
# ruby_build_packages will be removed
ruby_without_build_packages: false

# use ruby from backports, if backports is enabled with debian_backports
ruby_use_backports: true
