---

- name: Validate ruby_source
  ansible.builtin.assert:
    that:
      - ruby_source in ['package', 'ruby_build']
      - ruby_source == 'package' or ruby_version | length > 0
    fail_msg: "ruby_source has to be package or ruby_build, ruby_build requires ruby_version"
    quiet: true

- name: Pinning ruby backport packages
  ansible.builtin.template:
    src: backports-pin.j2
    dest: /etc/apt/preferences.d/ruby
    mode: '0644'
  when:
    - debian_backports is defined
    - debian_backports
    - ruby_use_backports

- name: Remove unwanted pinning for backport packages
  ansible.builtin.file:
    path: /etc/apt/preferences.d/ruby
    state: absent
  when: debian_backports is undefined or not debian_backports or not ruby_use_backports

- name: Ensure required packages are present
  ansible.builtin.apt:
    name: '{{ ruby_required_packages }}'
    state: present
  when: not ruby_without_required_packages

- name: Ensure ruby packages are absent
  ansible.builtin.apt:
    name: '{{ ruby_required_packages }}'
    state: absent
    purge: true
  when: ruby_without_required_packages

- name: Ensure dev packages are present
  ansible.builtin.apt:
    name: '{{ ruby_dev_packages }}'
    state: present
  when: ruby_dev

- name: Ensure dev packages are absent
  ansible.builtin.apt:
    name: '{{ ruby_dev_packages }}'
    state: absent
    purge: true
  when: not ruby_dev and ruby_without_dev_packages

- name: Ensure build packages are present
  ansible.builtin.apt:
    name: '{{ ruby_build_packages }}'
    state: present
  when: ruby_build

- name: Ensure build packages are absent
  ansible.builtin.apt:
    name: '{{ ruby_build_packages }}'
    state: absent
    purge: true
  when:
    - ruby_source == 'package'
    - not ruby_build
    - ruby_without_build_packages

- name: Setup ruby with ruby-build
  ansible.builtin.import_tasks: ruby_build.yml
  when: ruby_source == 'ruby_build'

- name: Remove ruby-build setup
  ansible.builtin.import_tasks: ruby_build_remove.yml
  when: ruby_source == 'package'
