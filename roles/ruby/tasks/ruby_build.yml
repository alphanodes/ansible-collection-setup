---

# Before the build, so a ruby version is never built with help of the
# distribution ruby, which would fail as soon as it is removed
- name: Remove distribution ruby
  ansible.builtin.import_tasks: system_ruby_remove.yml
  when:
    - ruby_remove_system_ruby
    - not ruby_defer_cleanup

- name: Ensure packages for ruby-build are present
  ansible.builtin.apt:
    name: '{{ ruby_build_packages + ruby_build_tool_packages }}'
    state: present

- name: Checkout ruby-build {{ ruby_build_tool_version }}
  ansible.builtin.git:
    repo: '{{ ruby_build_tool_repo }}'
    dest: '{{ ruby_build_tool_dir }}'
    version: '{{ ruby_build_tool_version }}'
    depth: 1
    force: true

- name: Ensure ruby install base exists
  ansible.builtin.file:
    path: '{{ ruby_install_base }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

# Marker for ruby_build_remove.yml, which only deletes a managed install base
- name: Mark ruby install base as managed by ansible
  ansible.builtin.file:
    path: '{{ ruby_install_base }}/.managed-by-ansible'
    state: touch
    owner: root
    group: root
    mode: '0644'
    modification_time: preserve
    access_time: preserve

- name: Build ruby {{ ruby_version }}
  ansible.builtin.command:
    cmd: '{{ ruby_build_tool_dir }}/bin/ruby-build {{ ruby_version }} {{ ruby_install_base }}/{{ ruby_version }}'
    creates: '{{ ruby_install_base }}/{{ ruby_version }}/bin/ruby'
  environment:
    RUBY_CONFIGURE_OPTS: '{{ ruby_configure_opts }}'

# Without it, gem install writes the absolute path of this ruby version into
# executables (e.g. bundle), which breaks them after removing this version
- name: Ensure system wide gemrc directory exists
  ansible.builtin.file:
    path: '{{ ruby_install_base }}/{{ ruby_version }}/etc'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install system wide gemrc
  ansible.builtin.template:
    src: gemrc.j2
    dest: '{{ ruby_install_base }}/{{ ruby_version }}/etc/gemrc'
    owner: root
    group: root
    mode: '0644'

- name: Link ruby executables to /usr/local/bin
  ansible.builtin.file:
    src: '{{ ruby_install_base }}/{{ ruby_version }}/bin/{{ item }}'
    dest: '/usr/local/bin/{{ item }}'
    state: link
  loop: '{{ ruby_bin_links }}'

- name: Remove other compiled ruby versions
  ansible.builtin.import_tasks: remove_other_versions.yml
  when:
    - ruby_remove_other_versions
    - not ruby_defer_cleanup
