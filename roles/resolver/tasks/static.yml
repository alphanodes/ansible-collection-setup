---

- name: Deploy static /etc/resolv.conf
  ansible.builtin.template:
    src: etc/resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
    # /etc/resolv.conf is a bind-mount inside containers; the atomic rename
    # then fails with EBUSY. unsafe_writes falls back to an in-place write.
    unsafe_writes: true

# Only hosts with isc-dhcp-client have this directory. The hook name must
# not contain a dot, run-parts in dhclient-script skips such files.
- name: Stat dhclient enter hooks directory
  ansible.builtin.stat:
    path: '{{ resolver_dhclient_enter_hooks_dir }}'
  register: resolver_dhclient_hooks_dir

- name: Keep dhclient from overwriting /etc/resolv.conf
  ansible.builtin.template:
    src: etc/dhcp/dhclient-enter-hooks.d/resolver-static.j2
    dest: '{{ resolver_dhclient_enter_hooks_dir }}/resolver-static'
    owner: root
    group: root
    mode: '0644'
  when: resolver_dhclient_hooks_dir.stat.isdir | default(false)

# In static mode we manage /etc/resolv.conf directly via Ansible; resolvconf
# is not needed and its hooks would conflict with our managed file.
- name: Remove resolvconf package
  ansible.builtin.apt:
    name: resolvconf
    state: absent
    purge: true
