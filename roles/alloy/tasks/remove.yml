---

- name: Gather installed packages
  ansible.builtin.package_facts:
    manager: apt

# The package removes its unit file on purge but keeps the enablement link,
# systemd then still reports the unit as enabled and monitoring alerts
- name: Stop and disable alloy
  ansible.builtin.systemd_service:
    name: alloy
    state: stopped
    enabled: false
  when: "'alloy' in ansible_facts.packages"

- name: Remove alloy package
  ansible.builtin.apt:
    name: '{{ alloy_packages }}'
    purge: true
    state: absent
  notify: Reload systemd daemon

# Hosts purged without disabling first keep a dangling enablement link
- name: Find leftover alloy unit links
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: alloy.service
    file_type: link
    recurse: true
  register: alloy_unit_links

- name: Remove leftover alloy unit links
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: '{{ alloy_unit_links.files }}'
  loop_control:
    label: '{{ item.path }}'
  notify: Reload systemd daemon

# The alloy package ships no postrm, a purge keeps its user, group and data
- name: Remove alloy files and directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/alloy
    - /var/lib/alloy

- name: Remove alloy user
  ansible.builtin.user:
    name: alloy
    state: absent

- name: Remove alloy group
  ansible.builtin.group:
    name: alloy
    state: absent

# Grafana and Loki install from the same repository, keep it for them
- name: Remove Grafana apt repository and key
  when:
    - "'grafana' not in ansible_facts.packages"
    - "'loki' not in ansible_facts.packages"
  block:
    - name: Remove Grafana apt repository
      ansible.builtin.deb822_repository:
        name: grafana
        state: absent

    - name: Remove Grafana apt keys
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - '{{ alloy_apt_signed_by }}'
        - /etc/apt/keyrings/grafana.gpg

- name: Reload systemd before monitoring sees the removed unit
  ansible.builtin.meta: flush_handlers
