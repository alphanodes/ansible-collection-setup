---

- name: Ensures software_path exists
  ansible.builtin.file:
    path: '{{ software_path }}'
    owner: '{{ software_path_owner | default(omit) }}'
    group: '{{ software_path_group | default(omit) }}'
    mode: '{{ software_path_mode | default(omit) }}'
    state: directory

# Before any package installation, so all packages of this run follow it
- name: Configure installation of recommended packages
  ansible.builtin.template:
    src: apt/apt.conf.d/10install-recommends.j2
    dest: /etc/apt/apt.conf.d/10install-recommends
    owner: root
    group: root
    mode: '0644'

# Shipped by Hetzner cloud images, replaced by 10install-recommends
- name: Remove recommends setting of the cloud image
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/00InstallRecommends
    state: absent

- name: Be sure common packages are installed
  ansible.builtin.apt:
    name: '{{ common_packages }}'
    state: present
    update_cache: true
    cache_valid_time: 3600

# The classic sudo takes over /usr/bin/sudo through the alternatives again.
# It has to be installed first, otherwise the host would end up without sudo
- name: Replace sudo-rs with the classic sudo
  when:
    - common_remove_sudo_rs | bool
    - ansible_facts['distribution'] | default('') == 'Ubuntu'
  block:
    - name: Ensure the classic sudo is installed
      ansible.builtin.apt:
        name: sudo
        state: present

    - name: Remove sudo-rs
      ansible.builtin.apt:
        name: sudo-rs
        state: absent
