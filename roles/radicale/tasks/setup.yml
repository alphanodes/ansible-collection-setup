---

- name: Include python role
  ansible.builtin.include_role:
    name: alphanodes.setup.python
    public: true

- name: Radicale group exists
  ansible.builtin.group:
    name: '{{ radicale_group }}'
    state: present
    system: true

- name: Radicale user exists
  ansible.builtin.user:
    name: '{{ radicale_user }}'
    group: '{{ radicale_group }}'
    home: '{{ radicale_dir }}'
    shell: /usr/sbin/nologin
    state: present
    system: true

- name: Install radicale
  ansible.builtin.pip:
    name: '{{ radicale_pip_packages }}'
    virtualenv: '{{ radicale_pip_venv_path }}'
    state: '{{ python_pip_default_state }}'
    virtualenv_site_packages: '{{ python_pip_virtualenv_site_packages }}'
  become: true
  become_user: '{{ radicale_user }}'
  register: radicale_pip_result

# Since Radicale 3.6.0, libpass replaces passlib. Both ship the same
# passlib module directory, so a leftover passlib can overwrite libpass files.
- name: Remove obsolete passlib from radicale virtualenv
  ansible.builtin.pip:
    name: passlib
    virtualenv: '{{ radicale_pip_venv_path }}'
    state: absent
  become: true
  become_user: '{{ radicale_user }}'
  register: radicale_passlib_result

# Uninstalling passlib deletes the shared module files. Check the actual state
# (not only the uninstall result), so an interrupted run is repaired next time.
# Prints the installed libpass version and fails if passlib.hash is not importable.
- name: Check passlib module from libpass in radicale virtualenv
  ansible.builtin.command:
    argv:
      - '{{ radicale_pip_venv_path }}/bin/python3'
      - -c
      - "import importlib.metadata as m; print(m.version('libpass')); import passlib.hash"
  become: true
  become_user: '{{ radicale_user }}'
  register: radicale_libpass_check
  changed_when: false
  failed_when: false
  check_mode: false

# Restore the files with the already installed libpass version,
# so no upgrade happens outside of the radicale dependency resolution
- name: Reinstall libpass to restore the passlib module
  ansible.builtin.pip:
    name: "libpass{{ ('==' ~ radicale_libpass_check.stdout_lines[0]) if radicale_libpass_check.stdout_lines | length > 0 else '' }}"
    virtualenv: '{{ radicale_pip_venv_path }}'
    extra_args: --force-reinstall --no-deps
  become: true
  become_user: '{{ radicale_user }}'
  register: radicale_libpass_result
  when: radicale_libpass_check.rc != 0

- name: Check folder exists for /etc/radicale
  ansible.builtin.file:
    path: /etc/radicale
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Radicale collection folder exists
  ansible.builtin.file:
    path: '{{ radicale_collections_dir }}'
    state: directory
    owner: '{{ radicale_user }}'
    group: '{{ radicale_group }}'
    mode: '0750'

- name: Configuration for radicale
  ansible.builtin.template:
    src: radicale/{{ item }}.j2
    dest: /etc/radicale/{{ item }}
    owner: '{{ radicale_user }}'
    group: '{{ radicale_group }}'
    mode: '0640'
  loop:
    - config
    - rights
  register: radicale_config_result

- name: Systemd service is available
  ansible.builtin.template:
    src: systemd.service.j2
    dest: /etc/systemd/system/{{ radicale_service_name }}.service
    owner: root
    group: root
    mode: '0644'
  register: radicale_service_result

- name: Radicale service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ radicale_service_name }}"
    state: >-
      {{ 'restarted' if (radicale_pip_result.changed
                         or radicale_passlib_result.changed
                         or radicale_libpass_result.changed
                         or radicale_config_result.changed
                         or radicale_service_result.changed) else 'started' }}
    enabled: true
    daemon_reload: true

- name: Ensure pid directory exists after reboot
  ansible.builtin.include_role:
    name: alphanodes.setup.systemd_timer
  vars:
    timers:
      radicale_directory:
        exec_start: /usr/bin/install -g {{ radicale_group }} -o {{ radicale_user }} -d {{ radicale_pid_dir }}
        on_boot_sec: 5s
        before_service: "{{ radicale_service_name }}.service"

- name: Remove obsolete cron file for pid directory
  ansible.builtin.file:
    path: /etc/cron.d/radicale_directory
    state: absent

- name: Import nginx tasks
  ansible.builtin.import_tasks: nginx.yml
  tags: nginx
