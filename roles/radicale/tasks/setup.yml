---

- name: Include python role
  ansible.builtin.include_role:
    name: alphanodes.setup.python
    public: true

- name: Radicale group exists
  ansible.builtin.group:
    name: '{{ radicale_group }}'
    state: present
    system: true

- name: Radicale user exists
  ansible.builtin.user:
    name: '{{ radicale_user }}'
    group: '{{ radicale_group }}'
    home: '{{ radicale_dir }}'
    shell: /usr/sbin/nologin
    state: present
    system: true

- name: Install radicale
  ansible.builtin.pip:
    name: '{{ radicale_pip_packages }}'
    virtualenv: '{{ radicale_pip_venv_path }}'
    state: '{{ python_pip_default_state }}'
    virtualenv_site_packages: '{{ python_pip_virtualenv_site_packages }}'
  become: true
  become_user: '{{ radicale_user }}'
  register: radicale_pip_result

# The passlib module comes from libpass up to 1.9.4, since 1.9.5 libpass is
# only an alias that pins the maintained passlib. On the upgrade pip installs
# passlib first and then uninstalls the old libpass, which deletes the shared
# module files again. Reports whether passlib.hash is importable and the
# package providing it.
- name: Check passlib module in radicale virtualenv
  ansible.builtin.command:
    argv:
      - '{{ radicale_pip_venv_path }}/bin/python3'
      - -c
      - |
        import importlib.metadata as m, json
        try:
            libpass = m.version('libpass')
        except m.PackageNotFoundError:
            libpass = None
        requires = (m.requires('libpass') or []) if libpass else []
        pins = [r.replace(' ', '') for r in requires if r.replace(' ', '').startswith('passlib==')]
        try:
            import passlib.hash
            importable = True
        except Exception:
            importable = False
        provider = pins[0] if pins else ('libpass==' + libpass if libpass else '')
        print(json.dumps({'provider': provider, 'importable': importable}))
  become: true
  become_user: '{{ radicale_user }}'
  register: radicale_passlib_check
  changed_when: false
  check_mode: false

- name: Set passlib state of radicale virtualenv
  ansible.builtin.set_fact:
    radicale_passlib_state: '{{ radicale_passlib_check.stdout | from_json }}'

# Restore the files with the already installed version of the providing
# package, so no upgrade happens outside of the radicale dependency resolution
- name: Reinstall the package providing the passlib module
  ansible.builtin.pip:
    name: '{{ radicale_passlib_state.provider }}'
    virtualenv: '{{ radicale_pip_venv_path }}'
    extra_args: --force-reinstall --no-deps
  become: true
  become_user: '{{ radicale_user }}'
  register: radicale_libpass_result
  when:
    - radicale_passlib_state.provider | length > 0
    - not radicale_passlib_state.importable

- name: Check folder exists for /etc/radicale
  ansible.builtin.file:
    path: /etc/radicale
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Radicale collection folder exists
  ansible.builtin.file:
    path: '{{ radicale_collections_dir }}'
    state: directory
    owner: '{{ radicale_user }}'
    group: '{{ radicale_group }}'
    mode: '0750'

- name: Configuration for radicale
  ansible.builtin.template:
    src: radicale/{{ item }}.j2
    dest: /etc/radicale/{{ item }}
    owner: '{{ radicale_user }}'
    group: '{{ radicale_group }}'
    mode: '0640'
  loop:
    - config
    - rights
  register: radicale_config_result

- name: Systemd service is available
  ansible.builtin.template:
    src: systemd.service.j2
    dest: /etc/systemd/system/{{ radicale_service_name }}.service
    owner: root
    group: root
    mode: '0644'
  register: radicale_service_result

- name: Radicale service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ radicale_service_name }}"
    state: >-
      {{ 'restarted' if (radicale_pip_result.changed
                         or radicale_libpass_result.changed
                         or radicale_config_result.changed
                         or radicale_service_result.changed) else 'started' }}
    enabled: true
    daemon_reload: true

- name: Ensure pid directory exists after reboot
  ansible.builtin.include_role:
    name: alphanodes.setup.systemd_timer
  vars:
    timers:
      radicale_directory:
        exec_start: /usr/bin/install -g {{ radicale_group }} -o {{ radicale_user }} -d {{ radicale_pid_dir }}
        on_boot_sec: 5s
        before_service: "{{ radicale_service_name }}.service"

- name: Remove obsolete cron file for pid directory
  ansible.builtin.file:
    path: /etc/cron.d/radicale_directory
    state: absent

- name: Import nginx tasks
  ansible.builtin.import_tasks: nginx.yml
  tags: nginx
