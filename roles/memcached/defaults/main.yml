---
memcached_port: 11211
memcached_listen_ip: 127.0.0.1

# Memory limit in MB
memcached_memory_limit: 64
memcached_connections: 1024

# Empty logs nothing, '-v' enables logging, '-vv' debug logging
memcached_log_verbosity: ""

memcached_max_item_size: 1m

memcached_threads: 4

memcached_packages:
  - memcached
  - libmemcached-tools

memcached_remove: false
