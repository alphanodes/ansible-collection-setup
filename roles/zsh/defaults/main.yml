---

zsh_packages:
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting

zsh_with_setup: true
zsh_with_zshrc: true

# show ruby prompt with user info
zsh_with_ruby: false
# with active rvm
zsh_with_rvm: false
# for composer vendor suport (drupal)
zsh_with_composer: false
zsh_with_completions: true

# Prompt with starship, see https://starship.rs
# The static linked musl binary is installed from the upstream GitHub release.
# Version to install - can be specific version (e.g. '1.26.0') or 'latest'
# When set to 'latest', the role fetches the latest release from GitHub API
zsh_with_starship: true
zsh_starship_version: latest
zsh_starship_arch: "{{ 'aarch64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"
zsh_starship_binary_path: /usr/local/bin/starship

zsh_user: root

zsh_default_shell: true

# used in .zshrc
zsh_global_exports: []
zsh_local_exports: []

zsh_history_ignore: "(ls|ll|lk|cd|pwd|exit|reboot|history|u|cd ..)"

zsh_global_env:
  - alias ch='rm -f ~/.zsh_history && rm -f ~/.bash_history'
  - alias df='df -h'
  - alias egrep='egrep --color=auto'
  - alias free='free -m'
  - alias grep='grep --color=auto'
  - alias l='ls -lhA'
  - alias lk='apt list --installed "linux*"'
  - alias ll='ls -lah'
  - alias ls='ls --color'
  - alias lsn='ls --color=no'
  - alias lss='ls -oaShr'
  - alias lst='ls -oathr'

zsh_histsize: 1000

zsh_virtualization_type: "{{ virtualization_type if virtualization_type is defined else ansible_facts['virtualization_type'] }}"

zsh_auto_ls_plugin_file: /usr/share/alphanodes/zsh/auto-ls.zsh
