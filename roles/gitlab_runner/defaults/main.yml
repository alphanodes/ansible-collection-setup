---
# defaults file for gitlab_runner

gitlab_runner_coordinator_url: ''

gitlab_runner_packages:
  - gitlab-runner

# see https://docs.hetzner.com/cloud/general/locations/
gitlab_runner_hetzner_server_location: nbg1
# see https://www.hetzner.com/de/cloud/
gitlab_runner_hetzner_server_type: cx23
gitlab_runner_hetzner_ruby_server_type: '{{ gitlab_runner_hetzner_server_type }}'
gitlab_runner_hetzner_image: debian-13
gitlab_runner_hetzner_api_token: ''

# see https://community.hetzner.com/tutorials/howto-setup-gitlab-ci-auto-scaling-infrastructure
# see https://gitlab.com/hetznercloud/fleeting-plugin-hetzner/-/blob/main/docs/guides/quickstart.md
# see https://gitlab.com/hetznercloud/fleeting-plugin-hetzner/-/blob/main/docs/reference/configuration.md
gitlab_runner_with_hetzner_fleed: true
# Workaround for containerd v2 content store bug in Docker 29.x causing
# intermittent "failed to send write: offset mismatch" during image pulls.
# Pin to Docker 28.x, which pulls images without the containerd image store.
# Only docker-ce and docker-ce-cli are pinned, containerd.io and the plugins
# install in their latest version, which works with Docker 28.x.
# Set to '' to install latest docker-ce version.
# The pin requires gitlab_runner_hetzner_image debian-13, Docker ships no
# 28.x packages for newer Debian releases.
# No upstream fix is known for the offset mismatch, the issues below are
# related context only (all closed before the failures started in 2026).
# Related upstream issues:
#   https://github.com/containerd/containerd/issues/11440
#   https://github.com/containerd/containerd/issues/8741
#   https://github.com/containerd/containerd/issues/11864
# Tracking: #15045
gitlab_runner_hetzner_docker_version: '5:28.5.2'
# Storage driver for Docker on the runner VM (daemon.json), e.g. overlay2.
# Forcing overlay2 did not fix the offset mismatch above.
gitlab_runner_hetzner_docker_storage_driver: ''
# DNS resolvers for Docker containers on the runner VM. Hetzner Cloud resolvers
# (185.12.64.1/.2) are reliable but occasionally throttle, causing
# "Could not resolve host" errors during git clone or artifact download. Adding
# Cloudflare and Quad9 as fallback eliminates the single point of failure.
gitlab_runner_hetzner_dns:
  - 185.12.64.1
  - 185.12.64.2
  - 1.1.1.1
  - 9.9.9.9
# Keep a fixed version: the runner resolves a tag like :latest only on the first
# install and keeps that binary, so it silently ages. Older versions break when
# the Hetzner Cloud API changes (v1.2.0 stopped working in May 2026).
# see https://gitlab.com/hetznercloud/fleeting-plugin-hetzner/-/releases
gitlab_runner_hetzner_fleed_plugin: "hetznercloud/fleeting-plugin-hetzner:1.4.7"
gitlab_runner_timezone: "{{ ntp_timezone | default('Europe/Berlin') }}"

gitlab_runner_registry_mirror: ''

# Maximum number of global jobs to run concurrently
gitlab_runner_concurrent: '{{ ansible_facts["processor_nproc"] }}'

# see https://packages.gitlab.com/runner/gitlab-runner
gitlab_runner_apt: true
gitlab_runner_apt_pinning: false
gitlab_runner_apt_url: https://packages.gitlab.com/runner/gitlab-runner/{{ ansible_facts.distribution | lower }}
gitlab_runner_apt_signed_by: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
gitlab_runner_apt_suites: '{{ ansible_facts.distribution_release }}'
gitlab_runner_apt_components: main

gitlab_runner_remove: false

# Periodic cleanup of unused Docker resources on the runner host. Helpful for
# brokers that run local docker executors which accumulate stopped containers,
# dangling images and BuildKit cache over time. Disabled by default - opt in
# per host. Volumes are preserved (no --volumes flag).
gitlab_runner_docker_cleanup: false
gitlab_runner_docker_cleanup_oncalendar: '*-*-* 02:00:00'
gitlab_runner_docker_cleanup_until: '72h'
gitlab_runner_docker_cleanup_random_delay_sec: '15min'
