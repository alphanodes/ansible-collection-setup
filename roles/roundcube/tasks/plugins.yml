---

# Third-party plugins installed by earlier versions of this role, removed
# because they needed pinned versions without automatic security updates
- name: Remove third-party plugins
  ansible.builtin.file:
    path: '{{ roundcube_plugins_dir }}/{{ item }}'
    state: absent
  loop:
    - carddav
    - contextmenu

- name: Configuration for password plugin
  ansible.builtin.template:
    src: password_config.inc.php.j2
    dest: '{{ roundcube_plugins_dir }}/password/config.inc.php'
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0640'
  when: roundcube_with_password
