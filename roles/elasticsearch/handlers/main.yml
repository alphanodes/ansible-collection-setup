---

- name: Update elasticsearch apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Reload elasticsearch systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart elasticsearch
  ansible.builtin.systemd_service:
    name: elasticsearch
    state: restarted
    daemon_reload: true
  when: elasticsearch_enabled | bool
