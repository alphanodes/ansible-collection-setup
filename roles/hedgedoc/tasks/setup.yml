---

- name: Ensure required packages are installed
  ansible.builtin.apt:
    name: "{{ hedgedoc_required_packages }}"
    state: present

- name: Ensure hedgedoc user is present
  ansible.builtin.user:
    name: "{{ hedgedoc_user }}"
    home: "{{ hedgedoc_home }}"
    shell: /bin/bash
    state: present

- name: Include git_config
  ansible.builtin.include_role:
    name: alphanodes.setup.git_config
  vars:
    git_config_user: "{{ hedgedoc_user }}"
    git_config_settings:
      - name: user.name
        value: "{{ hedgedoc_user }} job"

# Empty on a fresh host, there the install builds the native modules anyway
- name: Get node version before the nodejs role
  ansible.builtin.command: node --version
  register: hedgedoc_node_version_before
  changed_when: false
  failed_when: false

- name: Include nodejs role
  ansible.builtin.include_role:
    name: alphanodes.setup.nodejs
    public: true

# Native modules (sqlite3, bufferutil, utf-8-validate) are built for one node
# ABI, so a new node release needs a rebuild before the service is restarted
- name: Get installed node version
  ansible.builtin.command: "{{ nodejs_bin }} --version"
  register: hedgedoc_node_version
  changed_when:
    - hedgedoc_node_version_before.rc == 0
    - hedgedoc_node_version_before.stdout != hedgedoc_node_version.stdout
  notify: Run yarn rebuild

# Checked before the checkout, so an unsupported node version does not leave
# the working copy on a revision that never gets built
- name: Ensure installed node version is supported by hedgedoc
  ansible.builtin.assert:
    that:
      - hedgedoc_node_version.stdout | regex_replace('^v', '') is version(hedgedoc_node_min_version, '>=')
    fail_msg: >-
      hedgedoc {{ hedgedoc_repository_version }} requires node {{ hedgedoc_node_min_version }}
      or later, but {{ hedgedoc_node_version.stdout }} is installed
    success_msg: "node {{ hedgedoc_node_version.stdout }} is supported by hedgedoc"

- name: Be sure patch is installed
  ansible.builtin.apt:
    name: patch
    state: present

- name: Check the checked out hedgedoc version
  ansible.builtin.command: git -C {{ hedgedoc_path }} describe --tags --exact-match
  register: hedgedoc_installed_version
  become_user: "{{ hedgedoc_user }}"
  become: true
  changed_when: false
  failed_when: false
  check_mode: false

# Patched files are hidden from git (see below), a checkout of another version
# would refuse to overwrite them
- name: Undo the local patches before a version change
  ansible.builtin.shell: |
    set -eo pipefail
    cd {{ hedgedoc_path }}
    git ls-files -v | sed -n 's/^S //p' | while read -r file; do
      git update-index --no-skip-worktree "$file"
      git checkout -- "$file"
    done
  args:
    executable: /bin/bash
  become_user: "{{ hedgedoc_user }}"
  become: true
  changed_when: true
  when:
    - hedgedoc_update
    - hedgedoc_installed_version.rc == 0
    - hedgedoc_installed_version.stdout != hedgedoc_repository_version

- name: Ensure hedgedoc is latest
  ansible.builtin.git:
    repo: "{{ hedgedoc_repository }}"
    dest: "{{ hedgedoc_path }}"
    version: "{{ hedgedoc_repository_version }}"
  become_user: "{{ hedgedoc_user }}"
  become: true
  when: hedgedoc_update
  notify:
    - Run yarn install
    - Run yarn build
    - Restart hedgedoc

# Patches for bugs without an upstream release, in a directory per version
- name: Apply the patches for this hedgedoc version
  ansible.posix.patch:
    src: '{{ item }}'
    basedir: '{{ hedgedoc_path }}'
    strip: 1
  loop: "{{ lookup('ansible.builtin.fileglob', role_path ~ '/files/patches/' ~ hedgedoc_repository_version ~ '/*.patch', wantlist=True) }}"
  become_user: "{{ hedgedoc_user }}"
  become: true
  register: hedgedoc_patches
  notify: Restart hedgedoc

# The git task above fails on local modifications
- name: Hide the patched files from git
  ansible.builtin.shell: |
    set -eo pipefail
    cd {{ hedgedoc_path }}
    git diff --name-only | tee /dev/stderr | xargs --no-run-if-empty git update-index --skip-worktree
  args:
    executable: /bin/bash
  become_user: "{{ hedgedoc_user }}"
  become: true
  register: hedgedoc_patches_hidden
  changed_when: hedgedoc_patches_hidden.stderr | length > 0
  when: hedgedoc_patches.results | length > 0

- name: Ensure hedgedoc configuration is latest
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ hedgedoc_path }}/config.json"
    owner: "{{ hedgedoc_user }}"
    group: "{{ hedgedoc_group }}"
    mode: '0600'
  notify: Restart hedgedoc

- name: Ensure hedgedoc sequelizerc is latest
  ansible.builtin.template:
    src: sequelizerc.j2
    dest: "{{ hedgedoc_path }}/.sequelizerc"
    owner: "{{ hedgedoc_user }}"
    group: "{{ hedgedoc_group }}"
    mode: '0600'
  notify: Restart hedgedoc

- name: Run systemd block
  when: hedgedoc_enabled
  block:
    - name: Ensure hedgedoc systemd script is latest
      ansible.builtin.template:
        src: hedgedoc.service.j2
        dest: /etc/systemd/system/hedgedoc.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd daemon
        - Restart hedgedoc

    - name: Flush all handlers at this point
      ansible.builtin.meta: flush_handlers

    - name: Ensure hedgedoc service is running and start after reboot
      ansible.builtin.systemd_service:
        name: hedgedoc
        state: started
        enabled: true

- name: Enable systemd
  when: not hedgedoc_enabled
  block:
    - name: Flush all handlers at this point
      ansible.builtin.meta: flush_handlers

    - name: Ensure hedgedoc service is stopped and disable
      ansible.builtin.systemd_service:
        name: hedgedoc
        state: stopped
        enabled: false
