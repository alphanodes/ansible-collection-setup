---
# defaults file for zabbix_agent

# used for agent, proxy and server
zabbix_use_repo: true
# only used, if zabbix_use_repo is yes
zabbix_version: 7.4

zabbix_repo_protocol: https
zabbix_apt_url: "{{ zabbix_repo_protocol }}://repo.zabbix.com/zabbix/{{ zabbix_version }}/stable/{{ ansible_facts.distribution | lower }}/"
zabbix_apt_suites: "{{ ansible_facts.distribution_release }}"
zabbix_apt_components: main

# local file is used, if not configured
# zabbix_apt_signed_by: "{{ zabbix_repo_protocol }}://repo.zabbix.com/zabbix/{{ zabbix_version }}/{{ ansible_facts.distribution | lower }}"

# set pinned version, if required
# zabbix_agent_version_pinning: "1:4.4.1*"
zabbix_agent_version_pinning: ""

zabbix_agent_server: "{{ zabbix_server_vhost }}"
zabbix_agent_listen_port: 10050
zabbix_agent_server_active: '{{ zabbix_server_vhost }}'
zabbix_agent_hostname: '{{ hostname | default(ansible_host) }}'
zabbix_agent_start_agents: 3

zabbix_agent_source_ip: ''

zabbix_agent_log_file: ''
zabbix_agent_log_file_size: 0
# only used with zabbix_use_repo is yes
zabbix_agent_log_type: system
zabbix_agent_debug_level: 3
zabbix_agent_control_socket: /run/zabbix/agent.sock
zabbix_agent_plugin_socket: /run/zabbix/agent.plugin.sock
zabbix_agent_deny_key: 'system.run[*]'

zabbix_addons_dir: /usr/share/zabbix_addons

zabbix_agent_packages:
  - libxml2-utils
  - sudo
  - wget
  - whois
  - zabbix-agent2

zabbix_agent_packages_mode: present

# add binaries, which should be installed from files/binaries
# @see https://repo.zabbix.com/zabbix/4.4/ubuntu/pool/main/z/zabbix/
# @see https://repo.zabbix.com/zabbix/4.4/debian/pool/main/z/zabbix/
zabbix_agent_binary: ''

# Zabbix API
zabbix_agent_server_api: true
zabbix_agent_create_hostgroup: false
zabbix_agent_create_host: false
zabbix_agent_macros: []

zabbix_agent_host_groups:
  - Linux servers

zabbix_agent_link_templates:
  - Linux System

# Zabbix API stuff
zabbix_agent_become_on_localhost: true
zabbix_install_pip_packages: true

zabbix_url: "https://{{ zabbix_server_vhost }}"
zabbix_api_user: Admin
zabbix_api_pass: zabbix
zabbix_api_create_hostgroup: false
zabbix_api_create_hosts: true
# or absent
zabbix_create_hostgroup: present
# or absent
zabbix_create_host: present
zabbix_update_host: true
# or disabled
zabbix_host_status: enabled
# or disabled or automatic
zabbix_inventory_mode: manual
zabbix_use_ip: 1
zabbix_host_groups:
  - Linux servers
zabbix_link_templates:
  - Linux by Zabbix agent

# time out for scripts (drush needs log, if Drupal is used)
zabbix_agent_timeout: 5

agent_interfaces:
#  - type: 1
#    main: 1
#    useip: "{{ zabbix_useuip }}"
#    ip: "{{ agent_ip }}"
#    dns: "{{ ansible_fqdn }}"
#    port: "{{ agent_listenport }}"

zabbix_cleanup_files:
  - /etc/zabbix/zabbix_agentd.conf.dpkg-dist
  - /etc/zabbix/zabbix_agent2.conf.dpkg-dist
  - /etc/systemd/system/multi-user.target.wants/zabbix-agent.service
  - /etc/logrotate.d/zabbix_log_monitor
  - /etc/zabbix/zabbix_agentd.conf
  - /etc/zabbix/zabbix_agentd.d
  - /etc/logrotate.d/zabbix-agent
  - /var/log/zabbix-agent
  - /var/log/zabbix/zabbix_agent2.log
  - /var/log/zabbix_log_monitor.log

# do uninstall zabbix-agent with all data, set it to yes
zabbix_agent_remove: false

# if defined, this is used to host to zabbix server
zabbix_host:

# Failed systemd units that do not turn systemctl.global_status to degraded
# (extended regex, matched against the full unit name).
# SentinelOne runs its own maintenance tasks as transient units, which stay
# failed until reset-failed, although the agent itself keeps running.
zabbix_agent_systemd_failed_ignore:
  - 'sentinel-agent-task-.*\.service'

zabbix_agent_journalctl_since: "4 hours ago"
# Maximum number of lines returned by journalctl[*]. The trigger only checks
# for a non-empty value, the latest lines are enough for diagnosis and keep
# the Zabbix text history small (values above 64 KB are truncated anyway).
zabbix_agent_journalctl_max_lines: 50
zabbix_agent_journalctl_options: '-o short --case-sensitive=false'
# journalctl[*] shows the unit instead of the syslog identifier, so the
# Redmine puma units (checked by redmine_log) can be excluded
zabbix_agent_journalctl_global_options: '-o with-unit --case-sensitive=false'
zabbix_agent_journalctl_redmine_options: '-o json --output-fields=MESSAGE,CODE_FILE,CODE_FUNC,CODE_LINE --case-sensitive=false'

# Keywords for journalctl error detection
zabbix_agent_journalctl_keywords:
  - undefined
  - failed
  - warning
  - missing
  - NilClass
  - error
  - terminating connection
  - cannot allocate memory
  - out of memory
  - too many clients
  - killed
  - QueryCanceled
  - upstream timed out
  - deprecated and will be removed
  # Postfix logs a failed delivery to the relay at info priority and only
  # mentions the cause in the text, e.g. "connect to ...: Connection timed out"
  - Connection timed out
  - Connection refused
  # Any mail delivery postponed by postfix. On relay clients this always
  # means the relay is not usable, whatever the reason. A mail server
  # delivering to the internet needs a host-specific ignore instead.
  - status=deferred

# Keywords and ignore patterns are written to pattern files (one extended
# regex per line, case-insensitive) in this directory and read by
# journal_check.sh at runtime. This keeps the UserParameter lines short,
# the agent refuses to start with a configuration line above 2048 bytes.
zabbix_agent_journal_patterns_dir: /etc/zabbix/journal

# Patterns to ignore in journalctl output (host-specific additions possible).
# journalctl[*] scans the whole journal, so the patterns must not rely on the
# syslog identifier (e.g. postfix/smtpd), that output only shows the unit.
zabbix_agent_journalctl_ignore: []
zabbix_agent_journalctl_ignore_all:
  - RoutingError
  - 'WARNING\: Detected'
  - 'Redis does not require authentication'
  # Ansible runs: task headers and the recap line of a successful run
  # contain keywords like "failed=0". Real failures still show up with
  # "fatal:" or a non-zero failed counter.
  - 'TASK \[[^]]*\] \*\*\*'
  - 'unreachable=[0-9]+ +failed=0 '
  # Every Ansible module logs its arguments on the target host, paths like
  # error_pages or error.log would match keywords after each rollout.
  # Failures are reported by the controller, not by these lines.
  - 'ansible-[a-z0-9_.]+ Invoked with'
  # Debian 13 on VMs without vsock support logs this on every boot and
  # daemon-reload, it does not affect ssh
  - 'Failed to query local AF_VSOCK CID'
  - 'systemd-ssh-generator failed with exit status'
  # Debian 13 has no /run/utmp anymore, sshd still tries to record the
  # logout there after each interactive session
  - 'syslogin_perform_logout: logout\(\) returned an error'
  # The agent cannot reach the Zabbix server while it restarts, which hits
  # all hosts at once. A permanent outage cannot be reported through this
  # check anyway, Zabbix detects it by the agent availability.
  - 'cannot connect to \[[^]]+:10051\]'
  # Redmine automation summaries without errors
  - '\(errors: 0, skipped: [0-9]+\)'
  # Scanners probing public web servers
  - 'directory index of .* is forbidden'
  - 'access forbidden by rule'
  - '\(2: No such file or directory\), client:'
  - 'Primary script unknown'
  - 'MathJax/extensions/TeX/no(Errors|Undefined)\.js'
  # Scanners and brute force on public mail and ssh servers. Password
  # attempts are handled by fail2ban. Only the server side (smtpd, which
  # names the SASL mechanism) is ignored, a failed authentication of our own
  # hosts at a relay ("SASL authentication failed; server ... said") stays
  # visible.
  - 'kex_exchange_identification'
  - 'SSL_accept error from'
  - 'SASL (LOGIN|PLAIN|CRAM-MD5|DIGEST-MD5) authentication failed'
  - 'warning: hostname .* does not resolve to address'
  - 'TLS library problem: .*(wrong version number|unexpected eof|no shared cipher|unsupported protocol|http request|version too low|no suitable signature|record layer failure|data length too long|bad key share)'
  - 'warning: non-SMTP command from'
  - 'NOQUEUE: reject: RCPT from .* Protocol error'
  - 'warning: getpeername: Transport endpoint is not connected'
  - '-login: Login aborted'
  # CI job failures on GitLab runners are reported by GitLab itself
  - 'Job failed: exit code'
  - 'job-status=failed'
  # Redmine core sets this Rails option itself, so it is logged on every
  # start of Puma and of Rails based automation tasks and cannot be fixed
  # from our side. Matched by the config key alone to keep the generic
  # "deprecated and will be removed" keyword effective.
  - 'config.active_support.to_time_preserves_timezone'

# Redmine log uses same keywords as journalctl
zabbix_agent_redmine_log: '{{ zabbix_agent_journalctl_keywords }}'

# Patterns to ignore in Redmine logs (host-specific additions possible)
zabbix_agent_redmine_log_ignore: []
zabbix_agent_redmine_log_ignore_all:
  - 'Rack\:\:Multipart\:\:EmptyContentError'
  - 'Puma\:\:HttpParserError'
  - 'Missing template wiki\/edit'
  - 'ignoring zlib error'
  - 'disable forgery protection'
  - 'BBox has zero width or height'
  - 'unrecognized font file starts with'
  - 'error fetching PDF image'
  - 'Image\: error'
  - 'Form stream has unbalanced q\/Q operators'
  - 'convert\-im6\.q16'
  - 'mogrify\-im6\.q16'
  - 'dynamic \:action segment in a route'
  - bypass_ssl_verification
  - 'warning\: already initialized constant'
  - 'warning\: previous definition'
  - 'Failed login for'
  - 'rolling restart'
  - 'deprecated\: layouts\/base\.html\.erb'
  - 'message_type=>.issue_update'
  - 'message_type=>.issue_create'
  - 'message_type=>.issue_destroy'
  - 'message_type=>.wiki_page_update'
  - 'Question as a proc'
  - 'QuestionsAnswer as a proc'
  - 'ContactNote as a proc'
  - 'DealNote as a proc'
  - 'Deal as a proc'
  - 'ReportingLog\: Failed to resolve hostname'
  - 'logged_type=>.AutomationRule'
  # Internet measurement bots request the entry page with an
  # "Accept: application/json" header. Redmine has no JSON template for these
  # two actions, so Rails answers 406 and logs a "missing a template" line.
  # Client-side content negotiation, not a server problem. Kept narrow on
  # purpose: a 406 on any other controller can only come from an
  # authenticated client and is worth seeing.
  - 'responding with 406. (WelcomeController.index|AccountController.login)'
