---
- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Set installed software
  ansible.builtin.set_fact:
    php_installed: "{{ true if zabbix_agent_check_php_package in ansible_facts.packages else false }}"
    redmine_installed: "{{ true if redmine_instances is defined and redmine_instances | length > 0 else false }}"
    drupal_installed: "{{ True if drupal_instances is defined and drupal_instances | length > 0 else False }}"

- name: Include rsync role
  ansible.builtin.include_role:
    name: alphanodes.setup.rsync

- name: Cleanup obsolete files (before installation)
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop: '{{ zabbix_cleanup_files }}'

- name: Include setup apt tasks
  ansible.builtin.import_tasks: setup_apt.yml

- name: Remove old zabbix-agent package if installed
  ansible.builtin.apt:
    name: zabbix-agent
    state: absent
    purge: true

- name: Ensure zabbix-agent packages are installed
  ansible.builtin.apt:
    name: '{{ zabbix_agent_packages }}'
    state: '{{ zabbix_agent_packages_mode }}'

- name: Ensure smartmontools is installed for the SMART plugin
  ansible.builtin.apt:
    name: smartmontools
  when: zabbix_agent_with_smart

- name: Install binary, if provided
  when: zabbix_agent_binary | length > 0
  block:
    - name: Transfer binary file
      ansible.builtin.copy:
        src: 'binaries//{{ zabbix_agent_binary }}'
        dest: /srv/software/
        mode: '0644'

    - name: Install binary file
      ansible.builtin.apt:
        deb: '/srv/software/{{ zabbix_agent_binary }}'
        force: true

- name: Ensure zabbix-addon directories exists
  ansible.builtin.file:
    path: '{{ item }}'
    mode: '0755'
    state: directory
  loop:
    - '{{ zabbix_addons_dir }}/conf'
    - '{{ zabbix_addons_dir }}/scripts'

- name: Install zabbix-addon php configuration
  ansible.builtin.copy:
    src: zabbix-addons/conf/php
    dest: '{{ zabbix_addons_dir }}/conf'
    mode: '0644'
    directory_mode: '0755'
  notify: Restart zabbix-agent
  when: php_installed

- name: Remove php configuration, if not required
  ansible.builtin.file:
    path: '{{ zabbix_addons_dir }}/conf/php'
    state: absent
  when: not php_installed

- name: Make sure custom configuration directory exists
  ansible.builtin.file:
    path: /etc/zabbix/zabbix_agent2.d
    state: directory
    recurse: true

- name: Make sure journal pattern directory exists
  ansible.builtin.file:
    path: '{{ zabbix_agent_journal_patterns_dir }}'
    state: directory
    mode: '0755'

# Read by journal_check.sh at runtime, no agent restart required
- name: Install journal pattern files
  ansible.builtin.template:
    src: etc/zabbix/journal/patterns.list.j2
    dest: '{{ zabbix_agent_journal_patterns_dir }}/{{ item.name }}.list'
    mode: '0644'
  loop:
    - name: keywords
      patterns: '{{ zabbix_agent_journalctl_keywords }}'
    - name: ignore
      patterns: '{{ zabbix_agent_journalctl_ignore_all + zabbix_agent_journalctl_ignore }}'
  loop_control:
    label: '{{ item.name }}'

# Only read by the Redmine UserParameters, which exist on Redmine hosts only
- name: Install Redmine journal pattern files
  ansible.builtin.template:
    src: etc/zabbix/journal/patterns.list.j2
    dest: '{{ zabbix_agent_journal_patterns_dir }}/{{ item.name }}.list'
    mode: '0644'
  loop:
    - name: redmine_keywords
      patterns: '{{ zabbix_agent_redmine_log }}'
    - name: redmine_ignore
      patterns: '{{ zabbix_agent_journalctl_ignore_all + zabbix_agent_redmine_log_ignore_all + zabbix_agent_redmine_log_ignore }}'
  loop_control:
    label: '{{ item.name }}'
  when: redmine_installed

- name: Remove Redmine journal pattern files on hosts without Redmine
  ansible.builtin.file:
    path: '{{ zabbix_agent_journal_patterns_dir }}/{{ item }}.list'
    state: absent
  loop:
    - redmine_keywords
    - redmine_ignore
  when: not redmine_installed

- name: Update zabbix-agent configuration
  ansible.builtin.template:
    src: etc/zabbix/zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    mode: '0644'
  notify: Restart zabbix-agent

# UserParameters live in /etc/zabbix/zabbix_agent2.d, never in the main
# configuration. A check belongs to the role that provides what it needs:
# - here, as userparameter_<group>.conf: checks that use scripts or settings
#   of this role, or whose software has no single role (PHP comes from
#   php_fpm or php_cli, pulled in by many roles). This role detects the
#   software, so it removes the file even when the other role no longer
#   runs on the host.
# - in the other role (e.g. fail2ban.conf, gitlab.conf): checks that only
#   need what that role installs (sudo rule, template), removed by its
#   remove tasks or without zabbix_monitoring.
- name: Set the UserParameter groups of this host
  ansible.builtin.set_fact:
    zabbix_agent_userparameter_groups: >-
      {{ ['journal', 'linux', 'systemd']
         + (['php'] if php_installed else [])
         + (['drupal'] if drupal_installed | bool else [])
         + (['redmine'] if redmine_installed else []) }}

- name: Set the UserParameter files of this host
  ansible.builtin.set_fact:
    zabbix_agent_userparameter_paths: >-
      {{ ['/etc/zabbix/zabbix_agent2.d/userparameter_'] | product(zabbix_agent_userparameter_groups)
         | map('join') | map('regex_replace', '$', '.conf') | list }}

- name: Install UserParameter files
  ansible.builtin.template:
    src: 'etc/zabbix/zabbix_agent2.d/userparameter_{{ item }}.conf.j2'
    dest: '/etc/zabbix/zabbix_agent2.d/userparameter_{{ item }}.conf'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ zabbix_agent_userparameter_groups }}'
  notify: Restart zabbix-agent

# Only the userparameter_ prefix of this role, other roles keep their files
# (e.g. fail2ban.conf, gitlab.conf)
- name: Find UserParameter files of this role
  ansible.builtin.find:
    paths: /etc/zabbix/zabbix_agent2.d
    patterns: userparameter_*.conf
  register: zabbix_agent_userparameter_files

- name: Remove UserParameter files of groups not active on this host
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop: >-
    {{ zabbix_agent_userparameter_files.files | map(attribute='path') | list
       | difference(zabbix_agent_userparameter_paths) }}
  notify: Restart zabbix-agent

- name: Remove old mysql configuration query files
  ansible.builtin.file:
    path: /etc/zabbix/zabbix_agentd.d/{{ item }}
    state: absent
  loop:
    - alphanodes.conf
    - userparameter_mysql.conf.dpkg-dist

- name: Make sure old configuration file is absent
  ansible.builtin.file:
    path: /usr/share/alphanodes/zabbix/conf/mysql_query.list
    state: absent

# nginx_mono renders the monitoring server block itself now. Vhosts written
# by older versions still include this file, so keep it until none does.
- name: Find nginx configurations including the old status file
  ansible.builtin.find:
    paths: /etc/nginx
    recurse: true
    contains: '.*nginx-server-status\.conf'
  register: zabbix_agent_old_nginx_status

- name: Remove old nginx status file
  ansible.builtin.file:
    path: '{{ zabbix_addons_dir }}/conf/nginx-server-status.conf'
    state: absent
  when: zabbix_agent_old_nginx_status.matched == 0

- name: Install zabbix scripts
  ansible.builtin.template:
    src: zabbix-addons/scripts/{{ item }}.j2
    dest: '{{ zabbix_addons_dir }}/scripts/{{ item }}'
    mode: '0755'
    owner: root
    group: zabbix
  loop:
    - linux_check.sh
    - journal_check.sh
    - systemd_status.sh
    - php_check.sh
  notify: Restart zabbix-agent

# Disk statistics come from the block device discovery of the official
# Linux template, the own Disk Performance template is gone
- name: Remove obsolete disk discovery script
  ansible.builtin.file:
    path: '{{ zabbix_addons_dir }}/scripts/diskstats_lld.py'
    state: absent

- name: Install zabbix drush script
  ansible.builtin.template:
    src: zabbix-addons/scripts/drush_check.sh.j2
    dest: '{{ zabbix_addons_dir }}/scripts/drush_check.sh'
    mode: '0755'
    owner: root
    group: zabbix
  when: drupal_installed | bool

- name: Remove zabbix drush script
  ansible.builtin.file:
    path: '{{ zabbix_addons_dir }}/scripts/drush_check.sh'
    state: absent
  when: not drupal_installed | bool

# The package sets home and shell. usermod refuses to change the home
# directory while the agent runs, so only add the groups here.
- name: Set zabbix user settings
  ansible.builtin.user:
    name: zabbix
    groups:
      - adm
      - www-data
    append: true

- name: Read the sudo implementation for the SMART rules
  ansible.builtin.command: readlink -f /usr/bin/sudo
  register: zabbix_agent_sudo_impl
  changed_when: false
  check_mode: false
  when: zabbix_agent_with_smart

# sudo-rs takes [..] in arguments literally (newer releases reject the file)
- name: Set whether the SMART sudo rules can be used
  ansible.builtin.set_fact:
    zabbix_agent_smart_sudo: >-
      {{ zabbix_agent_with_smart
         and not (zabbix_agent_sudo_impl.stdout | default('') is search('sudo-rs|cargo')) }}

- name: Warn that SMART needs the classic sudo
  ansible.builtin.debug:
    msg: 'sudo-rs does not support the SMART sudo rules, the SMART plugin will get no data'
  when: zabbix_agent_with_smart and not zabbix_agent_smart_sudo

- name: Install suoder zabbix configuration
  ansible.builtin.template:
    src: etc/sudoers.d/zabbix.j2
    dest: /etc/sudoers.d/zabbix
    mode: '0440'
    # A broken file in sudoers.d disables sudo on the whole host
    validate: visudo -cf %s

- name: Start the zabbix-agent2 service
  ansible.builtin.systemd_service:
    name: zabbix-agent2
    state: started
  register: systemd_rc

- name: Cleanup obsolete files (after installation)
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop: '{{ zabbix_cleanup_files }}'
