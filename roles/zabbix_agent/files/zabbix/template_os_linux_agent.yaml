---
zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 846977d1dfed4968bc5f8bdb363285bc
      name: 'Templates/Operating systems'
  templates:
    - uuid: c1c3a11a4e714521aedd204220c9f8f7
      template: Linux
      name: Linux
      description: |
        Base template for Linux hosts: sshd hardening (effective settings,
        offered login methods, Match blocks, key sources), world-writable
        files in /etc, the host name in /etc/hosts, accounts with a password,
        memory per process group, invalid logins and the overall systemd state.

        It links the official "Linux by Zabbix agent" template and the Journal
        and Services templates of this collection, so a host only needs this
        one (or a template that links it).

        This template requires:
        - Zabbix agent with UserParameter linux[*], security_log[*] and
          systemctl.global_status configured by the alphanodes.setup.zabbix_agent
          role
        - the Journal and Services templates imported before this one
      vendor:
        name: AlphaNodes
        version: 7.4-__DATE__
      templates:
        - name: Journal
        - name: 'Linux by Zabbix agent'
        - name: Services
      groups:
        - name: 'Templates/Operating systems'
      items:
        - uuid: fda76b21f6b14988bdb560b6aa186142
          name: 'Accounts with password'
          key: 'linux[password_accounts,users]'
          delay: 2h
          history: 90d
          value_type: CHAR
          description: 'Accounts with a usable password (passwd -S -a), "none" if all accounts are locked or key only.'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: 7e800a13042c480fb64232096c521ea0
              expression: 'last(/Linux/linux[password_accounts,users],#1)<>last(/Linux/linux[password_accounts,users],#2) and last(/Linux/linux[password_accounts,users],#1)<>"-0.9902" and last(/Linux/linux[password_accounts,users],#2)<>"-0.9902"'
              name: 'Accounts with password changed: {ITEM.LASTVALUE}'
              priority: WARNING
              manual_close: 'YES'
              description: |
                The list of accounts with a usable password changed. A new entry
                can be a backdoor or a password set by hand. Compare with the
                previous value in the item history and run passwd -S -a on the host.
        - uuid: 477c21a343c94c36905084b2a09468eb
          name: 'SSH PasswordAuthentication'
          key: 'linux[PasswordAuthentication,sshd_config]'
          delay: 2h
          history: 2w
          value_type: CHAR
          description: 'Effective PasswordAuthentication of sshd (sshd -T).'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: 32478be4afe340518d38a9ced0f9ca3e
              expression: '(last(/Linux/linux[PasswordAuthentication,sshd_config])="yes" or last(/Linux/linux[PasswordAuthentication,sshd_config])="no") and last(/Linux/linux[PasswordAuthentication,sshd_config])<>"{$SSH.PASSWORD_AUTH}"'
              name: 'SSH PasswordAuthentication = {ITEM.LASTVALUE}, expected {$SSH.PASSWORD_AUTH}'
              priority: WARNING
              description: |
                The effective PasswordAuthentication of sshd differs from the
                configured one. The zabbix_agent role sets {$SSH.PASSWORD_AUTH}
                to yes on hosts with ssh_server_password_authentication, all
                other hosts should allow only key authentication. sshd -T reads
                the files, so if only this problem is open (not "SSH offers
                password login"), the change is written but not loaded yet and
                becomes active with the next restart of ssh.
              dependencies:
                - name: 'SSH offers password login: {ITEM.LASTVALUE}'
                  expression: 'find(/Linux/linux[auth_methods,sshd],,"regexp","(^|,)(password|keyboard-interactive)(,|$)")=1 and "{$SSH.PASSWORD_AUTH}"="no"'
            - uuid: 831d2f0cf5cc4b74959781916c042046
              expression: 'last(/Linux/linux[PasswordAuthentication,sshd_config])<>"yes" and last(/Linux/linux[PasswordAuthentication,sshd_config])<>"no"'
              name: 'SSH configuration check failed'
              priority: WARNING
              description: |
                sshd -T returned no PasswordAuthentication value, so all sshd_config
                checks are blind. Check the sudoers rule for zabbix and run
                sudo -u zabbix sudo -n /usr/sbin/sshd -T on the host.
        - uuid: 34d19a2c402e4f6ba74f0f83c8e575c7
          name: 'SSH offered authentication methods'
          key: 'linux[auth_methods,sshd]'
          delay: 1h
          history: 2w
          value_type: CHAR
          description: 'Authentication methods the running sshd offers, from a local login without authentication. Unlike sshd -T this is the loaded configuration and includes keyboard-interactive (PAM).'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: bf0a3698b787484bb39af0e5b7ebbb52
              expression: 'find(/Linux/linux[auth_methods,sshd],,"regexp","(^|,)(password|keyboard-interactive)(,|$)")=1 and "{$SSH.PASSWORD_AUTH}"="no"'
              name: 'SSH offers password login: {ITEM.LASTVALUE}'
              priority: AVERAGE
              description: |
                The running sshd accepts passwords (password or PAM
                keyboard-interactive), although {$SSH.PASSWORD_AUTH} expects key
                authentication only. Check sshd -T and the files of sshd_config.d,
                lines above the Include of sshd_config win against the ssh role.
            - uuid: 9888c6d1e6134f8ea4b8ee17e1f1b3f1
              expression: 'last(/Linux/linux[auth_methods,sshd])="-0.9902"'
              name: 'SSH login check failed'
              priority: WARNING
              description: |
                The local login without authentication returned no list of
                methods. Run sudo -u zabbix bash linux_check.sh auth_methods sshd
                on the host, sshd may not listen on the address of sshd -T.
        - uuid: e479846dd0ac4b2e9e11debbb319ec48
          name: 'SSH AuthorizedKeysCommand'
          key: 'linux[AuthorizedKeysCommand,sshd_config]'
          delay: 2h
          history: 2w
          value_type: CHAR
          description: 'Effective AuthorizedKeysCommand of sshd (sshd -T), a source of keys besides authorized_keys.'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: 387834d30e6d49ca9c6ed5930b428ddd
              expression: 'last(/Linux/linux[AuthorizedKeysCommand,sshd_config])<>"{$SSH.AUTHORIZED_KEYS_COMMAND}" and last(/Linux/linux[AuthorizedKeysCommand,sshd_config])<>"-0.9902"'
              name: 'SSH AuthorizedKeysCommand = {ITEM.LASTVALUE}, expected {$SSH.AUTHORIZED_KEYS_COMMAND}'
              priority: WARNING
              description: |
                sshd takes keys from a command besides authorized_keys, e.g. Google
                OS Login. Users of that source can log in without a key managed
                by the ssh role. Hosts that use it on purpose get the expected
                value from zabbix_agent_ssh_authorized_keys_command.
        - uuid: f44748e54de6402287423fb618a29220
          name: 'SSH TrustedUserCAKeys'
          key: 'linux[TrustedUserCAKeys,sshd_config]'
          delay: 2h
          history: 2w
          value_type: CHAR
          description: 'Effective TrustedUserCAKeys of sshd (sshd -T), certificates of these CAs log in without authorized_keys.'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: 2f119e0947544e91b7fa6466242a5094
              expression: 'last(/Linux/linux[TrustedUserCAKeys,sshd_config])<>"{$SSH.TRUSTED_USER_CA_KEYS}" and last(/Linux/linux[TrustedUserCAKeys,sshd_config])<>"-0.9902"'
              name: 'SSH TrustedUserCAKeys = {ITEM.LASTVALUE}, expected {$SSH.TRUSTED_USER_CA_KEYS}'
              priority: WARNING
              description: |
                sshd accepts user certificates of a CA, e.g. Google OS Login. Hosts
                that use it on purpose get the expected value from
                zabbix_agent_ssh_trusted_user_ca_keys.
        - uuid: 14506fc69a544ed283e4a01063c48f2a
          name: 'SSH Match blocks allowing passwords'
          key: 'linux[match_password,sshd]'
          delay: 2h
          history: 2w
          value_type: FLOAT
          description: 'Match blocks that set PasswordAuthentication, KbdInteractiveAuthentication, ChallengeResponseAuthentication or PermitEmptyPasswords to yes, in sshd_config and all files of its Include lines. sshd -T only shows the global values.'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: 26c67685ccf340618e69f94e742aeb64
              expression: 'last(/Linux/linux[match_password,sshd])>=0 and last(/Linux/linux[match_password,sshd])<>{$SSH.MATCH_PASSWORD_AUTH}'
              name: 'SSH {ITEM.LASTVALUE} Match blocks allow passwords, expected {$SSH.MATCH_PASSWORD_AUTH}'
              priority: WARNING
              description: |
                A Match block allows passwords for some users or addresses. The
                zabbix_agent role sets the expected number from the Match blocks
                of the ssh role that allow passwords. Search sshd_config and the
                files of its Include lines for Match.
            - uuid: e7253255f04e4d349756819da5753ff9
              expression: 'last(/Linux/linux[match_password,sshd])<0'
              name: 'SSH Match check failed'
              priority: WARNING
              description: 'sshd_match_check.sh could not read sshd_config or a file of its Include lines. Run sudo -u zabbix sudo -n sshd_match_check.sh on the host.'
        - uuid: 70631fb4ec9b46d8bbbd3925641d5661
          name: 'SSH PermitEmptyPasswords'
          key: 'linux[PermitEmptyPasswords,sshd_config]'
          delay: 2h
          history: 2w
          value_type: CHAR
          description: 'SSHD Config: PermitEmptyPasswords should be set to no (all users must use passwords/keys). Restart sshd with systemctl restart ssh after making changes.'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: 21f6aef03eb94d86b6fa635b62276bac
              expression: 'find(/Linux/linux[PermitEmptyPasswords,sshd_config],,"like","yes")=1'
              name: 'SSH PermitEmptyPasswords = yes'
              priority: WARNING
              description: 'SSHD Config: PermitEmptyPasswords should be set to no (all users must use passwords/keys). Restart sshd with systemctl restart ssh after making changes.'
        - uuid: bf635bfdf49745fba9020bb1c716e4a6
          name: 'Server name in /etc/hosts'
          key: 'linux[server_name_in_hosts,performance]'
          delay: 2h
          history: 2w
          value_type: CHAR
          description: 'For performance reasons the server name should be in /etc/hosts.'
          tags:
            - tag: Application
              value: Performance
          triggers:
            - uuid: f6cb6758d524494d9955925b83fb10a2
              expression: 'find(/Linux/linux[server_name_in_hosts,performance],,"like","no")=1'
              name: 'Server name not found in /etc/hosts'
              priority: WARNING
              description: 'There is no entry for the server''s name {HOST.NAME} in /etc/hosts.  This may cause unexpected performance problems for local connections.  Add the IP and name in /etc/hosts, eg: 192.168.0.1 {HOST.NAME}'
        - uuid: 6981993e93ea4502aafa34e266ae2f25
          name: 'SSH StrictModes'
          key: 'linux[StrictModes,sshd_config]'
          delay: 2h
          history: 2w
          value_type: CHAR
          description: 'SSHD Config: StrictModes should be set to yes (to check file permissions of files such as ~/.ssh, ~/.ssh/authorized_keys etc). Restart sshd with systemctl restart ssh after making changes.'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: dd067091b0104589b9f64e593c701ea7
              expression: 'find(/Linux/linux[StrictModes,sshd_config],,"like","no")=1'
              name: 'SSH StrictModes = no'
              priority: WARNING
              description: 'SSHD Config: StrictModes should be set to yes (to check file permissions of files such as ~/.ssh, ~/.ssh/authorized_keys etc). Restart sshd with systemctl restart ssh after making changes.'
        - uuid: 7aefd116993e46deb8f5f62dad6efc9d
          name: 'World-writable in /etc'
          key: 'linux[world_write_etc,perm]'
          delay: 2h
          history: 2w
          description: |
            There are files or folders in /etc which are world writable.  It is a security risk to have world-writables in this folder, as they may be executed by other scripts as root.
            Find all files with: find /etc -type f -perm -002
            Find all folders with: find /etc -type d -perm -002
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: eec19b97a1f744bf99d361e3e9294be3
              expression: 'last(/Linux/linux[world_write_etc,perm])>0'
              name: 'World-writable files in /etc'
              priority: WARNING
              description: |
                Warning: There are files or folders in /etc which are world writable.  It is a security risk to have world-writables in this folder, as they may be executed by other scripts as root.
                Find all files with: find /etc -type f -perm -002
                Find all folders with: find /etc -type d -perm -002
        - uuid: 518b9e9aee534d11b5a0adbac99dfd3a
          name: 'SSH X11Forwarding'
          key: 'linux[X11Forwarding,sshd_config]'
          delay: 2h
          history: 2w
          value_type: CHAR
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: 5ca31ce43f7542c7a58ebf46ebaf0164
              expression: 'find(/Linux/linux[X11Forwarding,sshd_config],,"like","yes")=1'
              name: 'SSH X11Forwarding = yes'
              priority: INFO
              description: 'SSHD Config: X11Forwarding should be set to no (unless needed). Restart sshd with systemctl restart ssh after making changes.'
        - uuid: 02c78b24bdc2400694ad10a04f744b35
          name: 'Process memory: Python'
          key: 'proc.mem[,,,^/usr/bin/python]'
          delay: 2m
          history: 2w
          value_type: FLOAT
          tags:
            - tag: Application
              value: Memory
        - uuid: c112cb7a05274b1d9a705c124bca833e
          name: 'Process memory: Puma'
          key: 'proc.mem[,,,^puma]'
          delay: 2m
          history: 2w
          value_type: FLOAT
          tags:
            - tag: Application
              value: Memory
        - uuid: e217d2bd25d0407fb46bffab3cf4ba99
          name: 'Process memory: root'
          key: 'proc.mem[,root]'
          delay: '2m;50s/1-7,00:00-24:00'
          history: 2w
          value_type: FLOAT
          tags:
            - tag: Application
              value: Memory
        - uuid: 733534250ee34efcb3b5b760779ca582
          name: 'Process memory: www-data'
          key: 'proc.mem[,www-data]'
          delay: 2m
          history: 2w
          value_type: FLOAT
          tags:
            - tag: Application
              value: Memory
        - uuid: 9fa219a6dfec452d844a6aae6199845b
          name: 'Process memory: Zabbix'
          key: 'proc.mem[,zabbix]'
          delay: 2m
          history: 2w
          value_type: FLOAT
          tags:
            - tag: Application
              value: Memory
        - uuid: 4545f4abffd94853b1b3a4ff2bae9c49
          name: 'Process memory: Java'
          key: 'proc.mem[java]'
          delay: 2m
          history: 2w
          value_type: FLOAT
          tags:
            - tag: Application
              value: Memory
        - uuid: fb9c9f06c312457da2a5751d6bf3e6b0
          name: 'Process memory: MySQL'
          key: 'proc.mem[mysqld]'
          delay: '2m;50s/1-7,00:00-24:00'
          history: 2w
          value_type: FLOAT
          tags:
            - tag: Application
              value: Memory
        - uuid: 4c8df859e7694dc786c509cff03e36b9
          name: 'Process memory: PostgreSQL'
          key: 'proc.mem[postgres]'
          delay: 2m
          history: 2w
          value_type: FLOAT
          tags:
            - tag: Application
              value: Memory
        - uuid: 1b6e4b2b74f6482984bc781c1ba4ead8
          name: 'Process memory: total'
          key: 'proc.mem[]'
          delay: 2m
          history: 2w
          value_type: FLOAT
          tags:
            - tag: Application
              value: Memory
        - uuid: fd93adbf7b9b4b8d8eb4ccc36693942d
          name: 'Invalid Logins'
          key: 'security_log[{$SECURITY_LOG_HOURS}]'
          delay: 5m
          history: 10d
          value_type: TEXT
          tags:
            - tag: Application
              value: Security
        - uuid: 399a5ec4a7a3418589e490bd438569de
          name: 'Systemd unit status'
          key: systemctl.global_status
          delay: 5m
          history: 2w
          value_type: CHAR
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 8271a61d36cf445a8b9730364a451dbc
              expression: 'last(/Linux/systemctl.global_status)<>"" and last(/Linux/systemctl.global_status)<>"State: running"'
              name: 'Systemd global status'
              priority: AVERAGE
              description: 'Run ''systemctl --failed'' on server, to find out which services failed.'
        - uuid: a426cd430ba1484f85b61bcd580d3e1c
          name: 'Postfix: Mails in queue'
          key: 'linux[queue_count,postfix]'
          delay: 5m
          history: 2w
          description: 'Mails in the postfix queue (postqueue -j), 0 without postfix.'
          tags:
            - tag: component
              value: mail
          triggers:
            - uuid: 1a00a0e872a7469c96cf789f943c5cdb
              expression: 'min(/Linux/linux[queue_count,postfix],15m)>{$POSTFIX.QUEUE.COUNT.MAX}'
              name: 'Postfix: More than {$POSTFIX.QUEUE.COUNT.MAX} mails in queue'
              priority: WARNING
              description: |
                Many mails wait for delivery, e.g. a local process sends mails in a
                loop or the relay rejects them. Run postqueue -p on the host.
        - uuid: 09cf18c9b5654211985f60555dd35736
          name: 'Postfix: Age of oldest mail in queue'
          key: 'linux[queue_age,postfix]'
          delay: 5m
          history: 2w
          units: s
          description: 'Age of the oldest mail in the postfix queue, 0 if the queue is empty or without postfix.'
          tags:
            - tag: component
              value: mail
          triggers:
            - uuid: 3f8fde3bedfe479c93a7615e8ad55994
              expression: 'min(/Linux/linux[queue_age,postfix],15m)>{$POSTFIX.QUEUE.AGE.MAX}'
              name: 'Postfix: Mail queue stuck (oldest mail older than {$POSTFIX.QUEUE.AGE.MAX})'
              priority: WARNING
              description: |
                A mail could not be delivered for hours. The journal checks ignore
                deferred deliveries, so a relay that keeps rejecting mails (wrong
                credentials, sender not allowed) only shows up here. Run postqueue -p
                on the host for the reason.
      macros:
        - macro: '{$LOAD_AVG_PER_CPU.MAX.WARN}'
          value: '3'
        - macro: '{$POSTFIX.QUEUE.AGE.MAX}'
          value: 4h
          description: 'Age of the oldest mail in the postfix queue that triggers a problem'
        - macro: '{$POSTFIX.QUEUE.COUNT.MAX}'
          value: '100'
          description: 'Number of mails in the postfix queue that triggers a problem'
        - macro: '{$SECURITY_LOG_HOURS}'
          value: '12'
          description: 'Time window in hours for the invalid logins check'
        - macro: '{$SSH.AUTHORIZED_KEYS_COMMAND}'
          value: none
          description: 'Expected AuthorizedKeysCommand of sshd, set per host by the zabbix_agent role'
        - macro: '{$SSH.MATCH_PASSWORD_AUTH}'
          value: '0'
          description: 'Expected number of Match blocks that allow passwords, set per host by the zabbix_agent role'
        - macro: '{$SSH.PASSWORD_AUTH}'
          value: 'no'
          description: 'Expected PasswordAuthentication of sshd, set per host by the zabbix_agent role'
        - macro: '{$SSH.TRUSTED_USER_CA_KEYS}'
          value: none
          description: 'Expected TrustedUserCAKeys of sshd, set per host by the zabbix_agent role'
      dashboards:
        - uuid: b71c4aee60884803b06044ffa9a577ab
          name: 'Memory overview'
          pages:
            - widgets:
                - type: graph
                  width: '36'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid
                      value:
                        host: Linux
                        name: 'Process memory distribution'
                    - type: STRING
                      name: reference
                      value: AAABH
                - type: graph
                  'y': '5'
                  width: '36'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid
                      value:
                        host: Linux
                        name: 'Linux: Swap usage'
                    - type: STRING
                      name: reference
                      value: AAABI
                - type: graph
                  x: '36'
                  width: '36'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid
                      value:
                        host: Linux
                        name: 'Linux: Memory usage'
                    - type: STRING
                      name: reference
                      value: AAAAA
                - type: graph
                  x: '36'
                  'y': '5'
                  width: '36'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid
                      value:
                        host: Linux
                        name: 'Linux: Memory utilization'
                    - type: STRING
                      name: reference
                      value: AAABJ
  graphs:
    - uuid: 64d1ab0256c145c0aa9d0535a5b80755
      name: 'Process memory distribution'
      show_work_period: 'NO'
      show_triggers: 'NO'
      type: STACKED
      ymin_type_1: FIXED
      graph_items:
        - color: 0000C8
          calc_fnc: MAX
          item:
            host: Linux
            key: 'proc.mem[,root]'
        - sortorder: '1'
          color: 00C800
          calc_fnc: MAX
          item:
            host: Linux
            key: 'proc.mem[mysqld]'
        - sortorder: '2'
          color: '007700'
          calc_fnc: MAX
          item:
            host: Linux
            key: 'proc.mem[postgres]'
        - sortorder: '3'
          color: 00C8C8
          calc_fnc: MAX
          item:
            host: Linux
            key: 'proc.mem[,www-data]'
        - sortorder: '4'
          color: C8C800
          calc_fnc: MAX
          item:
            host: Linux
            key: 'proc.mem[,zabbix]'
        - sortorder: '5'
          color: C800C8
          calc_fnc: MAX
          item:
            host: Linux
            key: 'proc.mem[,,,^puma]'
        - sortorder: '6'
          color: 611F27
          calc_fnc: MAX
          item:
            host: Linux
            key: 'proc.mem[,,,^/usr/bin/python]'
        - sortorder: '7'
          color: '999999'
          calc_fnc: MAX
          item:
            host: Linux
            key: 'proc.mem[java]'
