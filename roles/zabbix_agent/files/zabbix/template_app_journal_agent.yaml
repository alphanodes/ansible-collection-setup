zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 846977d1dfed4968bc5f8bdb363285bc
      name: 'Templates/Operating systems'
  templates:
    - uuid: 2f0fa87d321641278b69d6d9caefdf9a
      template: Journal
      name: Journal
      description: |
        Scans the whole systemd journal for error keywords, so problems of
        services without a dedicated check (postfix, redis, postgresql, ...)
        do not go unnoticed.

        Link this template into the "Linux" template, so every host gets it
        through its template chain. Do not link it to hosts directly.

        This template requires:
        - Zabbix agent with UserParameter journalctl[*] configured by the
          alphanodes.setup.zabbix_agent role

        Keywords and ignore patterns are set in the inventory
        (zabbix_agent_journalctl_keywords, zabbix_agent_journalctl_ignore_all
        and the host-specific zabbix_agent_journalctl_ignore), the scanned
        time window with zabbix_agent_journalctl_since.

        Set the host macro {$JOURNAL.ALERT} to 0 to silence the trigger on a
        host that cannot run the check (e.g. an unsupported distribution).
        A host macro survives template imports, disabling the inherited
        trigger does not.
      vendor:
        name: AlphaNodes
        version: 7.4-__DATE__
      groups:
        - name: 'Templates/Operating systems'
      macros:
        - macro: '{$JOURNAL.ALERT}'
          value: '1'
          description: 'Set to 0 on a host to silence the journal trigger.'
      items:
        - uuid: ab7889574439459280758aebb6032980
          name: 'Journal: Error messages'
          type: ZABBIX_ACTIVE
          key: 'journalctl[]'
          delay: 10m
          history: 2w
          trends: '0'
          value_type: TEXT
          description: 'Journal lines of all units matching the error keywords within the configured time window (default: 4 hours), ignore patterns already applied. Empty means no errors.'
          tags:
            - tag: component
              value: journal
            - tag: log-type
              value: error
          triggers:
            - uuid: 85fc0aa2fef54492ac12e428e6390923
              expression: 'last(/Journal/journalctl[])<>"" and {$JOURNAL.ALERT}=1'
              name: 'Journal: Error messages found'
              priority: WARNING
              description: 'The journal contains error messages. Check the latest item value for details. The trigger resolves once no matching lines are left in the scanned time window. Harmless messages belong into zabbix_agent_journalctl_ignore (host-specific) or zabbix_agent_journalctl_ignore_all.'
              tags:
                - tag: scope
                  value: notice
      tags:
        - tag: class
          value: os
        - tag: target
          value: linux
