---
zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
  templates:
    - uuid: dd0c49d976444f168535b9c1a2db981b
      template: 'IMAP Service'
      name: 'IMAP Service'
      description: |
        Checks from the Zabbix server that IMAPS (port 993) is reachable.

        Uses a simple check, no agent is required.
      vendor:
        name: AlphaNodes
        version: 7.4-__DATE__
      groups:
        - name: Templates/Modules
      items:
        - uuid: 823451f4ebb6437c88c2915ba6d6faad
          name: 'IMAP service is running'
          type: SIMPLE
          key: 'net.tcp.port[,993]'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: 075e6217564d45fdb713f810a9eef87c
              expression: 'max(/IMAP Service/net.tcp.port[,993],#3)=0'
              name: 'IMAP service is down on {HOST.NAME}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
      valuemaps:
        - uuid: 17353d47bd0a4a03a8f3ab799207e157
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
