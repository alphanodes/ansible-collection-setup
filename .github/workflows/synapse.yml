---
name: "alphanodes.setup.synapse"

'on':
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'roles/synapse/**'
      - 'roles/postgresql/**'
      - 'roles/postgresql_client/**'
      - 'roles/nginx_mono/**'
      - 'roles/ssl/**'
      - 'roles/common/**'
      - 'molecule/synapse/**'
      - 'molecule/synapse_remove/**'
      - '.github/workflows/synapse.yml'

defaults:
  run:
    working-directory: 'synapse'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1

    strategy:
      matrix:
        distro:
          - ubuntu2604
          - debian13

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v5
        with:
          path: 'synapse'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies.
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Molecule tests.
        run: |
          molecule --version
          molecule test -s synapse
          molecule test -s synapse_remove
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
