---
name: "alphanodes.setup.mysql_mariadb"
'on':
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'roles/mysql/**'
      - 'roles/common/**'
      - 'molecule/mysql_mariadb/**'
      - '.github/workflows/mysql_mariadb.yml'

defaults:
  run:
    working-directory: 'mysql_mariadb'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1

    strategy:
      fail-fast: false
      matrix:
        distro:
          # Verified green. ubuntu2604 is left out on purpose: MariaDB 11.8.6
          # there fails to start because its system tables are never
          # initialised ("Table 'mysql.db' doesn't exist"). That is a defect of
          # the role on that release, not of this scenario - add the distro
          # back once it is fixed.
          - ubuntu2404
          - debian12
          - debian13

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v5
        with:
          path: 'mysql_mariadb'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies.
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Molecule tests.
        run: |
          molecule --version
          molecule test -s mysql_mariadb
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
