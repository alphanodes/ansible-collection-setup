---
name: Release

'on':
  push:
    tags:
      - '*.*.*'  # only X.Y.Z tags

jobs:
  release:
    name: Publish to Galaxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag format (X.Y.Z)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' hat kein X.Y.Z-Format (z.B. 1.2.3)."
            exit 1
          fi

      - name: Set RELEASE_VERSION from tag
        shell: bash
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # GitHub is a push mirror of GitLab, so the workflow cannot commit a
      # version bump back. galaxy.yml has to carry the version before tagging.
      - name: Ensure galaxy.yml version matches tag
        shell: bash
        run: |
          set -euo pipefail
          current=$(awk '/^version:/ {print $2; exit}' galaxy.yml)
          if [[ "${current}" != "${RELEASE_VERSION}" ]]; then
            echo "::error file=galaxy.yml::galaxy.yml hat Version '${current}', der Tag ist '${RELEASE_VERSION}'. galaxy.yml vor dem Taggen anpassen."
            exit 1
          fi

      - name: Configure Ansible Galaxy token
        shell: bash
        run: |
          mkdir -p ~/.ansible
          # Trim potential newlines/CR from the secret before writing
          CLEAN_TOKEN=$(printf "%s" "${{ secrets.GALAXY_API_KEY }}" | tr -d '\r\n')
          printf "%s" "$CLEAN_TOKEN" > ~/.ansible/galaxy_token
          chmod 600 ~/.ansible/galaxy_token

      - name: Prepare Galaxy token env
        shell: bash
        run: |
          CLEAN_TOKEN=$(printf "%s" "${{ secrets.GALAXY_API_KEY }}" | tr -d '\r\n')
          echo "GALAXY_API_KEY_CLEAN=$CLEAN_TOKEN" >> "$GITHUB_ENV"

      - name: Publish collection to Ansible Galaxy
        uses: artis3n/ansible_galaxy_collection@v2
        with:
          api_key: ${{ env.GALAXY_API_KEY_CLEAN }}
          galaxy_version: ${{ env.RELEASE_VERSION }}
          server: https://galaxy.ansible.com
