---
name: "alphanodes.setup.zammad_nginx"
'on':
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'roles/zammad/**'
      - 'roles/nginx_mono/**'
      - 'roles/ssl/**'
      - 'roles/common/**'
      - 'molecule/zammad_nginx/**'
      - '.github/workflows/zammad_nginx.yml'
defaults:
  run:
    working-directory: zammad_nginx
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - debian13
          - ubuntu2604
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v5
        with:
          path: zammad_nginx
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Zammad gateway authentication tests
        run: molecule test -s zammad_nginx
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
