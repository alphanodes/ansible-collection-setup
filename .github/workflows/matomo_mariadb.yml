---
name: "alphanodes.setup.matomo_mariadb"
'on':
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'roles/matomo/**'
      - 'roles/mysql/**'
      - 'roles/nginx_mono/**'
      - 'roles/common/**'
      - 'molecule/matomo_mariadb/**'
      - '.github/workflows/matomo_mariadb.yml'

defaults:
  run:
    working-directory: 'matomo_mariadb'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1

    strategy:
      fail-fast: false
      matrix:
        distro:
          # Verified green. Both Ubuntu releases are left out on purpose, for
          # two separate defects: on ubuntu2404 the matomo role writes to
          # /etc/apparmor.d/usr.sbin.mysqld, which does not exist with MariaDB
          # (the profile is named usr.sbin.mariadbd); on ubuntu2604 MariaDB
          # 11.8.6 fails to start at all, see the mysql_mariadb workflow.
          - debian12
          - debian13

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v5
        with:
          path: 'matomo_mariadb'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies.
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Molecule tests.
        run: |
          molecule --version
          molecule test -s matomo_mariadb
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
